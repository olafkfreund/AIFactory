openapi: 3.1.0
info:
  title: AIFactory Web API (opt-in surfaces)
  description: Routes enabled by SAML_ENABLED, SCIM_ENABLED, AIFACTORY_MCP_REMOTE_ENABLED, AIFACTORY_RMUX_ENABLED
    and APP_RMUX_ENABLED.
  version: opt-in
paths:
  /api/auth/saml/login:
    get:
      tags:
      - Auth (SAML)
      summary: Begin SAML SP-init flow
      description: 'Redirect the browser to the IdP SSO URL with a fresh AuthnRequest.


        The ``idp`` query param identifies which configured IdP to use; in

        v1.1 we have at most one SAML IdP per release, so this is mostly

        forward-compatible — we still validate it against the configured

        name so a typo''d link fails loud instead of silently picking the

        default.'
      operationId: saml_login_api_auth_saml_login_get
      parameters:
      - name: idp
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idp
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/saml/acs:
    post:
      tags:
      - Auth (SAML)
      summary: SAML Assertion Consumer Service
      description: "Process a signed SAML assertion + mint our session cookie.\n\nTrust pipeline (each\
        \ step rejects on failure):\n\n1. ``OneLogin_Saml2_Auth.process_response()`` — signature, audience,\n\
        \   recipient, NotOnOrAfter, XSW. Refusing here is the most common path.\n2. ``SamlReplayCache.check_and_add()``\
        \ — duplicate-assertion-id rejection.\n3. ``RelayState`` verification (SP-init only) — HMAC, expiry,\
        \ ``idp``\n   matches the configured one.\n4. User lookup by email — 403 if SCIM hasn't provisioned\
        \ the row.\n5. Cross-IdP collision guard — 409 if another-kind identity exists.\n\nOn success:\
        \ insert/keep the ``ExternalIdentity`` row, stamp\n``users.last_login_at``, set the access-token\
        \ cookie, 302 to\n``return_to``."
      operationId: saml_acs_api_auth_saml_acs_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_saml_acs_api_auth_saml_acs_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/saml/metadata:
    get:
      tags:
      - Auth (SAML)
      summary: Public SP metadata XML
      description: 'Return the SP metadata XML the operator uploads at the IdP.


        Cacheable; idempotent; safe to expose without auth (the IdP fetches

        this from a public URL by design).


        When ``SAML_SLO_ENABLED=true`` the metadata XML includes a

        ``<SingleLogoutService>`` element advertising the HTTP-POST binding

        for the ``/sls`` endpoint (v1.2 decision D-6).'
      operationId: saml_metadata_api_auth_saml_metadata_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/auth/saml/logout:
    post:
      tags:
      - Auth (SAML)
      summary: SP-initiated SAML SLO
      description: "Begin a SP-initiated Single Logout.\n\n1. Read the user's NameID (email) from the\
        \ access-token cookie.\n   Returns 401 when no authenticated session is present — there is\n \
        \  nothing to log out from.\n2. Mint an HMAC-signed RelayState carrying {nameid, nonce, exp}\n\
        \   so the SLS callback can detect tampering.\n3. Build a signed SAML LogoutRequest via the OneLogin\
        \ SDK\n   (``auth.logout()``).\n4. Redirect the browser to the IdP's SLO URL.\n\nReturns 404 when\
        \ ``SAML_SLO_ENABLED`` is false (default; backward compat).\nReturns 503 when SAML config is incomplete.\n\
        Returns 503 when the IdP metadata does not advertise a SLO endpoint and\nno ``SAML_IDP_SLO_URL``\
        \ override is set."
      operationId: saml_logout_api_auth_saml_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/auth/saml/sls:
    post:
      tags:
      - Auth (SAML)
      summary: SAML Single Logout Service
      description: "Single Logout Service — handles both SP-init confirmation and IdP-init.\n\n**SP-init\
        \ confirmation** (browser returns from IdP after we initiated SLO):\n- ``SAMLResponse`` is present,\
        \ ``RelayState`` is our HMAC-signed token.\n- Validate signature + status. Verify RelayState HMAC.\
        \ Clear cookies.\n- 302 to the login page.\n\n**IdP-init** (IdP sends a ``LogoutRequest`` to terminate\
        \ a session):\n- ``SAMLRequest`` is present.\n- Validate signature + audience + replay.\n- Clear\
        \ session cookies in the HTTP response.\n- Return a signed ``LogoutResponse`` (auto-submit POST\
        \ form or redirect).\n- Uses ``NoSession`` status when the SP has no live session for the\n  NameID\
        \ (per decision D-2 — never return 4xx for unknown NameID).\n\nReturns 404 when ``SAML_SLO_ENABLED``\
        \ is false.\nReturns 400 on any validation failure (tampered RelayState, bad signature,\nreplay,\
        \ missing required fields)."
      operationId: saml_sls_api_auth_saml_sls_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_saml_sls_api_auth_saml_sls_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /scim/v2/Users:
    post:
      tags:
      - SCIM
      summary: Scim Create User
      description: Create a SCIM User. 409 on email collision. 400 if userName != emails[0].value.
      operationId: scim_create_user_scim_v2_Users_post
      security:
      - HTTPBearer: []
      parameters:
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScimUser'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - SCIM
      summary: Scim List Users
      description: 'List Users with optional filter + paging.


        Soft-deleted users (``is_active=false``) are excluded by default.

        They are included ONLY when the filter is ``active eq false``.

        This matches Azure AD''s sync pattern: it lists all active users

        during normal sync; listing inactive users is an explicit audit action.'
      operationId: scim_list_users_scim_v2_Users_get
      security:
      - HTTPBearer: []
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Filter
      - name: startIndex
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Startindex
      - name: count
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Count
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /scim/v2/Users/{user_id}:
    get:
      tags:
      - SCIM
      summary: Scim Get User
      description: 'Return a single User. 404 if missing OR soft-deleted.


        Returning 404 on soft-deleted rows is intentional: Azure AD

        re-GETs after DELETE and expects 404 to confirm the deprovisioning

        completed. Returning 200 with active=false would cause a sync loop.'
      operationId: scim_get_user_scim_v2_Users__user_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - SCIM
      summary: Scim Patch User
      description: 'Per-attribute update per RFC 7644 §3.5.2.


        Azure AD sends capitalised ops (``Add``, ``Replace``, ``Remove``).

        The ScimPatchOperation model accepts both; we normalise to lowercase

        before dispatch in _apply_user_patch.'
      operationId: scim_patch_user_scim_v2_Users__user_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScimPatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - SCIM
      summary: Scim Replace User
      description: Whole-resource replace. 404 if missing or soft-deleted.
      operationId: scim_replace_user_scim_v2_Users__user_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScimUser'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - SCIM
      summary: Scim Delete User
      description: 'Soft-delete: sets ``is_active=False``. Preserves row for audit.


        A subsequent GET on this user returns 404, matching Azure AD''s

        expectation that a deprovisioned user is gone from SCIM''s perspective.'
      operationId: scim_delete_user_scim_v2_Users__user_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /scim/v2/Groups:
    post:
      tags:
      - SCIM
      summary: Scim Create Group
      description: Create a SCIM Group. 409 if externalId already exists.
      operationId: scim_create_group_scim_v2_Groups_post
      security:
      - HTTPBearer: []
      parameters:
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScimGroup'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - SCIM
      summary: Scim List Groups
      description: List Groups with optional filter + paging.
      operationId: scim_list_groups_scim_v2_Groups_get
      security:
      - HTTPBearer: []
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Filter
      - name: startIndex
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Startindex
      - name: count
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Count
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /scim/v2/Groups/{group_id}:
    get:
      tags:
      - SCIM
      summary: Scim Get Group
      description: Return a single Group. 404 if missing or soft-deleted.
      operationId: scim_get_group_scim_v2_Groups__group_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - SCIM
      summary: Scim Patch Group
      description: 'Per-attribute update per RFC 7644 §3.5.2.


        ``op: add`` on ``members`` MUST append, never replace. Azure AD

        sends incremental member additions as PATCH Add; replacing the

        member list would break its sync.'
      operationId: scim_patch_group_scim_v2_Groups__group_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScimPatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - SCIM
      summary: Scim Replace Group
      description: Whole-resource replace. Replaces members list atomically.
      operationId: scim_replace_group_scim_v2_Groups__group_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScimGroup'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - SCIM
      summary: Scim Delete Group
      description: 'Soft-delete: sets ``active=False``. Preserves row + members for audit.'
      operationId: scim_delete_group_scim_v2_Groups__group_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          title: Group Id
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/mcp-remote/sse:
    get:
      tags:
      - MCP-Remote
      summary: Sse Endpoint
      description: 'SSE connection endpoint — long-lived event stream for one MCP client.


        The client sends an ``Authorization: Bearer acw_<key>`` header. We

        validate it via our adapter (NOT the legacy middleware), set the

        ContextVar, then hand off to ``SseServerTransport.connect_sse``

        which holds the connection open and dispatches incoming messages.'
      operationId: sse_endpoint_api_mcp_remote_sse_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/mcp-remote/messages/:
    post:
      tags:
      - MCP-Remote
      summary: Messages Endpoint
      description: 'Inbound JSON-RPC message endpoint for the SSE transport.


        SseServerTransport''s ``handle_post_message`` does the body parsing

        and delivery into the active SSE session. We authenticate per-call

        here too because the SSE session''s auth context is per-connection

        but message posts come on separate HTTP requests.'
      operationId: messages_endpoint_api_mcp_remote_messages__post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/tasks/{spec_id}/agent-console/attach:
    post:
      tags:
      - rmux Live Console
      summary: Attach
      description: 'Flip the named connection into bidirectional input mode.


        On success: 200, writes ``audit.action=console.attach`` row.

        On race lost: 409, no audit row.

        On unknown spec: 404.


        The audit row binds (user_id, org_id, ip, connection_id, spec_id)

        so an investigator can answer "who attached when?" for any session.'
      operationId: attach_api_tasks__spec_id__agent_console_attach_post
      parameters:
      - name: spec_id
        in: path
        required: true
        schema:
          type: string
          title: Spec Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{spec_id}/agent-console/detach:
    post:
      tags:
      - rmux Live Console
      summary: Detach
      description: 'Release attach mode held by ``connection_id``.


        Only the holder can detach (gates against a hostile client

        detaching someone else''s session).  Writes ``console.detach``.


        Returns 200 even if the connection wasn''t the holder, so the WS

        disconnect cleanup path can be fire-and-forget — that case is

        benign (race between client close and explicit detach).'
      operationId: detach_api_tasks__spec_id__agent_console_detach_post
      parameters:
      - name: spec_id
        in: path
        required: true
        schema:
          type: string
          title: Spec Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    APIKeyRequest:
      properties:
        api_key:
          type: string
          minLength: 5
          format: password
          title: Api Key
          writeOnly: true
      type: object
      required:
      - api_key
      title: APIKeyRequest
    ActiveProfileRequest:
      properties:
        profileId:
          type: string
          title: Profileid
      type: object
      required:
      - profileId
      title: ActiveProfileRequest
    AddRemoteRequest:
      properties:
        projectPath:
          type: string
          title: Projectpath
        repoFullName:
          type: string
          title: Repofullname
      type: object
      required:
      - projectPath
      - repoFullName
      title: AddRemoteRequest
    ApiKeyResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        org_id:
          type: string
          title: Org Id
        scopes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Scopes
        key_preview:
          type: string
          title: Key Preview
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        created_at:
          type: string
          format: date-time
          title: Created At
        autonomy_ceiling:
          anyOf:
          - type: string
          - type: 'null'
          title: Autonomy Ceiling
        agent_identity:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Identity
      type: object
      required:
      - id
      - name
      - org_id
      - scopes
      - key_preview
      - last_used_at
      - expires_at
      - created_at
      title: ApiKeyResponse
    ApiProfileModels:
      properties:
        default:
          anyOf:
          - type: string
          - type: 'null'
          title: Default
          description: Default model (maps to ANTHROPIC_MODEL)
        haiku:
          anyOf:
          - type: string
          - type: 'null'
          title: Haiku
          description: Haiku model (maps to ANTHROPIC_DEFAULT_HAIKU_MODEL)
        sonnet:
          anyOf:
          - type: string
          - type: 'null'
          title: Sonnet
          description: Sonnet model (maps to ANTHROPIC_DEFAULT_SONNET_MODEL)
        opus:
          anyOf:
          - type: string
          - type: 'null'
          title: Opus
          description: Opus model (maps to ANTHROPIC_DEFAULT_OPUS_MODEL)
      type: object
      title: ApiProfileModels
      description: Optional model mappings for API profile.
    ApiProfileUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
          description: Profile name (1-100 characters)
        baseUrl:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Baseurl
          description: API endpoint URL
        apiKey:
          anyOf:
          - type: string
            minLength: 20
          - type: 'null'
          title: Apikey
          description: API key (minimum 20 characters)
        models:
          anyOf:
          - $ref: '#/components/schemas/ApiProfileModels'
          - type: 'null'
          description: Optional model mappings
      type: object
      title: ApiProfileUpdate
      description: 'Model for updating API profile configuration.


        All fields are optional to support partial updates. Only provided fields

        will be updated in the profile.'
    AppSettings:
      properties:
        theme:
          type: string
          enum:
          - light
          - dark
          - system
          title: Theme
          description: UI theme (dark/light/system)
          default: dark
        colorTheme:
          anyOf:
          - type: string
            const: ocean
          - type: 'null'
          title: Colortheme
          description: Color theme (default/dusk/lime/ocean/retro/neo/forest)
          default: ocean
        language:
          type: string
          title: Language
          description: UI language code
          default: en
        uiScale:
          anyOf:
          - type: integer
            maximum: 200.0
            minimum: 75.0
