openapi: 3.1.0
info:
  title: AIFactory Web API
  description: Web API for AIFactory — self-hosted AI task management + agent orchestration
  version: 3.6.55
paths:
  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Create a new user account
      description: 'Register a new user.


        Creates the user record, a default *Personal* organization, and adds

        the user as its owner.  Returns JWT access and refresh tokens.'
      operationId: register_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Authenticate and receive JWT tokens
      description: 'Authenticate with email and password.


        Returns a short-lived access token (15 min) and a long-lived refresh

        token (7 days).'
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh an expired access token
      description: 'Exchange a valid refresh token for a new access token.


        The refresh token itself is not rotated; it remains valid until its

        original expiry.'
      operationId: refresh_api_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout (stateless)
      description: 'Logout endpoint.


        Since JWT tokens are stateless, this is a no-op on the server side.

        Clients should discard their stored tokens.'
      operationId: logout_api_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/auth/me:
    get:
      tags:
      - Auth
      summary: Get current user profile
      description: Return the profile of the currently authenticated user.
      operationId: me_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /api/auth/oidc/enabled:
    get:
      tags:
      - Auth (OIDC)
      summary: Whether OIDC SSO is available on this deployment
      description: 'Cheap probe (#149) so the login page can decide whether to auto-initiate a

        silent SSO handoff. Avoids bouncing users to a 404 on installs without OIDC.'
      operationId: oidc_enabled_api_auth_oidc_enabled_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Oidc Enabled Api Auth Oidc Enabled Get
  /api/auth/oidc/login:
    get:
      tags:
      - Auth (OIDC)
      summary: Begin OIDC Authorization Code + PKCE flow
      description: 'Redirect the browser to the IdP authorization endpoint.


        Authlib auto-generates the PKCE ``code_verifier``/``code_challenge``

        pair and the ``state`` nonce, stashing both in the Starlette session

        (which is signed via SessionMiddleware so the browser can''t tamper

        with them). The callback retrieves them server-side to complete the

        exchange.'
      operationId: oidc_login_api_auth_oidc_login_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/auth/oidc/callback:
    get:
      tags:
      - Auth (OIDC)
      summary: OIDC callback — exchange code for tokens
      description: 'Validate the IdP redirect, mint an internal JWT, redirect home.


        Authlib''s ``authorize_access_token`` verifies the ``state`` nonce

        (raises ``MismatchingStateError`` if tampered), exchanges the code

        using the stashed PKCE verifier, fetches the ID token + access

        token + userinfo, and validates ID token signature against the

        IdP''s JWKS.'
      operationId: oidc_callback_api_auth_oidc_callback_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/auth/oidc/refresh:
    post:
      tags:
      - Auth (OIDC)
      summary: Refresh access token, validating against IdP
      description: "Validate the refresh JWT + IdP-side liveness, mint a new access token.\n\nFlow:\n\
        \  1. Decode the refresh JWT (signature + expiry checked).\n  2. Look up the OidcRefreshSession\
        \ by jti — if missing, the\n     session was revoked (logged out, IdP-disabled, etc.).\n  3. Check\
        \ userinfo cache for the sub. If hit, mint a new\n     access token and return.\n  4. On cache\
        \ miss, hit the IdP. If it accepts, cache + mint.\n     If it rejects, delete the session row\
        \ + return 401."
      operationId: oidc_refresh_api_auth_oidc_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/oidc/logout:
    post:
      tags:
      - Auth (OIDC)
      summary: 'Logout: delete session + redirect to IdP end-session'
      description: "End the OIDC session locally + redirect to IdP's end_session_endpoint.\n\nBehavior:\n\
        \  - If a valid refresh token is present (body or cookie), look up\n    the OidcRefreshSession\
        \ row and delete it. Invalidate the\n    userinfo cache for that sub.\n  - Look up the IdP's ``end_session_endpoint``\
        \ from its OIDC\n    discovery document. If advertised, 302 to it (with\n    post_logout_redirect_uri).\
        \ If NOT advertised (some legacy\n    OAuth-only IdPs), 302 to our own post-logout page.\n  -\
        \ In all paths, clear the access_token + refresh_token cookies."
      operationId: oidc_logout_api_auth_oidc_logout_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/LogoutRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/identity-providers:
    get:
      tags:
      - Auth (Identity Providers)
      summary: List configured identity providers
      description: 'Return every enabled IdP as a JSON array.


        Each object has the fields:

        * ``name``         — stable machine key, e.g. ``"corp-sso"``

        * ``kind``         — ``"oidc"`` or ``"saml"``

        * ``display_name`` — operator-supplied UI label

        * ``login_url``    — path the browser navigates to begin the flow


        An empty array means no SSO is configured; the login page should fall

        back to the local-password form.'
      operationId: list_identity_providers_api_auth_identity_providers_get
      responses:
        '200':
          description: Ordered list of IdP descriptors for the login UI
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response List Identity Providers Api Auth Identity Providers Get
  /api/orgs:
    get:
      tags:
      - Organizations
      summary: List organizations the current user belongs to
      description: 'Return all organizations where the current user is a member.


        Each entry includes the member count and the user''s role in that org.'
      operationId: list_organizations_api_orgs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OrgResponse'
                type: array
                title: Response List Organizations Api Orgs Get
    post:
      tags:
      - Organizations
      summary: Create a new organization
      description: Create a new organization and add the current user as owner.
      operationId: create_organization_api_orgs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/orgs/{org_id}:
    get:
      tags:
      - Organizations
      summary: Get organization details
      description: Return details for a single organization. Requires membership.
      operationId: get_organization_api_orgs__org_id__get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Organizations
      summary: Update organization
      description: Update organization fields. Requires admin or owner role.
      operationId: update_organization_api_orgs__org_id__put
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Organizations
      summary: Delete organization (owner only)
      description: 'Delete an organization and all its members. Requires owner role.


        This cascade-deletes OrgMember rows but does NOT delete the User

        accounts that were members.'
      operationId: delete_organization_api_orgs__org_id__delete
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/orgs/{org_id}/members/invite:
    post:
      tags:
      - Organizations
      summary: Invite a user to the organization by email
      description: 'Invite a user to join the organization by their email address.


        Requires admin or owner role. The invited user must already have an

        account. The ``role`` field cannot be set to ``owner`` -- ownership

        transfer must be done through the role change endpoint.'
      operationId: invite_member_api_orgs__org_id__members_invite_post
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/orgs/{org_id}/members:
    get:
      tags:
      - Organizations
      summary: List organization members
      description: 'Return all members of the organization with user details.


        Requires at least viewer-level membership.'
      operationId: list_members_api_orgs__org_id__members_get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgMemberResponse'
                title: Response List Members Api Orgs  Org Id  Members Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/orgs/{org_id}/members/{user_id}:
    put:
      tags:
      - Organizations
      summary: Change a member's role
      description: "Change the role of an organization member. Requires owner role.\n\nConstraints:\n\
        - An owner cannot change their own role (must transfer ownership first).\n- If assigning the ``owner``\
        \ role to another user, ownership is\n  transferred: the current owner is demoted to ``admin``.\n\
        - There must always be at least one owner in the organization."
      operationId: update_member_role_api_orgs__org_id__members__user_id__put
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Organizations
      summary: Remove a member from the organization
      description: 'Remove a member from the organization.


        Rules:

        - Owners and admins can remove any non-owner member.

        - Any member can remove themselves (self-leave), except owners.

        - Owners cannot remove themselves -- they must transfer ownership first.

        - Viewers and members can only remove themselves.'
      operationId: remove_member_api_orgs__org_id__members__user_id__delete
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/keys:
    get:
      tags:
      - API Keys
      summary: List current user's API keys
      description: 'Return all API keys belonging to the current user.


        The response includes metadata and a short preview of each key but

        never the full key or its hash.'
      operationId: list_api_keys_api_keys_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApiKeyResponse'
                type: array
                title: Response List Api Keys Api Keys Get
    post:
      tags:
      - API Keys
      summary: Generate a new API key
      description: 'Generate a new API key for the current user within an organization.


        The raw key is returned **only** in this response and is never stored in

        plaintext.  Only a SHA-256 hash (plus a short preview prefix) is persisted.'
      operationId: create_api_key_api_keys_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/keys/{key_id}:
    delete:
      tags:
      - API Keys
      summary: Revoke (delete) an API key
      description: 'Revoke an API key by deleting it.


        Only the owner of the key (the user who created it) can revoke it.'
      operationId: revoke_api_key_api_keys__key_id__delete
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          title: Key Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/git-credentials:
    post:
      tags:
      - Git Credentials
      summary: Store a new Git credential
      operationId: create_git_credential_api_git_credentials_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGitCredentialRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitCredentialResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Git Credentials
      summary: List Git credentials in an organization
      operationId: list_git_credentials_api_git_credentials_get
      parameters:
      - name: org_id
        in: query
        required: true
        schema:
          type: string
          title: Org Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitCredentialResponse'
                title: Response List Git Credentials Api Git Credentials Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/git-credentials/{cred_id}:
    delete:
      tags:
      - Git Credentials
      summary: Delete a Git credential
      operationId: delete_git_credential_api_git_credentials__cred_id__delete
      parameters:
      - name: cred_id
        in: path
        required: true
        schema:
          type: string
          title: Cred Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/orgs/{org_id}/audit:
    get:
      tags:
      - Audit
      summary: List audit logs for an organization
      description: 'Return paginated audit logs for the specified organization.


        Requires **admin** or **owner** role in the organization. Results are

        ordered by ``created_at`` descending (most recent first).


        Optional query-string filters narrow the result set:


        - ``action`` -- exact match on the action field (e.g. ``user.login``)

        - ``user_id`` -- exact match on the acting user

        - ``resource_type`` -- exact match on resource type (e.g. ``project``)'
      operationId: list_audit_logs_api_orgs__org_id__audit_get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by action (e.g. 'user.login')
          title: Action
        description: Filter by action (e.g. 'user.login')
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by user ID
          title: User Id
        description: Filter by user ID
      - name: resource_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by resource type
          title: Resource Type
        description: Filter by resource type
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Pagination offset
          default: 0
          title: Offset
        description: Pagination offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Page size (max 200)
          default: 50
          title: Limit
        description: Page size (max 200)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/audit/export:
    get:
      tags:
      - Audit
      summary: Stream audit logs as JSON (NDJSON) or CSV
      description: 'Stream the audit log.


        - ``format=json`` returns NDJSON (one JSON object per line).

        - ``format=csv`` returns RFC 4180 CSV with a header row.

        Each row includes ``prev_hash`` so an external verifier can

        re-check the chain against the exported dump (see

        ``python -m server.audit verify-chain``).


        Permission gate: any authenticated user can export their own

        audit trail. Filtering by ``org_id`` requires the caller to be

        a member of that org (enforced by the route''s depend chain

        when called via the gateway — for now we keep the gate light,

        matching the existing /api/orgs/{org_id}/audit route).'
      operationId: export_audit_logs_api_audit_export_get
      parameters:
      - name: format
        in: query
        required: false
        schema:
          enum:
          - json
          - csv
          type: string
          default: json
          title: Format
      - name: org_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter to a single org
          title: Org Id
        description: Filter to a single org
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/users/{user_id}/gdpr-erasure:
    post:
      tags:
      - GDPR
      summary: Irreversibly erase a user's PII (GDPR Art. 17)
      description: 'Permanently delete the user''s PII. Audit chain re-hashes to

        preserve verifiability.


        Idempotent — re-running on an already-erased user returns the

        existing erasure record with `idempotent: true`.'
      operationId: trigger_gdpr_erasure_api_users__user_id__gdpr_erasure_post
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/access-review:
    get:
      tags:
      - Admin
      summary: Stream current org membership for an access review
      description: 'Returns NDJSON: one line per current OrgMember of the specified org. Covers SOC2 CC6.2
        + ISO 27001 A.9.2.5. Requires admin or owner role in the org. Current state only — use audit log
        queries for membership history.'
      operationId: export_access_review_api_admin_access_review_get
      parameters:
      - name: org
        in: query
        required: true
        schema:
          type: string
          description: Organization ID to review
          title: Org
        description: Organization ID to review
      - name: org_id
        in: query
        required: true
        schema:
          type: string
          title: Org Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
