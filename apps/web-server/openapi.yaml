components:
  schemas:
    APIKeyRequest:
      properties:
        api_key:
          type: string
          minLength: 5
          title: Api Key
      type: object
      required:
      - api_key
      title: APIKeyRequest
    ActiveProfileRequest:
      properties:
        profileId:
          type: string
          title: Profileid
      type: object
      required:
      - profileId
      title: ActiveProfileRequest
    AddRemoteRequest:
      properties:
        projectPath:
          type: string
          title: Projectpath
        repoFullName:
          type: string
          title: Repofullname
      type: object
      required:
      - projectPath
      - repoFullName
      title: AddRemoteRequest
    ApiKeyResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        org_id:
          type: string
          title: Org Id
        scopes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Scopes
        key_preview:
          type: string
          title: Key Preview
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - org_id
      - scopes
      - key_preview
      - last_used_at
      - expires_at
      - created_at
      title: ApiKeyResponse
    ApiProfileModels:
      properties:
        default:
          anyOf:
          - type: string
          - type: 'null'
          title: Default
          description: Default model (maps to ANTHROPIC_MODEL)
        haiku:
          anyOf:
          - type: string
          - type: 'null'
          title: Haiku
          description: Haiku model (maps to ANTHROPIC_DEFAULT_HAIKU_MODEL)
        sonnet:
          anyOf:
          - type: string
          - type: 'null'
          title: Sonnet
          description: Sonnet model (maps to ANTHROPIC_DEFAULT_SONNET_MODEL)
        opus:
          anyOf:
          - type: string
          - type: 'null'
          title: Opus
          description: Opus model (maps to ANTHROPIC_DEFAULT_OPUS_MODEL)
      type: object
      title: ApiProfileModels
      description: Optional model mappings for API profile.
    ApiProfileUpdate:
      properties:
