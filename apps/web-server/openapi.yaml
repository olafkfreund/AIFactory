  /api/tasks/{task_id}/resource-usage:
    get:
      tags:
      - Tasks
      summary: Get Task Resource Usage
      description: "Point-in-time CPU/RAM of the running agent subprocess for a task (#277).\n\nThe frontend\
        \ polls this to drive a live per-agent resource panel. Returns\nraw JSON (the api-client wraps\
        \ it):\n\n    {\n      \"running\": bool,        # is an agent process active for this task\n\
        \      \"pid\": int | null,\n      \"cpuPercent\": number,   # process CPU% (parent + children),\
        \ 0.0 when idle\n      \"memoryMb\": number,     # aggregate RSS in MB\n      \"memoryPercent\"\
        : number,# % of system RAM\n      \"sampledAt\": str        # ISO-8601 UTC\n    }\n\nBehaviour:\n\
        \  - Unknown task → 404 (via ``_resolve_task``).\n  - Valid task with no live process → the not-running\
        \ shape (never 404).\n  - Sampling is failure-safe: a dead/missing PID or psutil error degrades\n\
        \    to the not-running shape rather than raising."
      operationId: get_task_resource_usage_api_tasks__task_id__resource_usage_get
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
