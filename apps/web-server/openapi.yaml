    post:
      tags:
      - Tasks
      summary: Resolve Worktree Conflicts
      description: 'Resolve merge conflicts between the worktree branch and the base branch using AI.


        This endpoint performs a real git merge and resolves any conflict markers

        using AI. Process:

        1. Gets the worktree branch name

        2. Starts a git merge of the worktree branch into the current branch

        3. If conflicts arise, uses AI to resolve each conflicted file

        4. Stages resolved files and commits the merge'
      operationId: resolve_worktree_conflicts_api_tasks__task_id__worktree_resolve_conflicts_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflictResolveOptions'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/worktree/resolve-uncommitted:
    post:
      tags:
      - Tasks
      summary: Resolve Uncommitted Conflicts
      description: 'Resolve conflicts between uncommitted local changes and task branch changes using
        AI.


        This endpoint:

        1. Stashes uncommitted changes in the main project

        2. For each conflicting file, gets the stash, task branch, and base versions

        3. Uses AI to intelligently merge the three versions

        4. Writes merged content to working directory

        5. Drops the stash after successful merge'
      operationId: resolve_uncommitted_conflicts_api_tasks__task_id__worktree_resolve_uncommitted_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/worktree/resolve-git-merge:
    post:
      tags:
      - Tasks
      summary: Resolve Git Merge Conflicts
      description: 'Resolve files with git merge conflict markers using AI.


        This endpoint handles the case where a git merge is in progress and files

        contain conflict markers (<<<<<<< HEAD, =======, >>>>>>> branch).


        Unlike resolve_uncommitted_conflicts (which uses stash), this works directly

        with files that already have conflict markers from an in-progress merge.


        Process:

        1. Check if merge is in progress (.git/MERGE_HEAD exists)

        2. Get list of unresolved conflicted files

        3. For each file, use AI to resolve the conflict markers

        4. Write resolved content and stage the file

        5. Return success (user can then commit the merge)'
      operationId: resolve_git_merge_conflicts_api_tasks__task_id__worktree_resolve_git_merge_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
