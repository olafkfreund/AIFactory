          - type: string
          - type: 'null'
          title: Name
          description: Display name for the project
        git_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Git Url
          description: Git URL to clone (HTTPS or SSH). Triggers the portal-managed clone path.
        branch:
          anyOf:
          - type: string
          - type: 'null'
          title: Branch
          description: Branch to checkout after clone. Defaults to the remote's HEAD.
        git_credential_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Git Credential Id
          description: Reference to a stored git credential. Reserved for PR-C; ignored in PR-A.
      type: object
      title: ProjectCreate
      description: "Model for creating a new project.\n\nTwo mutually exclusive shapes (#82 PR-A):\n\n\
        1. **Local path** (laptop installs) — set ``path``. Existing\n   behaviour: the directory is registered\
        \ as-is.\n2. **Git URL** (SaaS/K8s installs) — set ``gitUrl`` (alias of\n   ``git_url``), optionally\
        \ ``branch``. The portal clones the\n   repository into ``PROJECT_WORKSPACE_ROOT`` (defaults to\n\
        \   ``~/.aifactory/workspaces/``) and registers the clone's path.\n   This is the path that unblocks\
        \ shared-host deployment shapes\n   where the user's repo isn't on the portal's filesystem.\n\n\
        Exactly one of ``path`` or ``gitUrl`` must be provided."
