      - Settings
      summary: Retry With Profile
      description: "Switch to a different Claude profile and prepare for operation retry.\n\nThis endpoint\
        \ facilitates profile switching when an operation fails due to\nrate limits or other profile-specific\
        \ issues. It switches the active profile\nand returns information needed for the user/frontend\
        \ to retry the operation.\n\nCommon use case:\n1. User hits rate limit with current profile\n\
        2. Frontend calls this endpoint with a different profileId\n3. Profile is switched\n4. User manually\
        \ retries the operation (or frontend auto-retries)\n\nArgs:\n    request: Profile switch request\
        \ with profileId, optional reason, and operation context\n\nReturns:\n    Success response with\
        \ profile switch details including:\n    - previousProfileId: The profile that was active before\
        \ the switch\n    - newProfileId: The newly activated profile\n    - profileName: Name of the\
        \ new profile for display\n    - reason: Switch reason if provided"
      operationId: retry_with_profile_api_settings_retry_with_profile_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryWithProfileRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/settings/usage-update:
    post:
      tags:
      - Settings
      summary: Request Usage Update
      description: 'Request a usage update.


        Reads local Claude stats from ~/.claude/stats-cache.json and calculates

        approximate usage percentages based on typical daily limits.


        Note: Returns raw data object (not wrapped in {success, data}) because

        the frontend api-client.ts automatically adds that wrapper.'
      operationId: request_usage_update_api_settings_usage_update_post
      responses:
