<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Factory design language: Hanken Grotesk (UI) + Archivo (display) +
         JetBrains Mono (data plane). Shared across all Factory portals. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <title>AIFactory</title>
  </head>
  <body>
    <script>
      // Apply theme synchronously before first paint to prevent color flash.
      // Gruvbox palette is the default in index.css; the dark class is toggled
      // for dark mode, and a data-theme attribute selects alternate palettes.
      (function() {
        try {
          var theme = localStorage.getItem('aifactory-theme') || 'system';
          var root = document.documentElement;
          if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            root.classList.add('dark');
          }
          var colorTheme = localStorage.getItem('aifactory-color-theme');
          if (colorTheme && colorTheme !== 'gruvbox') {
            root.setAttribute('data-theme', colorTheme);
          }
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
