title = "gitleaks config for AIFactory"

[extend]
useDefault = true

# ONE `[allowlist]`, singular, deliberately.
#
# gitleaks 8.24.3 -- the version gitleaks-action v3.0.0 installs, and the one
# the CLI step below pins -- does NOT understand a top-level `[[allowlists]]`
# array. It parses the file without complaint and silently applies NO allowlist
# at all. This config used the plural form, so every entry here was inert:
# `gitleaks detect --source . --config .gitleaks.toml` reported 31 findings,
# 30 of them in tests/test_scan_secrets.py, the file the first entry names.
# Rewritten as a single `[allowlist]`, the same command reports 0.
#
# The failure was invisible from both directions. The scheduled full-history
# job has failed on all three runs it has ever had (2026-08-16, -17, -18) and
# blocked nothing, because a scheduled gate has no PR to turn red. The PR job
# only fails when a diff touches one of these paths, which is rare -- so it
# passed 23 times and looked healthy. AIFactory#1337 correctly found that the
# PR job never passed GITLEAKS_CONFIG and fixed that, but the fix could not be
# exercised: no PR since has touched an allowlisted file, and the config it
# started reading was inert anyway.
#
# If you add an entry, MERGE IT INTO THIS BLOCK. A second `[[allowlists]]`
# block silently disables everything above it. tests/test_gitleaks_config.py
# asserts the singular form and that the config actually suppresses a known
# fixture, so this cannot regress unnoticed.
[allowlist]
description = "Fake/example secrets in test suites, SAML test-only key pairs, docs, LLM prompt templates, and the CI-only Fernet key - not real credentials"
paths = [
  '''tests/test_scan_secrets\.py''',
  '''tests/test_security_scanner\.py''',
  '''tests/test_structured_outputs\.py''',
  '''tests/test_file_based_endpoints\.py''',
  '''tests/scim/test_auth\.py''',
  '''tests/test_skills_service\.py''',
  '''tests/fixtures/saml/.*\.key''',
  '''apps/backend/prompts/github/pr_followup\.md''',
  '''apps/backend/prompts/coder\.md''',
  '''apps/web-server/README\.md''',
  '''skills/quality/security\.md''',
  '''compliance/model-registry\.html''',
  # Both found only once the allowlist above started working at all. Each is a
  # security-feature test that must contain a fixture shaped like a real
  # credential in order to test anything:
  #   test_output_dlp.py:14   AKIA + 16 chars, commented in-file as "a fake AWS
  #                           Access Key ID ... shaped to trip the existing
  #                           scan_secrets pattern"
  #   test_sanitize_error_message.py  inputs to the redaction function, the
  #                           literal alphabet ("abcdefghijklmnopqrstuvwxyz12")
  '''apps/backend/security/test_output_dlp\.py''',
  '''tests/test_sanitize_error_message\.py''',
]
# Throwaway Fernet key generated solely to exercise the OIDC acceptance job's
# encrypt-at-rest code path in CI (see .github/workflows/ci.yml, job
# `oidc-acceptance`, comment above KMS_FERNET_KEY). Ephemeral, never used
# outside that job's transient env, grants no access to any real system.
regexes = [
  '''w5zEtCchBJDrettOdB7PZQohOBQ_gwT3rA_rYO4hy84=''',
]
