# AIFactory runtime dependency lock (#1284).
#
# Fully-resolved, hash-pinned closure of the two runtime requirements files:
#   apps/web-server/requirements.txt  +  apps/backend/requirements.txt
#
# WHY: every other class of external reference this repo consumes is already
# immutable (container bases carry @sha256, npm has package-lock.json, most
# Actions are SHA-pinned). Python was the exception -- 69 of 72 declarations are
# bare `>=` floors -- and it is the one that runs next to the agent's
# credentials. This file does not change the floors: the floors keep expressing
# *intent* (the minimum we support) and this lock records *reality* (what a
# build actually installs). They answer different questions, so both stay.
#
# CONSUMER: the runtime image only. The Dockerfile installs from this file with
# `pip --require-hashes`, so an image build cannot silently pick up a new
# upstream release. CI test jobs (.github/workflows/{ci,cq-ratchet,
# gvisor-smoke,techdocs}.yml) and shell.nix still resolve the floors freely --
# tracked in #1284, deliberately out of scope here.
#
# TO REGENERATE (required whenever either requirements.txt changes):
#   uv pip compile --python-version 3.14 \
#       --python-platform x86_64-unknown-linux-gnu --generate-hashes \
#       apps/web-server/requirements.txt apps/backend/requirements.txt \
#       -o requirements.lock
#
# Re-running against the existing lock is a no-op unless the inputs changed: uv
# reads the current pins as preferences rather than jumping to latest. That is
# what makes a drift gate viable -- the `deps-lock-drift` job in ci.yml
# recompiles and fails on any diff, so an unlocked new dependency is caught in
# review instead of at image build.
#
# The --python-version/--python-platform match the runtime image: chainguard
# python:latest-dev at the digest pinned in the Dockerfile is CPython 3.14, and
# every image-build workflow builds `platforms: linux/amd64` only. A hash lock
# is only valid for the interpreter and platform it was compiled for; if the
# base image's Python moves, this command must move with it.
#
