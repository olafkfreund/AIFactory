{{- if .Values.investigations.enabled -}}
# Ingress to the AIFactory server from investigation agent pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aifactory.fullname" . }}-investigate-api
  labels:
    {{- include "aifactory.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aifactory.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              factory.io/run-kind: investigate-agent
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- end }}
