{{- /*
  OPA Gatekeeper Constraint — instantiates the
  ``AIFactoryTenantNamespacePrefix`` template above with the
  operator's configured ``tenant.namespacePrefix``. Without this
  Constraint, the template is inert (Gatekeeper only enforces
  Constraints, not templates).

  Exempt namespaces: kube-system, kube-public, kube-node-lease,
  gatekeeper-system, plus the AIFactory release namespace itself
  (the web pod lives there). Operators with monitoring stacks
  installed cluster-wide should add their namespace via
  ``--set tenant.gatekeeperExtraExemptNamespaces={prometheus,grafana}``
  (TODO v1.2 — for now operators edit this template directly OR
  add a second Constraint with different exemptions).
*/}}
{{- if and .Values.tenant.isolationEnabled .Values.tenant.gatekeeperEnabled }}
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: AIFactoryTenantNamespacePrefix
metadata:
  name: aifactory-tenant-namespace-prefix
  labels:
    {{- include "aifactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-gatekeeper-sample
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Namespace"]
  parameters:
    prefix: {{ printf "%s-" .Values.tenant.namespacePrefix | quote }}
    exemptNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - gatekeeper-system
      - {{ .Release.Namespace | quote }}
{{- end }}
