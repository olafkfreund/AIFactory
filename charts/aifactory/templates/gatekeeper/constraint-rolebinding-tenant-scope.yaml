{{- /*
  OPA Gatekeeper Constraint — instantiates the
  ``AIFactoryTenantRoleBindingScope`` template with the operator's
  reconciler SA + tenant prefix.
*/}}
{{- if and .Values.tenant.isolationEnabled .Values.tenant.gatekeeperEnabled }}
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: AIFactoryTenantRoleBindingScope
metadata:
  name: aifactory-tenant-rolebinding-scope
  labels:
    {{- include "aifactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-gatekeeper-sample
spec:
  match:
    kinds:
      - apiGroups: ["rbac.authorization.k8s.io"]
        kinds: ["RoleBinding"]
  parameters:
    reconcilerServiceAccount: {{ include "aifactory.serviceAccountName" . | quote }}
    reconcilerNamespace: {{ .Release.Namespace | quote }}
    tenantNamespacePrefix: {{ printf "%s-" .Values.tenant.namespacePrefix | quote }}
{{- end }}
