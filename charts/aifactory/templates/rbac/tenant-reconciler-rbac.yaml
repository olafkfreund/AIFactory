{{- /*
  Tenant reconciler RBAC (Epic #35 #36 PR-3).

  Grants the web pod's ServiceAccount the cluster-wide rights the
  reconciler needs to create per-tenant namespaces + the resources
  inside them. Only rendered when ``tenant.isolationEnabled=true``.

  HONEST SECURITY NOTE — operators MUST read this before enabling:

    K8s RBAC does NOT support prefix-based namespace scoping at the
    RoleBinding level: a ClusterRole with ``create namespaces`` +
    ``create rolebindings`` is effectively cluster-admin. Anyone who
    compromises the web pod can create arbitrary namespaces +
    bindings, NOT just ``aifactory-tenant-*`` ones.

    This is a known privilege concentration documented in the design
    (docs/plans/2026-05-28-tenant-isolation-design.md §1) and the
    concept doc (docs/docs/concepts/tenant-isolation.md). Production
    deployments SHOULD mitigate with BOTH:

      1. sandbox.gvisor.enabled=true       — syscall-level isolation
         on the web pod so a process compromise can't escape the
         container without first defeating gVisor.

      2. tenant.gatekeeperEnabled=true     — OPA Gatekeeper policies
         (rendered by templates/gatekeeper/*) that DENY any Namespace
         create whose name doesn't match ``<namespacePrefix>-*``, and
         any RoleBinding that references the web pod's SA in a
         non-tenant namespace. This restores prefix-based scoping at
         the admission-controller level.

    v2.x roadmap: extract the reconciler into a separate Operator
    pod with a tighter ServiceAccount that DOES include prefix
    matching (Kopf-based controller watching AIFactoryOrg CRDs). The
    in-app reconciler ships in v1.1 because it's <50% the maintenance
    cost while the threat model accepts the privilege concentration.

  ClusterRole is the right kind here (not Role) because tenant
  namespaces are CREATED at reconcile time, not at chart install
  time — a Role bound to a single namespace cannot create siblings.
*/}}
{{- if .Values.tenant.isolationEnabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aifactory.fullname" . }}-tenant-reconciler
  labels:
    {{- include "aifactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-reconciler-rbac
rules:
  # Tenant namespace lifecycle.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "update", "delete", "get", "list", "watch"]
  # Per-tenant resource policy.
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["create", "update", "delete", "get", "list"]
  # Per-tenant identity.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "update", "delete", "get", "list"]
  # Per-tenant in-namespace RBAC.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "update", "delete", "get", "list"]
  # Per-tenant network isolation (default-deny + explicit allowlist).
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "update", "delete", "get", "list"]
  # External Secrets Operator integration for per-tenant Vault paths.
  # The CRD may not exist on every cluster — that's OK: K8s RBAC
  # accepts a rule on a CRD that's not installed yet, and the
  # reconciler skips this resource when ESO is not deployed.
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["create", "update", "delete", "get", "list"]
  # FQDN-based egress NetworkPolicies (Cilium variant). Calico's
  # GlobalNetworkPolicy lives in crd.projectcalico.org and is added
  # below; whichever CNI the operator chose via tenant.networkPolicy
  # .cniBackend will satisfy at runtime.
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["create", "update", "delete", "get", "list"]
  - apiGroups: ["crd.projectcalico.org"]
    resources: ["globalnetworkpolicies", "networkpolicies"]
    verbs: ["create", "update", "delete", "get", "list"]
  # CRD discovery — the reconciler probes for Calico vs Cilium CRDs
  # at runtime when ``tenant.networkPolicy.cniBackend=auto`` to pick
  # the right NetworkPolicy shape. The pre-install CNI probe Job
  # (pre-install-cni-probe.yaml) uses the same right via
  # ``kubectl get crd``.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aifactory.fullname" . }}-tenant-reconciler
  labels:
    {{- include "aifactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-reconciler-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aifactory.fullname" . }}-tenant-reconciler
subjects:
  - kind: ServiceAccount
    name: {{ include "aifactory.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
