{{- /*
  Helm pre-install / pre-upgrade hook — CNI capability lock
  (Epic #35 #36 PR-3, design §3).

  When ``tenant.isolationEnabled=true``, the reconciler emits FQDN-
  based NetworkPolicies that require Calico (FQDN beta) OR Cilium
  (CiliumNetworkPolicy CRD). On clusters without one of those CNIs,
  every agent task for every tenant fails (the agent pod can't reach
  api.anthropic.com / OIDC IdP / KMS endpoint), making the deployment
  effectively unusable.

  This hook probes the API for the expected CRD shape and fails the
  ``helm install`` / ``helm upgrade`` if neither is present — the
  operator sees the error at install time, not at first reconcile.

  The probe uses the ``lookup`` template function which runs at hook-
  time (against the live cluster's API) rather than at template-time.
  When the operator chose ``cniBackend: auto``, the probe accepts
  either CRD; when they pinned to calico or cilium, the probe requires
  exactly that CRD.

  Rendered only when ``tenant.isolationEnabled=true``. Behaviour when
  the toggle is off: nothing rendered — the chart installs against
  any CNI plugin (the v1.0 default-deny NetworkPolicy works on stock
  Kubernetes too).
*/}}
{{- if .Values.tenant.isolationEnabled }}
{{- $backend := .Values.tenant.networkPolicy.cniBackend | default "auto" }}
{{- $calicoCrd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "globalnetworkpolicies.crd.projectcalico.org" }}
{{- $ciliumCrd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "ciliumnetworkpolicies.cilium.io" }}
{{- $hasCalico := and (not (empty $calicoCrd)) (kindIs "map" $calicoCrd) }}
{{- $hasCilium := and (not (empty $ciliumCrd)) (kindIs "map" $ciliumCrd) }}
{{- /*
  Lookup returns an empty value during ``helm template`` (no live
  cluster). We can't reject in that mode — the operator's CI may
  legitimately render the chart against no cluster. The hook below
  is the runtime gate; lookup-time validation is best-effort.
*/}}
{{- if .Release.IsInstall }}
  {{- if eq $backend "calico" }}
    {{- if and (not $hasCalico) (not (empty (or $calicoCrd $ciliumCrd))) }}
      {{- fail "tenant.networkPolicy.cniBackend=calico but Calico CRDs (globalnetworkpolicies.crd.projectcalico.org) are NOT present on the cluster. Install Calico, or switch to cniBackend=auto/cilium. See docs/docs/concepts/tenant-isolation.md." }}
    {{- end }}
  {{- else if eq $backend "cilium" }}
    {{- if and (not $hasCilium) (not (empty (or $calicoCrd $ciliumCrd))) }}
      {{- fail "tenant.networkPolicy.cniBackend=cilium but Cilium CRDs (ciliumnetworkpolicies.cilium.io) are NOT present on the cluster. Install Cilium, or switch to cniBackend=auto/calico. See docs/docs/concepts/tenant-isolation.md." }}
    {{- end }}
  {{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aifactory.fullname" . }}-tenant-cni-probe
  labels:
    {{- include "aifactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-cni-probe
  annotations:
    # Hook lifecycle: run BEFORE the chart installs / upgrades, and
    # DELETE the Job after success so a re-install doesn't trip on
    # the previous Job's existence.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # Single attempt — the probe is deterministic (CRD either exists or
  # doesn't). A retry would just re-discover the same answer.
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    metadata:
      # NOT selectorLabels — they are the `aifactory` Service's selector and this
      # probe serves no traffic (AIFactory#1107). Worse here than elsewhere: this
      # is a pre-install/pre-upgrade hook, so it runs at exactly the moment an
      # operator is watching the upgrade and would read the 502s as the upgrade
      # failing.
      labels:
        {{- include "aifactory.jobPodLabels" (dict "ctx" . "component" "tenant-cni-probe") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "aifactory.serviceAccountName" . }}
      restartPolicy: Never
      containers:
        - name: cni-probe
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              BACKEND="{{ $backend }}"
              echo "Tenant isolation requires Calico or Cilium FQDN-policy support."
              echo "Requested backend: $BACKEND"
              CALICO_PRESENT=0
              CILIUM_PRESENT=0
              if kubectl get crd globalnetworkpolicies.crd.projectcalico.org >/dev/null 2>&1; then
                CALICO_PRESENT=1
                echo "  - Calico globalnetworkpolicies.crd.projectcalico.org: PRESENT"
              else
                echo "  - Calico globalnetworkpolicies.crd.projectcalico.org: ABSENT"
              fi
              if kubectl get crd ciliumnetworkpolicies.cilium.io >/dev/null 2>&1; then
                CILIUM_PRESENT=1
                echo "  - Cilium ciliumnetworkpolicies.cilium.io: PRESENT"
              else
                echo "  - Cilium ciliumnetworkpolicies.cilium.io: ABSENT"
              fi
              case "$BACKEND" in
                auto)
                  if [ "$CALICO_PRESENT" -eq 1 ] || [ "$CILIUM_PRESENT" -eq 1 ]; then
                    echo "OK: at least one FQDN-capable CNI present."
                    exit 0
                  fi
                  echo ""
                  echo "FAIL: Tenant Isolation requires Calico or Cilium FQDN-policy support."
                  echo "Found neither CRD. Either install one of those CNIs, or set tenant.isolationEnabled=false."
                  exit 1
                  ;;
                calico)
                  if [ "$CALICO_PRESENT" -eq 1 ]; then
                    echo "OK: Calico CRDs present as requested."
                    exit 0
                  fi
                  echo ""
                  echo "FAIL: tenant.networkPolicy.cniBackend=calico but Calico CRDs missing."
                  echo "Install Calico (https://docs.tigera.io/) or switch to cniBackend=auto/cilium."
                  exit 1
                  ;;
                cilium)
                  if [ "$CILIUM_PRESENT" -eq 1 ]; then
                    echo "OK: Cilium CRDs present as requested."
                    exit 0
                  fi
                  echo ""
                  echo "FAIL: tenant.networkPolicy.cniBackend=cilium but Cilium CRDs missing."
                  echo "Install Cilium (https://docs.cilium.io/) or switch to cniBackend=auto/calico."
                  exit 1
                  ;;
                *)
                  echo "FAIL: unknown tenant.networkPolicy.cniBackend=$BACKEND"
                  exit 1
                  ;;
              esac
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
{{- end }}
