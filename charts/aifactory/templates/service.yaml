apiVersion: v1
kind: Service
metadata:
  name: {{ include "aifactory.fullname" . }}
  labels:
    {{- include "aifactory.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  # `component: server` narrows this to the SERVING pods, and is load-bearing.
  #
  # Without it the selector is just {name, instance}, which every pod of the
  # release satisfies — a Service selector is a SUBSET match, so extra labels on a
  # pod never exclude it. That silently made the bundled Postgres StatefulSet
  # (postgres.bundled=true) an endpoint of THIS Service: it carries
  # {name, instance, component: postgres}, and while `component: postgres`
  # correctly narrows the aifactory-postgres Service, nothing narrowed this one.
  # Postgres listens on 5432, this Service targets {{ .Values.service.targetPort }},
  # so kube-proxy handed it a share of real API traffic and it answered with
  # connection refused — and being long-lived, PERMANENTLY, not for a window.
  #
  # The Job/CronJob pod templates had the same problem and are fixed at the pod
  # end too (AIFactory#1107). Both ends are worth having: narrowing here is what
  # stops the NEXT non-serving pod rediscovering this, and something already has,
  # three times across this fleet.
  #
  # The Deployment's own `spec.selector` is deliberately NOT narrowed — it is
  # immutable, and narrowing it would make `helm upgrade` fail on every existing
  # install. This selector is mutable, and the chart's maxSurge=0 strategy already
  # replaces the pod on every upgrade, so no new endpoint gap is introduced.
  selector:
    {{- include "aifactory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
