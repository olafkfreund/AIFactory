{{- if .Values.investigations.enabled -}}
# Investigation test pod: no ingress; DNS and the registry proxy only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aifactory.fullname" . }}-investigate-test
  labels:
    {{- include "aifactory.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      factory.io/run-kind: investigate-test
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              factory.io/run-kind: investigate-proxy
      ports:
        - protocol: TCP
          port: 3128
{{- end }}
