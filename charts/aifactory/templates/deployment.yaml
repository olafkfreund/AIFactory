apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aifactory.fullname" . }}
  labels:
    {{- include "aifactory.labels" . | nindent 4 }}
spec:
  # Epic #44 R3 — multi-replica rmux is out of scope for v1 (cross-pod
  # session visibility needs Redis pub/sub, planned for v1.1).  Pin
  # to 1 when ``rmux.enabled=true`` regardless of what replicaCount or
  # HPA say.  When rmux is off, honour the operator-set replicaCount.
  replicas: {{ if .Values.rmux.enabled }}1{{ else }}{{ .Values.replicaCount }}{{ end }}
  strategy:
    # Rolling update with maxSurge=0 — v1.0 has one replica, so we
    # tear down before bringing up to avoid double-DB-writes during
    # the version switch. v1.1 (multi-replica + Redis pub/sub) will
    # bump this to maxSurge=1.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "aifactory.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aifactory.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll pods on ConfigMap change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "aifactory.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.sandbox.gvisor.enabled }}
      # gVisor sandboxing (Epic #35 #37). Routes syscalls through the
      # runsc user-space kernel. RuntimeClass must already exist in
      # the cluster — see values.yaml's ``sandbox.gvisor`` block.
      runtimeClassName: {{ .Values.sandbox.gvisor.runtimeClassName | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: aifactory
          image: {{ include "aifactory.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "aifactory.fullname" . }}-config
          env:
            # FACTORY_SERVICE_NAME: this service's identity for the shared
            # factory-github VCS-client layer (canonical in the Factory hub,
            # Factory#157). The GitLab Duo-Workflow "goal" string reads this so
            # the canonical file stays byte-identical across the fleet while each
            # service still names itself. AIFactory is the canonical source, so
            # this restores its original wording ("AIFactory") at runtime.
            - name: FACTORY_SERVICE_NAME
              value: "AIFactory"
            # AIFACTORY_IMAGE: this Deployment's own resolved image ref. The pod
            # cannot read its own container image from the downward API, so the
            # chart injects it here. The RFC-0016 #671 build Job (run.py as a
            # k8s Job, AIFACTORY_BUILD_BACKEND=kubejob) defaults its Job image to
            # this value so the build runs on a python-capable image — NOT the
            # thin nix gate substrate (AIFACTORY_SANDBOX_IMAGE), which has no
            # bash/python outside `nix develop` and StartErrors the build pod.
            # Override per-deployment with AIFACTORY_BUILD_IMAGE if the build
            # should use a different image than the control plane.
            - name: AIFACTORY_IMAGE
              value: {{ include "aifactory.image" . | quote }}
            {{- if .Values.staleReaper.enabled }}
            # #1064 stale-task reaper. Runs in THIS pod, not a CronJob: the
            # spec tree lives on a ReadWriteOnce volume, so a separate pod
            # scheduled onto another node reads an empty directory, reports
            # zero orphans and exits green.
            - name: AIFACTORY_STALE_REAPER
              value: "true"
            # Report-only unless explicitly told otherwise. Enabling the
            # reaper and enabling writes are two separate decisions on
            # purpose -- read a few weeks of reports first.
            # NO `| default true` here. Helm's `default` treats false as
            # empty, so `false | default true` renders "true" and silently
            # discards the operator's setting -- they set dryRun: false, see
            # nothing get written, and have no way to tell why. Unset renders
            # "" which the app reads as report-only, so this still fails closed.
            - name: REAPER_DRY_RUN
              value: {{ .Values.staleReaper.dryRun | quote }}
            - name: REAPER_STALE_HOURS
              value: {{ .Values.staleReaper.staleHours | default 4 | quote }}
            - name: REAPER_INTERVAL_SECONDS
              value: {{ .Values.staleReaper.intervalSeconds | default 1800 | quote }}
            {{- end }}
            # DATABASE_URL: produced by ExternalSecret OR by an
            # out-of-band Secret named values.postgres.externalSecretName.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.externalSecretName }}
                  key: database-url
            {{- if .Values.oidc.enabled }}
            - name: APP_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.clientSecretRef.name }}
                  key: {{ .Values.oidc.clientSecretRef.key }}
            {{- end }}
            {{- if eq .Values.kms.backend "fernet" }}
            - name: KMS_FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kms.fernetKeyRef.name }}
                  key: {{ .Values.kms.fernetKeyRef.key }}
            {{- end }}
            {{- if ne .Values.sandbox.agent.mode "off" }}
            # Agent OS sandbox (#363 AC1): bubblewrap around each agent bash
            # command — RW only the worktree, everything else RO. Runs
            # unprivileged in-pod; PID isolation is opt-in (needs privilege).
            - name: AIFACTORY_AGENT_SANDBOX
              value: {{ .Values.sandbox.agent.mode | quote }}
            {{- if .Values.sandbox.agent.pidNamespace }}
            - name: AIFACTORY_AGENT_SANDBOX_PIDNS
              value: "1"
            {{- end }}
            {{- end }}
            {{- if ne .Values.security.egress.policy "off" }}
            # Agent egress control (#363 AC3): command-layer allowlist over the
            # bash hook — complements the NetworkPolicy with per-host filtering
            # that vanilla NetworkPolicy can't do (no FQDN egress without Cilium).
            - name: AIFACTORY_EGRESS_POLICY
              value: {{ .Values.security.egress.policy | quote }}
            {{- with .Values.security.egress.allowedHosts }}
            - name: AIFACTORY_EGRESS_ALLOWED_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.workspaces.storage.enabled }}
            # S3-compatible durable workspace storage (Epic #35 #40
            # half-B PR-2). ``WORKSPACE_S3_URI_BASE`` switches the
            # WorkspaceStore from local-only no-op into fsspec-driven
            # snapshot+restore mode. The required-validator below
            # blocks helm template when uriBase is empty AND for s3://
            # URIs when neither IRSA nor a credentials Secret is set.
            - name: WORKSPACE_S3_URI_BASE
              value: {{ required "workspaces.storage.enabled=true requires workspaces.storage.uriBase (e.g. s3://my-bucket/workspaces)." .Values.workspaces.storage.uriBase | quote }}
            {{- if .Values.workspaces.storage.aws.endpointUrl }}
            # MinIO / S3-compatible endpoint. AIFactory's own env
            # namespace (NOT FSSPEC_S3_*) — fsspec auto-promotes any
            # FSSPEC_S3_<kwarg> into the S3FileSystem constructor,
            # which breaks addressing_style by stuffing it into
            # AioSession.__init__. WorkspaceStore reads these vars
            # and forwards them via boto3's Config object instead.
            - name: AIFACTORY_S3_ENDPOINT_URL
              value: {{ .Values.workspaces.storage.aws.endpointUrl | quote }}
            {{- end }}
            {{- if and .Values.workspaces.storage.aws.addressingStyle (ne .Values.workspaces.storage.aws.addressingStyle "auto") }}
            - name: AIFACTORY_S3_ADDRESSING_STYLE
              value: {{ .Values.workspaces.storage.aws.addressingStyle | quote }}
            {{- end }}
            {{- if and (hasPrefix "s3://" .Values.workspaces.storage.uriBase) (not .Values.workspaces.storage.aws.useInstanceRole) }}
            # Static AWS creds — required when uriBase is s3:// AND
            # the operator hasn't opted into IRSA / instance-role auth.
            # IRSA users leave credentialsSecretName empty + set the SA
            # annotation outside the chart.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "workspaces.storage uriBase=s3:// requires either aws.useInstanceRole=true (for IRSA / instance-role) or aws.credentialsSecretName (Secret with AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY)." .Values.workspaces.storage.aws.credentialsSecretName | quote }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.workspaces.storage.aws.credentialsSecretName | quote }}
                  key: AWS_SECRET_ACCESS_KEY
            {{- end }}
            {{- end }}
            {{- if .Values.redis.enabled }}
            # Redis pub/sub for cross-replica WebSocket fan-out
            # (Epic #35 #40 PR-1). Must be set for ``replicas > 1`` —
            # without it, broadcast events stay on the originating
            # replica. ``url`` is inline (dev only); production uses
            # ``externalSecretName``. The required-validator below
            # blocks helm template when both sources are empty.
            {{- if .Values.redis.url }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- else }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "redis.enabled=true requires either redis.url (dev-only inline) or redis.externalSecretName (Secret with a REDIS_URL key). Neither is set — see charts/aifactory/values.yaml." .Values.redis.externalSecretName | quote }}
                  key: REDIS_URL
            {{- end }}
            - name: REDIS_CHANNEL
              value: {{ .Values.redis.channel | quote }}
            {{- end }}
            {{- /* SAML + SCIM validators (Epic #35 #41 PR-2). Run at template
                   time so operators see misconfigurations at `helm install`,
                   not at first pod start. Same shape as the OTel + workspaces
                   validators above. */ -}}
            {{- if .Values.saml.requireEncryptedAssertion }}
            {{- if not .Values.saml.enabled }}
            {{- fail "saml.requireEncryptedAssertion=true requires saml.enabled=true — either turn SAML on or clear requireEncryptedAssertion. See charts/aifactory/values.yaml." }}
            {{- end }}
            {{- end }}
            {{- if .Values.saml.enabled }}
            {{- if not .Values.saml.spEntityId }}
            {{- fail "saml.enabled=true requires saml.spEntityId (e.g. https://aifactory.example.com/saml). See charts/aifactory/values.yaml." }}
            {{- end }}
            {{- if not .Values.saml.acsUrl }}
            {{- fail "saml.enabled=true requires saml.acsUrl (e.g. https://aifactory.example.com/api/auth/saml/acs). See charts/aifactory/values.yaml." }}
            {{- end }}
            {{- if and (not .Values.saml.idpMetadataUrl) (not .Values.saml.idpMetadataSecretName) }}
            {{- fail "saml.enabled=true requires exactly one of saml.idpMetadataUrl OR saml.idpMetadataSecretName. See charts/aifactory/values.yaml." }}
            {{- end }}
            {{- if and .Values.saml.idpMetadataUrl .Values.saml.idpMetadataSecretName }}
            {{- fail "saml.idpMetadataUrl and saml.idpMetadataSecretName are mutually exclusive — set exactly one. See charts/aifactory/values.yaml." }}
            {{- end }}
            {{- if and .Values.saml.requireEncryptedAssertion (not .Values.saml.spCertSecretName) }}
            {{- fail "saml.requireEncryptedAssertion=true requires saml.spCertSecretName (the SP private key is needed to decrypt assertions). See charts/aifactory/values.yaml." }}
            {{- end }}
            {{- end }}
            {{- if .Values.scim.enabled }}
            {{- if not .Values.scim.tokenSecretName }}
            {{- fail "scim.enabled=true requires scim.tokenSecretName (K8s Secret with key SCIM_BEARER_TOKEN). See charts/aifactory/values.yaml." }}
            {{- end }}
            {{- end }}
            {{- if .Values.saml.enabled }}
            # SAML 2.0 Web SSO (Epic #35 #41 PR-2). The web-server's
            # ``server.saml.client.config_from_env()`` reads these to build
            # the OneLogin SDK settings dict. Required values are
            # double-checked at startup; missing pieces crashloop with a
            # clear log line so the operator can see exactly what's
            # missing instead of a generic 500 at first login.
            - name: SAML_ENABLED
              value: "true"
            - name: SAML_SP_ENTITY_ID
              value: {{ .Values.saml.spEntityId | quote }}
            - name: SAML_ACS_URL
              value: {{ .Values.saml.acsUrl | quote }}
            {{- if .Values.saml.idpMetadataUrl }}
            - name: SAML_IDP_METADATA_URL
              value: {{ .Values.saml.idpMetadataUrl | quote }}
            {{- end }}
            {{- if .Values.saml.idpMetadataSecretName }}
            # File path matches the volumeMount below — the Secret's
            # ``idp-metadata.xml`` key projects to this exact path.
            - name: SAML_IDP_METADATA_FILE
              value: "/etc/saml/idp-metadata.xml"
            {{- end }}
            {{- if .Values.saml.spCertSecretName }}
            # SP signing cert + key — paths match the volumeMount below.
            # SAML_SP_CERT_PREVIOUS_FILE is opt-in; the web-server's
            # config_from_env() tolerates a missing file (empty PEM →
            # SP cert rotation overlap not active).
            - name: SAML_SP_CERT_FILE
              value: "/etc/saml/sp/cert.pem"
            - name: SAML_SP_KEY_FILE
              value: "/etc/saml/sp/key.pem"
            - name: SAML_SP_CERT_PREVIOUS_FILE
              value: "/etc/saml/sp/cert.pem.previous"
            {{- end }}
            - name: SAML_REQUIRE_ENCRYPTED_ASSERTION
              value: {{ .Values.saml.requireEncryptedAssertion | quote }}
            {{- if .Values.saml.idpName }}
            - name: SAML_IDP_NAME
              value: {{ .Values.saml.idpName | quote }}
            {{- end }}
            {{- if .Values.saml.idpDisplayName }}
            - name: SAML_IDP_DISPLAY_NAME
              value: {{ .Values.saml.idpDisplayName | quote }}
            {{- end }}
            {{- if .Values.saml.idpInitDefaultReturnTo }}
            - name: SAML_IDP_INIT_DEFAULT_RETURN_TO
              value: {{ .Values.saml.idpInitDefaultReturnTo | quote }}
            {{- end }}
            {{- /* SLO validator: slo.enabled requires saml.enabled (Epic #35 #209). */ -}}
            {{- if and .Values.saml.slo.enabled (not .Values.saml.enabled) }}
            {{- fail "saml.slo.enabled=true requires saml.enabled=true. Enable SAML first. See charts/aifactory/values.yaml." }}
            {{- end }}
            {{- if .Values.saml.slo.enabled }}
            # SAML SLO (Epic #35 #209 v1.2). Opt-in; default off.
            # When enabled, /api/auth/saml/logout and /api/auth/saml/sls
            # are active. The SP's SLS callback URL is derived from
            # saml.acsUrl (same base) with path /sls, or set explicitly.
            - name: SAML_SLO_ENABLED
              value: "true"
            - name: SAML_SLO_URL
              value: {{ .Values.saml.slo.slsUrl | default (print .Values.saml.acsUrl | replace "/acs" "/sls") | quote }}
            {{- if .Values.saml.slo.idpSloUrl }}
            # Explicit IdP SLO URL override. When empty, the SP derives
            # the URL from the IdP metadata's <SingleLogoutService> element.
            - name: SAML_IDP_SLO_URL
              value: {{ .Values.saml.slo.idpSloUrl | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.scim.enabled }}
            # SCIM 2.0 provisioning (Epic #35 #41 PR-2). The Bearer
            # token is read once at startup by ``server.scim.auth``;
            # rotate by recreating the Secret + restarting the pod
            # (rollout restart with maxSurge=1 gives zero-downtime
            # rotation).
            - name: SCIM_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.scim.tokenSecretName | quote }}
                  key: SCIM_BEARER_TOKEN
            {{- end }}
            {{- /* Validate: OTel headersSecretName can't be set unless otel.enabled.
                   Setting it alone is a typo / partial config — fail loud rather than
                   render a Secret reference the running pod won't consume. */ -}}
            {{- if and .Values.otel.headersSecretName (not .Values.otel.enabled) }}
            {{- fail "otel.headersSecretName is set but otel.enabled is false — either set otel.enabled=true to use the headers, or clear otel.headersSecretName. See charts/aifactory/values.yaml." }}
            {{- end }}
            {{- if .Values.otel.enabled }}
            # OpenTelemetry distributed tracing (Epic #35 #42 PR-2).
            # The web-server's init_tracing() reads OTEL_EXPORTER_OTLP_ENDPOINT
            # to decide whether to install an OTLP exporter. When unset
            # (default), spans build in memory + drop; setting these env
            # vars turns on real export. Headers Secret is optional and
            # only mounted via valueFrom when ``headersSecretName`` is set.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ required "otel.enabled=true requires otel.endpoint (e.g. http://tempo.observability.svc:4317). See charts/aifactory/values.yaml." .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.otel.protocol | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            # SDK env-var names per the OTel spec. ParentBased + ratio
            # sampler are the SDK's built-in pair; the Python SDK reads
            # these directly so no app-side parsing needed.
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.otel.samplingRatio | quote }}
            {{- if .Values.otel.headersSecretName }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otel.headersSecretName | quote }}
                  key: OTEL_EXPORTER_OTLP_HEADERS
            {{- end }}
            {{- end }}
            {{- /* Validate audit.anchor.scheduler enum */ -}}
            {{- if .Values.audit.anchor.enabled }}
            {{- $scheduler := .Values.audit.anchor.scheduler | default "cronjob" }}
            {{- if not (has $scheduler (list "cronjob" "in-process")) }}
            {{- fail (printf "audit.anchor.scheduler=%q is invalid — must be 'cronjob' or 'in-process'. See charts/aifactory/values.yaml." $scheduler) }}
            {{- end }}
            # Epic #35 #43 PR-2 — signed audit-chain anchor.
            # AUDIT_ANCHOR_ENABLED is consumed by the web-server's
            # lifespan: it bootstraps the signing key (audit_signing_keys
            # table) on startup and, when scheduler=in-process, kicks
            # off the daily asyncio cron. For scheduler=cronjob the
            # Kubernetes CronJob template below runs the same
            # `python -m server.jobs.audit_anchor_cron` invocation.
            - name: AUDIT_ANCHOR_ENABLED
              value: "true"
            - name: AUDIT_ANCHOR_SCHEDULER
              value: {{ $scheduler | quote }}
            {{- /* v1.2 #208 — per-tenant audit-chain anchor.
                   Validator: perTenant=true requires tenant.isolationEnabled=true
                   (per-tenant keys live in the Vault path provisioned only by
                   isolation mode — design open-question #6 resolution). */ -}}
            {{- if .Values.audit.anchor.perTenant }}
            {{- if not .Values.tenant.isolationEnabled }}
            {{- fail "audit.anchor.perTenant=true requires tenant.isolationEnabled=true — per-tenant anchor keys live in the tenant's Vault path which is provisioned only by tenant isolation. See charts/aifactory/values.yaml." }}
            {{- end }}
            - name: AUDIT_ANCHOR_PER_TENANT
              value: "true"
            - name: AUDIT_ANCHOR_KEY_CACHE_SIZE
              value: {{ .Values.audit.anchor.perTenantOptions.keyCacheSize | default 1000 | quote }}
            - name: AUDIT_ANCHOR_BATCH_SIZE
              value: {{ .Values.audit.anchor.perTenantOptions.batchSize | default 100 | quote }}
            {{- end }}
            {{- end }}
            {{- /* Claude enforcement wrapper (Epic #35 v1.2 / #207).
                   Opt-in per-tenant budget + allowlist + audit for the native
                   Claude Agent SDK path.  When disabled (default), create_client()
                   returns bare ClaudeSDKClient — v1.1 behaviour unchanged.
                   Validate failureMode enum before rendering. */ -}}
            {{- $claudeFail := .Values.claude.enforcement.failureMode | default "open" }}
            {{- if not (has $claudeFail (list "closed" "open")) }}
            {{- fail (printf "claude.enforcement.failureMode=%q is invalid — must be 'closed' or 'open'. See charts/aifactory/values.yaml." $claudeFail) }}
            {{- end }}
            {{- if .Values.claude.enforcement.enabled }}
            # Claude enforcement wrapper env vars.  create_client() +
            # create_simple_client() read these to decide whether to wrap
            # the ClaudeSDKClient in _EnforcedClaudeSDKClient.
            # See docs/docs/concepts/claude-enforcement.md.
            - name: AIFACTORY_CLAUDE_ENFORCEMENT_ENABLED
              value: "true"
            - name: AIFACTORY_CLAUDE_ENFORCEMENT_FAILURE_MODE
              value: {{ $claudeFail | quote }}
            {{- end }}
            {{- /* Validate: litellm.audit.fullTextCapture=true requires litellm.enabled.
                   Catches the operator who sets the audit knob on a deployment that
                   doesn't run the gateway — silent no-op otherwise. */ -}}
            {{- if and .Values.litellm.audit.fullTextCapture (not .Values.litellm.enabled) }}
            {{- fail "litellm.audit.fullTextCapture=true requires litellm.enabled=true — either enable the gateway or clear the fullTextCapture flag. See charts/aifactory/values.yaml." }}
            {{- end }}
            {{- /* Validate: litellm.audit.failureMode enum */ -}}
            {{- $llFail := .Values.litellm.audit.failureMode | default "closed" }}
            {{- if not (has $llFail (list "closed" "open")) }}
            {{- fail (printf "litellm.audit.failureMode=%q is invalid — must be 'closed' or 'open'. See charts/aifactory/values.yaml." $llFail) }}
            {{- end }}
            {{- if .Values.litellm.enabled }}
            # Epic #35 #38 — LiteLLM gateway integration.
            # When the sub-chart is enabled, the AIFactory web pod
            # routes OpenAI-compatible provider calls (OpenAI, Codex,
            # Gemini, Ollama, Bedrock, Vertex) through the in-cluster
            # LiteLLM Service. Claude calls bypass — the Agent SDK
            # spawns the `claude` CLI which speaks Anthropic-format
            # `/v1/messages`, wire-incompatible with LiteLLM's OpenAI
            # endpoint (closed in v1.2). See concept doc at
            # docs/docs/concepts/litellm-gateway.md.
            #
            # LITELLM_GATEWAY_URL: when ``litellm.gatewayUrl`` is set,
            # we honour it verbatim (operator-managed external
            # gateway). Otherwise we compute the sub-chart's in-cluster
            # Service URL — the upstream chart names its Service after
            # ``{ReleaseName}-{ChartName}`` and our alias is ``litellm``
            # so the final form is ``{Release}-litellm.{Ns}.svc:4000``.
            {{- if .Values.litellm.gatewayUrl }}
            - name: LITELLM_GATEWAY_URL
              value: {{ .Values.litellm.gatewayUrl | quote }}
            {{- else }}
            - name: LITELLM_GATEWAY_URL
              value: "http://{{ .Release.Name }}-litellm.{{ .Release.Namespace }}.svc.cluster.local:4000"
            {{- end }}
            # Master key (KMS-wrapped) for the LiteLLM admin API
            # (key/generate, budget/update, key/list, key/delete used
            # by the virtual-key lifecycle reconciler from PR-2b). The
            # web pod's startup unwraps the value via the configured
            # KMS backend before any admin call. Required when the
            # gateway is enabled — schema validator above enforces.
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "litellm.enabled=true requires litellm.masterKeySecretName (a Kubernetes Secret with a key named LITELLM_MASTER_KEY containing the KMS-wrapped master key). See charts/aifactory/values.yaml." .Values.litellm.masterKeySecretName | quote }}
                  key: LITELLM_MASTER_KEY
            # Audit hook knobs — read by the provider classes (PR-2b
            # work, env vars wired here so the chart is forward-ready).
            - name: LITELLM_AUDIT_ENABLED
              value: {{ .Values.litellm.audit.enabled | quote }}
            - name: LITELLM_AUDIT_FULL_TEXT
              value: {{ .Values.litellm.audit.fullTextCapture | quote }}
            - name: LITELLM_AUDIT_FAILURE_MODE
              value: {{ $llFail | quote }}
            {{- if .Values.litellm.audit.extraRedactionPatterns }}
            # Operator-supplied PII patterns layered on top of the
            # built-ins (US SSN, email, US phone — design §4). Encoded
            # as a JSON array string for env-var transport; the
            # web-pod's llm_pii_redactor parses + compiles at start.
            # Bad regexes log a WARNING and are skipped (one bad
            # pattern doesn't disable all redaction).
            - name: LITELLM_AUDIT_EXTRA_PATTERNS
              value: {{ .Values.litellm.audit.extraRedactionPatterns | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.tenant.isolationEnabled }}
            # Epic #35 #36 PR-3 — Tenant Isolation Mode.
            # When enabled, the reconciler in the web pod creates per-
            # tenant Namespace + SA + NetPol + S3 prefix + Vault path
            # on Organization create. All env vars below are read by
            # ``services/tenant_reconciler.py`` at start-up; changing
            # values.yaml + ``helm upgrade`` is the supported way to
            # tune them (no live-reload). See concept doc at
            # docs/docs/concepts/tenant-isolation.md.
            - name: TENANT_ISOLATION_ENABLED
              value: "true"
            - name: TENANT_NAMESPACE_PREFIX
              value: {{ .Values.tenant.namespacePrefix | quote }}
            - name: TENANT_CNI_BACKEND
              value: {{ .Values.tenant.networkPolicy.cniBackend | quote }}
            - name: TENANT_DELETION_GRACE_DAYS
              value: {{ .Values.tenant.deletionGraceDays | quote }}
            - name: TENANT_LIMIT_RANGE_CPU
              value: {{ .Values.tenant.limitRange.defaultCpu | quote }}
            - name: TENANT_LIMIT_RANGE_MEMORY
              value: {{ .Values.tenant.limitRange.defaultMemory | quote }}
            - name: TENANT_QUOTA_MAX_PODS
              value: {{ .Values.tenant.resourceQuota.maxPods | quote }}
            - name: TENANT_QUOTA_MAX_PVCS
              value: {{ .Values.tenant.resourceQuota.maxPvcs | quote }}
            {{- end }}
            {{- if .Values.rmux.enabled }}
            # Epic #44 R3 — flip on the rmux Live Agent Console.
            # The web-server's startup runtime checks for the binary
            # before mounting the bridge router; if WITH_RMUX=false
            # (no binary in the image), the flag is honoured at the
            # env level but the feature stays off and a warning is
            # logged — operator misconfiguration can't run rmux without
            # the binary.
            - name: AIFACTORY_RMUX_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.remoteControl.enabled }}
            # Claude Code Remote Control — signal to the agent_service
            # that this deployment is set up to serve remote-control
            # sessions.  The per-task ``enableRemoteControl`` flag
            # still gates whether a SPECIFIC task uses Remote Control;
            # this env var is just a "deployment supports it" marker.
            - name: AIFACTORY_REMOTE_CONTROL_SUPPORTED
              value: "true"
            {{- end }}
            {{- if .Values.workspaces.enabled }}
            # Portal-managed project workspaces (#82 PR-B).  Points the
            # clone service in project_workspace_service.py at the PVC
            # mount so ``POST /api/projects {gitUrl}`` writes the cloned
            # repos to durable storage instead of the pod's tmpfs root.
            - name: PROJECT_WORKSPACE_ROOT
              value: {{ .Values.workspaces.mountPath | quote }}
            {{- end }}
            {{- if .Values.mcpCredentials.enabled }}
            # MCP credentials — env-var-only providers.  File-based
            # providers (AWS / GCP / Kubernetes) land via volumeMount.
            # Each block is independent so operators can mount partial
            # provider sets.  Empty Secret keys are tolerated by K8s
            # (the env var just resolves to the empty string), but the
            # MCP credential probes treat empty as "not configured" —
            # they only enable the catalog server when the value is
            # truthy.
            {{- if .Values.mcpCredentials.providers.github }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpCredentials.secretName | quote }}
                  key: github-token
            {{- end }}
            {{- if .Values.mcpCredentials.providers.gitlab }}
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpCredentials.secretName | quote }}
                  key: gitlab-token
            - name: GITLAB_INSTANCE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpCredentials.secretName | quote }}
                  key: gitlab-instance-url
                  optional: true
            {{- end }}
            {{- if .Values.mcpCredentials.providers.azureDevOps }}
            - name: AZURE_DEVOPS_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpCredentials.secretName | quote }}
                  key: azure-devops-token
            - name: AZURE_DEVOPS_ORG_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpCredentials.secretName | quote }}
                  key: azure-devops-org-url
            {{- end }}
            {{- if .Values.mcpCredentials.providers.azure }}
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpCredentials.secretName | quote }}
                  key: azure-tenant-id
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpCredentials.secretName | quote }}
                  key: azure-client-id
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpCredentials.secretName | quote }}
                  key: azure-client-secret
            {{- end }}
            {{- if .Values.mcpCredentials.providers.gcp }}
            # GCP MCP (issue #168) — remote-first HTTP transport via Cloud AI
            # Companion. Two env vars needed:
            #   GOOGLE_APPLICATION_CREDENTIALS: path to the SA JSON file
            #     (the volume mount below places it at /etc/aifactory/gcp-sa.json).
            #     The Cloud AI Companion MCP server reads this env var directly
            #     and performs its own ADC exchange — AIFactory does not mint
            #     OAuth2 tokens.
            #   GCP_MCP_ENDPOINT: optional endpoint override consumed by
            #     mcp_catalog._get_gcp_mcp_endpoint(). When empty the Python
            #     code falls through to the GA default endpoint. Set when the
            #     deployment uses VPC Service Controls, staging projects, or
            #     future GCP MCP servers (BigQuery, Cloud Run, etc.).
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/etc/aifactory/gcp-sa.json"
            {{- if and .Values.mcpCredentials.gcp .Values.mcpCredentials.gcp.endpointOverride }}
            - name: GCP_MCP_ENDPOINT
              value: {{ .Values.mcpCredentials.gcp.endpointOverride | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem=true demands every writable path
            # be a tmpfs/emptyDir mount.
            - name: tmp
              mountPath: /tmp
            - name: aifactory-data
              mountPath: /home/nonroot/.aifactory
            {{- if .Values.rmux.enabled }}
            # Epic #44 R3 — rmux daemon socket + pane FIFOs.  Owned by
            # the pod user (nonroot) and tmpfs-backed for low-latency
            # pipe-pane I/O.
            - name: aifactory-rmux
              mountPath: /var/run/aifactory/rmux
            - name: aifactory-panes
              mountPath: /var/run/aifactory/panes
            {{- end }}
            {{- if .Values.remoteControl.enabled }}
            # Claude Code Remote Control — mount the full-scope OAuth
            # credentials from the operator's ``claude auth login`` so
            # spawned agents fall through to them (the inference-only
            # token AIFactory uses by default gets rejected by Remote
            # Control).  ``subPath`` ensures the file lands at exactly
            # the path Claude Code expects, not in a directory of
            # secret-projected files.  readOnly + the implicit 0400
            # mode on secret volumes keeps the token tightly scoped.
            - name: claude-remote-credentials
              mountPath: {{ .Values.remoteControl.mountPath | quote }}
              subPath: credentials.json
              readOnly: true
            {{- end }}
            {{- if and .Values.mcpCredentials.enabled .Values.mcpCredentials.providers.aws }}
            # AWS credentials — mounted at the path the awscli/SDK
            # native discovery checks first.  ``subPath`` projects the
            # single Secret key as a file at the exact location, not
            # a directory.
            - name: mcp-aws-credentials
              mountPath: /home/nonroot/.aws/credentials
              subPath: aws-credentials
              readOnly: true
            {{- end }}
            {{- if and .Values.mcpCredentials.enabled .Values.mcpCredentials.providers.kubernetes }}
            # Kubernetes — operator-supplied kubeconfig.  For
            # cloud-native identity (in-cluster ServiceAccount), set
            # providers.kubernetes=false; the MCP server will pick up
            # /var/run/secrets/kubernetes.io/serviceaccount/ on its own.
            - name: mcp-kubeconfig
              mountPath: /home/nonroot/.kube/config
              subPath: kubeconfig
              readOnly: true
            {{- end }}
            {{- if and .Values.mcpCredentials.enabled .Values.mcpCredentials.providers.gcp }}
            # GCP service account JSON.  GOOGLE_APPLICATION_CREDENTIALS
            # env (set above) points here.  Path is under /etc rather
            # than /home/nonroot to make the source obvious in audits.
            - name: mcp-gcp-sa
              mountPath: /etc/aifactory/gcp-sa.json
              subPath: gcp-service-account.json
              readOnly: true
            {{- end }}
            {{- if and .Values.saml.enabled .Values.saml.idpMetadataSecretName }}
            # SAML IdP metadata XML (Epic #35 #41 PR-2). Operator-supplied
            # Secret with key ``idp-metadata.xml``; the SAML client reads
            # it from this path on startup (no URL refresher when file-
            # sourced — rotation is recreate-Secret + restart-pod).
            - name: saml-idp-metadata
              mountPath: /etc/saml/idp-metadata.xml
              subPath: idp-metadata.xml
              readOnly: true
            {{- end }}
            {{- if and .Values.saml.enabled .Values.saml.spCertSecretName }}
            # SAML SP signing cert + key (Epic #35 #41 PR-2). Mounted as
            # a directory so the optional ``cert.pem.previous`` key (for
            # the rotation overlap window — see concept doc) projects
            # alongside ``cert.pem`` + ``key.pem`` when present.
            - name: saml-sp-cert
              mountPath: /etc/saml/sp
              readOnly: true
            {{- end }}
            {{- if and .Values.global .Values.global.customCABundle.secretName }}
            - name: custom-ca
              mountPath: /etc/ssl/custom-ca
              readOnly: true
            {{- end }}
            {{- if .Values.workspaces.enabled }}
            # Portal-managed project workspaces (#82 PR-B).  Backing PVC
            # is templated by workspaces-pvc.yaml.  Path is also what
            # PROJECT_WORKSPACE_ROOT env var (set above) points the
            # clone service at.
            - name: aifactory-workspaces
              mountPath: {{ .Values.workspaces.mountPath | quote }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: aifactory-data
          emptyDir: {}
        {{- if .Values.rmux.enabled }}
        - name: aifactory-rmux
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.rmux.rmuxEmptyDirSizeLimit }}
        - name: aifactory-panes
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.rmux.panesEmptyDirSizeLimit }}
        {{- end }}
        {{- if .Values.remoteControl.enabled }}
        - name: claude-remote-credentials
          secret:
            secretName: {{ required "remoteControl.credentialsSecretName is required when remoteControl.enabled=true — see charts/aifactory/values.yaml for the kubectl create secret command" .Values.remoteControl.credentialsSecretName }}
            # defaultMode 0400 on the projected file — Claude Code
            # refuses to read credentials with looser perms.  K8s
            # converts this to mode 0400 inside the volume.
            defaultMode: 0400
            items:
              - key: credentials.json
                path: credentials.json
        {{- end }}
        {{- if .Values.mcpCredentials.enabled }}
        # Each file-mounted MCP provider gets its own Volume that
        # projects ONLY the key it needs from the shared Secret.  This
        # gives the operator one Secret to rotate while keeping the
        # pod's volume list explicit about which keys are exposed.
        # All mounts use defaultMode: 0400 — the cloud CLIs (and
        # Kubernetes' kubectl) refuse to read credentials with looser
        # perms, same posture as remoteControl above.
        {{- $secretName := required "mcpCredentials.secretName is required when mcpCredentials.enabled=true — see charts/aifactory/values.yaml for the kubectl create secret command" .Values.mcpCredentials.secretName }}
        {{- if .Values.mcpCredentials.providers.aws }}
        - name: mcp-aws-credentials
          secret:
            secretName: {{ $secretName | quote }}
            defaultMode: 0400
            items:
              - key: aws-credentials
                path: aws-credentials
        {{- end }}
        {{- if .Values.mcpCredentials.providers.kubernetes }}
        - name: mcp-kubeconfig
          secret:
            secretName: {{ $secretName | quote }}
            defaultMode: 0400
            items:
              - key: kubeconfig
                path: kubeconfig
        {{- end }}
        {{- if .Values.mcpCredentials.providers.gcp }}
        # GCP service-account JSON for Cloud AI Companion MCP (issue #168).
        # ``mcpCredentials.gcp.secretName`` takes priority over the shared
        # ``mcpCredentials.secretName`` so operators who store the GCP SA JSON
        # in a dedicated Secret (e.g. synced from GCP Secret Manager) don't
        # have to merge it into the combined credential Secret.
        {{- $gcpSecretName := $secretName }}
        {{- if and .Values.mcpCredentials.gcp .Values.mcpCredentials.gcp.secretName }}
        {{- $gcpSecretName = .Values.mcpCredentials.gcp.secretName }}
        {{- end }}
        - name: mcp-gcp-sa
          secret:
            secretName: {{ $gcpSecretName | quote }}
            defaultMode: 0400
            items:
              - key: gcp-service-account.json
                path: gcp-service-account.json
        {{- end }}
        {{- end }}
        {{- if and .Values.saml.enabled .Values.saml.idpMetadataSecretName }}
        - name: saml-idp-metadata
          secret:
            secretName: {{ .Values.saml.idpMetadataSecretName | quote }}
            defaultMode: 0444
            items:
              - key: idp-metadata.xml
                path: idp-metadata.xml
        {{- end }}
        {{- if and .Values.saml.enabled .Values.saml.spCertSecretName }}
        # SP cert + private key. Private key gets mode 0400 (owner-only)
        # via the items projection; cert.pem is world-readable. The
        # optional ``cert.pem.previous`` key (for the rotation overlap
        # window — see docs/docs/concepts/saml-scim.md) projects via a
        # second volume marked ``optional: true`` so the Secret missing
        # that key during steady-state operation doesn't block pod
        # startup. Operators rotating SP certs add the previous PEM as
        # ``cert.pem.previous`` in the same Secret, restart the pod,
        # then drop the key after IdP-side propagation.
        - name: saml-sp-cert
          projected:
            defaultMode: 0444
            sources:
              - secret:
                  name: {{ .Values.saml.spCertSecretName | quote }}
                  items:
                    - key: cert.pem
                      path: cert.pem
                      mode: 0444
                    - key: key.pem
                      path: key.pem
                      mode: 0400
              - secret:
                  name: {{ .Values.saml.spCertSecretName | quote }}
                  optional: true
                  items:
                    - key: cert.pem.previous
                      path: cert.pem.previous
                      mode: 0444
        {{- end }}
        {{- if and .Values.global .Values.global.customCABundle.secretName }}
        - name: custom-ca
          secret:
            secretName: {{ .Values.global.customCABundle.secretName }}
        {{- end }}
        {{- if .Values.workspaces.enabled }}
        # PVC for portal-managed project workspaces (#82 PR-B).  See
        # templates/workspaces-pvc.yaml for the claim itself.
        - name: aifactory-workspaces
          persistentVolumeClaim:
            claimName: {{ include "aifactory.fullname" . }}-workspaces
        {{- end }}
