apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aifactory.fullname" . }}
  labels:
    {{- include "aifactory.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # Rolling update with maxSurge=0 — v1.0 has one replica, so we
    # tear down before bringing up to avoid double-DB-writes during
    # the version switch. v1.1 (multi-replica + Redis pub/sub) will
    # bump this to maxSurge=1.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "aifactory.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aifactory.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll pods on ConfigMap change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "aifactory.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: aifactory
          image: {{ include "aifactory.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "aifactory.fullname" . }}-config
          env:
            # DATABASE_URL: produced by ExternalSecret OR by an
            # out-of-band Secret named values.postgres.externalSecretName.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.externalSecretName }}
                  key: database-url
            {{- if .Values.oidc.enabled }}
            - name: APP_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.clientSecretRef.name }}
                  key: {{ .Values.oidc.clientSecretRef.key }}
            {{- end }}
            {{- if eq .Values.kms.backend "fernet" }}
            - name: KMS_FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kms.fernetKeyRef.name }}
                  key: {{ .Values.kms.fernetKeyRef.key }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem=true demands every writable path
            # be a tmpfs/emptyDir mount.
            - name: tmp
              mountPath: /tmp
            - name: aifactory-data
              mountPath: /home/nonroot/.aifactory
            {{- if and .Values.global .Values.global.customCABundle.secretName }}
            - name: custom-ca
              mountPath: /etc/ssl/custom-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: aifactory-data
          emptyDir: {}
        {{- if and .Values.global .Values.global.customCABundle.secretName }}
        - name: custom-ca
          secret:
            secretName: {{ .Values.global.customCABundle.secretName }}
        {{- end }}
