{{- /*
  Alembic migration hook. Run before the Deployment is installed or
  upgraded when the application does not apply migrations on startup.
  The database Secret must exist before this hook runs.
*/}}
{{- if not .Values.migrations.autoApply }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aifactory.fullname" . }}-migrations
  labels:
    {{- include "aifactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  {{- with .Values.migrations.jobActiveDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  backoffLimit: {{ .Values.migrations.jobBackoffLimit }}
  template:
    metadata:
      labels:
        {{- include "aifactory.jobPodLabels" (dict "ctx" . "component" "migrations") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with include "aifactory.imagePullSecrets" . }}
      {{- . | trim | nindent 6 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: migrations
          image: {{ .Values.migrations.jobImage | default (include "aifactory.image" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/home/projects/MagesticAI/.venv/bin/python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.externalSecretName }}
                  key: database-url
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            {{- if and .Values.global .Values.global.customCABundle.secretName }}
            - name: SSL_CERT_FILE
              value: /etc/ssl/custom-ca/{{ .Values.global.customCABundle.key }}
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/custom-ca/{{ .Values.global.customCABundle.key }}
            {{- end }}
          resources:
            {{- toYaml (.Values.migrations.jobResources | default .Values.resources) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.global .Values.global.customCABundle.secretName }}
            - name: custom-ca
              mountPath: /etc/ssl/custom-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.global .Values.global.customCABundle.secretName }}
        - name: custom-ca
          secret:
            secretName: {{ .Values.global.customCABundle.secretName }}
        {{- end }}
{{- end }}
