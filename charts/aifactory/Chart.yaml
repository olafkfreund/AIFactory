apiVersion: v2
name: aifactory
description: |
  AIFactory — browser-based AI task management + agent orchestration
  platform. Production Helm chart for self-hosted enterprise
  deployments with PSS-restricted security, NetworkPolicy egress
  control, ExternalSecrets integration, and OIDC SSO.
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/dataseeek/AIFactory
sources:
  - https://github.com/dataseeek/AIFactory
maintainers:
  - name: DataSeek Team
    email: olaf@freundcloud.com
icon: https://raw.githubusercontent.com/dataseeek/AIFactory/main/assets/aifactory_logo.png
keywords:
  - ai
  - llm
  - agent-orchestration
  - claude
  - enterprise
annotations:
  category: AI/MachineLearning
  artifacthub.io/license: AGPL-3.0
  artifacthub.io/changes: |
    - kind: added
      description: First release for the v1.0 enterprise pilot (Epic #26).
# CNPG (Cloud Native PostgreSQL) is added as an OPTIONAL dependency
# in P4.4 (postgres.bundled=true mode). Until then, the chart targets
# external Postgres only — production deployments typically point at
# a managed instance (RDS / Cloud SQL / AKS Postgres) via
# ExternalSecret anyway.
#
# LiteLLM gateway (Epic #35 #38 PR-3). Optional sub-chart that gives
# operators per-tenant LLM budget enforcement, rate-limiting, model
# allowlists, and a Prometheus metrics surface for the Grafana
# dashboards shipped in dashboards/litellm.json. Pulled lazily — when
# litellm.enabled=false (default), the dependency is not fetched and
# no LiteLLM pods deploy.
#
# Version pin policy (design §3 + reviewer recommendation #3):
#   • PATCH bumps (1.86.2 → 1.86.x): tracked by renovate.json,
#     auto-mergeable after CI passes.
#   • MINOR bumps (1.86.x → 1.87.x): require manual review + a
#     staging-cluster test against the budget + allowlist admin API.
#     Upstream sometimes ships breaking values.yaml schema changes
#     in minor versions; never auto-merge these.
#   • MAJOR bumps (1.x → 2.x): full re-evaluation of the design.
# See docs/docs/concepts/litellm-gateway.md "Version pin + bump
# cadence" section for the operator-facing version of this policy.
dependencies:
  - name: litellm-helm
    version: "1.86.2"
    repository: oci://ghcr.io/berriai
    condition: litellm.enabled
    alias: litellm
