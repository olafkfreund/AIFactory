# Default values for the AIFactory chart.
# This file is the primary configuration surface for operators.
#
# Sections:
#   image           — container image + pull config
#   replicaCount    — pinned to 1 for v1.0 (WebSocket fan-out limitation)
#   resources       — CPU/memory requests + limits
#   securityContext — PSS-restricted defaults; do not relax without review
#   service         — ClusterIP by default; Ingress controls public exposure
#   ingress         — disabled by default; operators wire their controller
#   serviceAccount  — dedicated SA, no automount of API token
#   podDisruptionBudget — minAvailable: 1
#   hpa             — disabled by default (single replica)
#   networkPolicy   — default-deny + explicit 443 egress
#   migrations      — Alembic Job mode (autoApply=false in prod)
#   postgres        — bundled (CNPG) OR external (via ExternalSecret)
#   externalSecrets — store config for the 4 supported backends
#   oidc            — OIDC SSO settings (gated by enabled flag)
#   kms             — at-rest encryption backend selection
#   global          — cross-cutting: customCABundle, priorityClass, etc.

image:
  # Override with your private mirror; image-mirroring.md covers cosign
  # signature-preserving copy.
  repository: ghcr.io/dataseeek/aifactory
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1
# To scale beyond 1 replica, set ``redis.enabled: true`` AND configure
# either ``redis.url`` (dev/test only) or ``redis.externalSecretName``.
# Without Redis, multi-replica deployments will receive WebSocket events
# only on the replica that originated them — cross-replica delivery
# requires the pub/sub bridge (Epic #35 #40 PR-1).

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# PSS-restricted compatible. NEVER set runAsUser=0 or
# allowPrivilegeEscalation=true — admission controllers reject.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Sandbox: opt-in stronger pod isolation via Kubernetes RuntimeClass.
# Currently supports gVisor (Google's user-space kernel that filters
# syscalls between the workload and the host kernel). Disabled by
# default — gVisor adds ~5-15% CPU overhead and blocks a handful of
# syscalls that some workloads need.
#
# Prereqs (cluster operator must provision separately):
#   1. gVisor runsc installed on the node pool
#   2. A RuntimeClass object named per ``runtimeClassName`` below
#      (default ``gvisor``) created in the cluster
#
# AIFactory's bash allowlist (git, curl, npm install, apt-get) works
# under gVisor in practice. Workloads known NOT to work: tcpdump,
# BPF programs, nested containers, anything that mmap()'s /dev/kvm.
# See guides/security/gvisor.md for the full compatibility note.
#
# Epic #35 child #37.
sandbox:
  gvisor:
    enabled: false
    # Override only if your cluster operator created the RuntimeClass
    # under a different name (e.g. some platforms use "runsc" directly).
    runtimeClassName: gvisor

service:
  type: ClusterIP
  port: 80
  targetPort: 3101
  annotations: {}

ingress:
  enabled: false
  className: ""  # e.g. "nginx" or "alb"
  annotations: {}
  hosts:
    - host: aifactory.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # API token automount is OFF: pods that don't talk to the K8s API
  # don't need it, and dropping it shrinks the blast radius of a
  # container compromise.
  automountServiceAccountToken: false

rbac:
  create: false  # the app doesn't read the K8s API in v1.0

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Horizontal Pod Autoscaler. Default off — operators flip ``enabled: true``
# to opt in. **Requires ``redis.enabled: true`` for cross-replica WebSocket
# delivery to work** — otherwise the autoscaler will spin up additional
# pods that can't see events from other replicas (Epic #35 #40 PR-1).
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

networkPolicy:
  # Default-deny + explicit allowlist. ALWAYS enabled in production.
  enabled: true
  # Egress: 443/tcp to anywhere (Anthropic API, IdP, KMS, external
  # Postgres if hosted off-cluster). Operators can tighten further
  # by overriding egress rules.
  egress:
    allowExternalHttps: true
    # If your Postgres is in-cluster on a non-443 port, add a rule:
    # - to: [{namespaceSelector: {matchLabels: {name: postgres}}}]
    #   ports: [{protocol: TCP, port: 5432}]
    extraRules: []
  ingress:
    # Default: only the ingress controller may reach us.
    fromIngressNamespace: "ingress-nginx"
    extraRules: []

migrations:
  # Production: false. Operators run the alembic Job out-of-band so
  # rollouts can be ordered/audited. Set true for POC/dev mode where
  # the app autoApplies on boot.
  autoApply: false
  # When false, an alembic-upgrade Job is created and the deployment
  # waits for it to complete via init container.
  jobImage: ""  # defaults to the same image as the app
  jobBackoffLimit: 3

postgres:
  # When true: install cloudnative-pg sub-chart for POC mode.
  # When false: point at external Postgres via DATABASE_URL secret.
  bundled: false
  # External-Postgres mode: name of the K8s Secret carrying
  # DATABASE_URL (key="database-url"). For ExternalSecret backends,
  # see .externalSecrets below — those create this Secret for you.
  externalSecretName: aifactory-db
  # CNPG sub-chart values (used when bundled=true). Defaults are
  # POC-grade — operators should override for production.
  cloudnative-pg:
    cluster:
      instances: 1
      storage:
        size: 10Gi

# Pick ONE backend. The chart renders only the matching ExternalSecret
# template; the others stay dormant.
externalSecrets:
  enabled: false
  # One of: vault, aws-sm, azure-kv, gcp-sm
  backend: vault
  # Secret references inside the chosen backend. Override per env.
  refs:
    databaseUrl: "secret/data/aifactory/db#url"
    jwtSecret: "secret/data/aifactory/jwt#secret"
    oidcClientSecret: "secret/data/aifactory/oidc#client_secret"
    kmsFernetKey: "secret/data/aifactory/kms#fernet_key"
    anthropicApiKey: "secret/data/aifactory/llm#anthropic_key"
  # ClusterSecretStore name (created out-of-band by platform team).
  clusterSecretStoreName: aifactory-secrets

oidc:
  enabled: false
  provider: keycloak  # keycloak | okta | azure_ad
  issuerUrl: ""
  clientId: ""
  # Mounted from the Secret created by externalSecrets (or a plain
  # K8s Secret if externalSecrets.enabled=false).
  clientSecretRef:
    name: aifactory-oidc
    key: client-secret
  scope: ""  # empty → preset default per provider
  groupToRole: {}  # e.g. {"aifactory-admin": "admin"}
  defaultRole: "member"

# ---------------------------------------------------------------------------
# SAML 2.0 Web SSO (Epic #35 #41).
#
# When ``saml.enabled: true``, the web-server mounts ``/api/auth/saml/login``,
# ``/api/auth/saml/acs``, ``/api/auth/saml/metadata`` and surfaces the
# IdP in the login-page dropdown next to any configured OIDC IdP.
#
# When ``saml.enabled: false`` (default), no SAML routes are mounted and
# the deployment is byte-for-byte unchanged from pre-#41 behaviour.
#
# IdP metadata source — pick exactly ONE of:
#   • ``idpMetadataUrl`` — the operator's IdP publishes federation
#     metadata at a stable URL. The web-server fetches it on startup
#     and refreshes every 4 hours in the background (48-hour stale-
#     warn, never crashes the pod).
#   • ``idpMetadataSecretName`` — operator-supplied K8s Secret with
#     key ``idp-metadata.xml`` mounted at /etc/saml/idp-metadata.xml.
#     Rotation = recreate Secret + restart pod.
#
# SP cert (signing AuthnRequests + decrypting EncryptedAssertions):
#   • Optional in plain-vanilla flows; REQUIRED when
#     ``requireEncryptedAssertion: true``.
#   • Provide via ``spCertSecretName`` — K8s Secret with keys
#     ``cert.pem`` + ``key.pem`` (and optional ``cert.pem.previous`` for
#     the rotation overlap window — see docs/docs/concepts/saml-scim.md).
#
# Identity-key contract (locked in design decision #6 + v1.1 hard
# constraint): ``scim.userName == saml.NameID == users.email``. SCIM
# provisions the User row first; SAML's NameID matches by case-
# insensitive email lookup. SAML alone never creates users (no JIT).
#
# Cross-IdP linkage (decision #4): if a User already has an OIDC
# identity, the first SAML login for that email is rejected with 409
# until an admin runs the linkage via DB. v1.2 ships the admin UI.
#
# Logout is LOCAL only (decision #11): we clear our session cookie and
# do NOT issue a SAML LogoutRequest to the IdP. Operators wanting
# IdP-side session kill use short session TTLs or the IdP admin console.
saml:
  # Master toggle. When false (default), no SAML wiring is added and
  # ``/api/auth/saml/*`` routes 404.
  enabled: false
  # Service Provider EntityID — the stable identifier the IdP knows
  # us by. Typically the public ACS URL's origin + ``/saml``, e.g.
  # ``https://aifactory.example.com/saml``. Must match the EntityID
  # the operator registered at the IdP.
  spEntityId: ""
  # Assertion Consumer Service URL — where the IdP POSTs the signed
  # assertion. Must be the absolute URL the browser can reach, e.g.
  # ``https://aifactory.example.com/api/auth/saml/acs``.
  acsUrl: ""
  # IdP federation-metadata URL (pick this OR idpMetadataSecretName).
  # The web-server fetches on startup + refreshes every 4 hours; the
  # last-known-good XML stays cached through transient IdP outages.
  idpMetadataUrl: ""
  # K8s Secret name with key ``idp-metadata.xml`` (pick this OR
  # idpMetadataUrl). Operator rotates by recreating the Secret +
  # restarting the pod. Mounted at /etc/saml/idp-metadata.xml.
  idpMetadataSecretName: ""
  # Machine-readable IdP key — matches the ``identityProviders[].name``
  # entry the login page renders. Default ``saml`` is fine for the
  # single-SAML-IdP v1.1 shape. Must NOT contain spaces.
  idpName: ""
  # Human-readable label for the login-page dropdown, e.g.
  # ``Corp SSO (SAML)``. Falls back to ``idpName`` when empty.
  idpDisplayName: ""
  # K8s Secret name with keys ``cert.pem`` + ``key.pem`` for the SP
  # signing cert + private key. Optional unless
  # ``requireEncryptedAssertion: true``. May also include
  # ``cert.pem.previous`` for the rotation overlap window — see the
  # SP cert rotation runbook in docs/docs/concepts/saml-scim.md.
  spCertSecretName: ""
  # When true, the SP rejects any assertion whose ``<Assertion>`` is
  # not encrypted. ``spCertSecretName`` is then mandatory (the SDK
  # uses the SP private key to decrypt). When false, assertions may
  # be plain XML — signature still required.
  requireEncryptedAssertion: false
  # Absolute URL to land on after an IdP-init flow (no RelayState).
  # Validator: scheme + host MUST match ``spEntityId`` to prevent open-
  # redirect via crafted IdP-init URLs. Leave empty to reject IdP-init
  # flows entirely (SP-init only).
  idpInitDefaultReturnTo: ""

# ---------------------------------------------------------------------------
# SCIM 2.0 user + group provisioning endpoint (Epic #35 #41).
#
# When ``scim.enabled: true``, the web-server mounts
# ``/api/scim/v2/Users`` + ``/api/scim/v2/Groups`` per RFC 7644. The
# operator's IdP (Okta / Azure AD / Keycloak) POSTs to these as users
# join, change roles, or leave the org. Soft-deleted users return 404
# on subsequent GET — matches Azure AD's deprovision-then-GET sync.
#
# Auth is a single static Bearer token from a K8s Secret (decision #3):
# every request to ``/api/scim/v2/*`` must carry
# ``Authorization: Bearer <token>``. Constant-time compare; rotation =
# recreate Secret + restart pod (the SDK reads at startup).
#
# Rate-limiting: NOT in-process (decision #12). Operators who want it
# set an ingress annotation, e.g.
#   nginx.ingress.kubernetes.io/limit-rps: "100"
#
# Filter grammar subset (decision #5): eq-only on
# ``userName`` / ``externalId`` / ``active``. Covers 100% of what
# Okta + Azure AD send during sync. Other operators return 400 with
# ``scimType: invalidFilter``.
scim:
  # Master toggle. When false (default), no SCIM routes are mounted —
  # the deployment is byte-for-byte unchanged from pre-#41 behaviour.
  enabled: false
  # K8s Secret name with key ``SCIM_BEARER_TOKEN`` — the static Bearer
  # the IdP sends in the Authorization header. Required when
  # ``enabled: true``. Generate via: ``openssl rand -base64 48 |
  # tr -d '\n=' | head -c 48`` then ``kubectl create secret generic
  # aifactory-scim --from-literal=SCIM_BEARER_TOKEN=<the-value>``.
  # Operator paste the same token into the IdP's SCIM connector.
  tokenSecretName: ""

kms:
  # One of: fernet (local key, POC only), aws_kms, vault_transit,
  # azure_kv, gcp_kms.
  backend: fernet
  # Backend-specific key references (env vars at the pod).
  fernetKeyRef:
    name: aifactory-kms
    key: fernet-key
  awsKmsKeyId: ""
  vaultTransitKey: "aifactory-root"
  azureKeyvaultUrl: ""
  azureKeyvaultKey: ""
  gcpKmsKeyName: ""

# Epic #26 P6 — Prometheus /metrics + Grafana dashboard.
metrics:
  # When set, the application requires this bearer for /metrics
  # scrapes. The ServiceMonitor below references the same secret so
  # Prometheus Operator passes it automatically. Leave empty for
  # open-scrape mode (default v1.0 — NetworkPolicy restricts source).
  scrapeTokenSecret:
    name: ""  # e.g., "aifactory-metrics" — provisioned by ExternalSecret
    key: token
  serviceMonitor:
    # Opt-in: requires the Prometheus Operator CRDs to be installed
    # cluster-wide. When false, operators scrape via pod annotations
    # (standard Prometheus configmap-based discovery).
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}      # extra labels for the ServiceMonitor selector
    relabelings: []

# Probes default to /api/health (P0); the cold-start window (database
# migrations, model loading) is generous so PSS-restricted runtimes
# without privileged init don't get killed.
probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60  # 5min cold-start window

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}

# Epic #44 R3 — rmux Live Agent Console (opt-in dev/demo capability).
# Pointing this at a bank-pilot image (built with ``WITH_RMUX=false``)
# is safe: the pod logs a warning and the feature stays disabled
# regardless of ``enabled: true`` here, so operator misconfiguration
# never runs without the binary.
#
# When ``enabled: true``:
#   • ``AIFACTORY_RMUX_ENABLED=true`` env var is injected
#   • ``emptyDir`` volumes mounted at ``/var/run/aifactory/rmux/`` and
#     ``/var/run/aifactory/panes/`` (owned by the pod user, tmpfs-backed
#     by default for low-latency pipe-pane I/O)
#   • Replicas are pinned to 1 regardless of HPA — multi-replica rmux
#     requires v1.1's Redis pub/sub for session visibility across pods
rmux:
  enabled: false
  # Memory cap for the panes ``emptyDir`` (FIFOs + buffered bytes).
  # 100Mi is generous for the v1 single-task-at-a-time model.
  panesEmptyDirSizeLimit: 100Mi
  # Memory cap for the rmux daemon socket dir.  10Mi covers the
  # socket + lockfile with plenty of margin.
  rmuxEmptyDirSizeLimit: 10Mi

# ---------------------------------------------------------------------------
# Portal-managed project workspaces (epic #82).
#
# When AIFactory accepts a Git URL via ``POST /api/projects {gitUrl}``
# (added in PR-A), the portal clones the repo into a writable directory
# rooted at ``PROJECT_WORKSPACE_ROOT``.  On laptop installs that defaults
# to ``~/.aifactory/workspaces/``; on K8s installs we need a PVC mounted
# at a fixed path so cloned workspaces survive pod restarts.
#
# When ``workspaces.enabled: true``:
#   1. A PVC of ``workspaces.size`` is created in the release namespace.
#   2. The PVC is mounted at ``workspaces.mountPath`` on the web-server pod.
#   3. ``PROJECT_WORKSPACE_ROOT`` env var is set to ``workspaces.mountPath``
#      so the clone service in ``project_workspace_service.py`` puts every
#      cloned repo under that path.
#
# When ``workspaces.enabled: false`` (default) nothing about the pod
# changes — laptop / single-tenant deployments that don't use the
# clone-from-URL flow keep working exactly as they did pre-#82.
#
# Multi-replica caveat: ``accessMode: ReadWriteOnce`` is fine for the
# v1.0 single-replica web-server.  v1.1's Redis-fan-out (#40) will let
# replicas > 1 share state, but the workspace PVC will then need to be
# RWX (NFS / Azure Files / EFS / CephFS) for cross-pod access.
workspaces:
  # Master toggle.  False means: no PVC, no env var, behaviour unchanged.
  enabled: false
  # PVC size.  100Gi is the recommended default — enough for ~50 cloned
  # repos averaging 2Gi each.  Resize via ``kubectl edit pvc`` on
  # supporting storage classes; recreate the PVC if not.
  size: 100Gi
  # StorageClass name.  Empty string lets Kubernetes pick the cluster
  # default; set explicitly for clusters with multiple classes (e.g.
  # ``gp3``, ``managed-premium``, ``standard-rwo``).
  storageClass: ""
  # Access mode.  Stay on RWO for v1.0 (single replica); v1.1 will need
  # RWX when Redis fan-out lets replicas > 1.
  accessMode: ReadWriteOnce
  # In-container mount path + ``PROJECT_WORKSPACE_ROOT`` value.  Keep
  # under /var/lib so it's clearly out-of-tree from the app code; the
  # ``nonroot`` user needs write access (the PVC's fsGroup honours
  # podSecurityContext.fsGroup automatically).
  mountPath: "/var/lib/aifactory/workspaces"

  # S3-compatible durable storage for project workspaces (Epic #35 #40
  # half-B PR-2).  When enabled, the app snapshots each project's
  # workspace dir to the configured bucket at task phase transitions
  # (coding / review_pending / completed / failed) and lazily restores
  # it on cold-pod access. Combined with ``redis.enabled=true``, this
  # makes ``replicas > 1`` survive pod death without losing in-flight
  # task state.
  #
  # Independent of ``workspaces.enabled``: operators can pair (PVC as
  # hot cache + S3 as durable store) OR run with S3-only (no PVC).
  #
  # Auth: AWS S3 + MinIO get typed values blocks. Azure / GCS are
  # supported via fsspec but configured via raw env (operator sets
  # AZURE_STORAGE_CONNECTION_STRING or GOOGLE_APPLICATION_CREDENTIALS
  # via extraEnv) — see docs/docs/concepts/workspace-storage.md.
  storage:
    # Master toggle. When false (default), no S3 wiring is added —
    # the app runs in PVC-only mode (or laptop-FS mode if
    # ``workspaces.enabled`` is also off). Setting this true on
    # ``replicas > 1`` is strongly recommended.
    enabled: false
    # fsspec URI base. REQUIRED when ``storage.enabled=true``. Examples:
    #   s3://aifactory-prod/workspaces        (AWS S3)
    #   s3://my-minio-bucket/workspaces        (MinIO; also set aws.endpointUrl)
    #   gs://my-gcs-bucket/workspaces          (GCS via gcsfs — env-var auth only)
    #   azure://container/aifactory            (Azure Blob via adlfs — env-var auth only)
    uriBase: ""
    # AWS-style auth. Also covers MinIO (an S3-compatible API) via the
    # endpointUrl override below.
    aws:
      # IRSA / IAM-role-for-service-account (EKS) OR
      # IAM-instance-role (EC2-backed nodes). When true, no Secret is
      # referenced and the operator sets the appropriate SA
      # annotation / role outside the chart. Recommended for production.
      useInstanceRole: false
      # Name of an existing Secret with keys ``AWS_ACCESS_KEY_ID`` +
      # ``AWS_SECRET_ACCESS_KEY``. REQUIRED when
      # ``useInstanceRole=false`` AND ``uriBase`` is an s3:// URI.
      credentialsSecretName: ""
      # MinIO / other S3-compatible: override the endpoint URL. Leave
      # empty for AWS S3 itself.
      endpointUrl: ""
      # MinIO typically needs path-style addressing
      # (``http://minio:9000/bucket/key``); AWS S3 prefers virtual-
      # hosted (``http://bucket.s3.amazonaws.com/key``). ``auto`` lets
      # boto3 pick.
      addressingStyle: "auto"  # auto | virtual | path

# ---------------------------------------------------------------------------
# Remote Control — Claude Code's native --remote-control flag.
#
# When per-task ``enableRemoteControl: true`` is set (or the project's
# ``remoteControlByDefault`` is on), the agent subprocess registers a
# session with Anthropic's API and the user can drive it from
# claude.ai/code or the Claude mobile app.  Anthropic's docs:
#   https://code.claude.com/docs/en/remote-control
#
# Auth: Remote Control rejects the inference-only OAuth token AIFactory
# uses by default; it requires the full-scope credentials in
# ~/.claude/.credentials.json (produced by ``claude auth login``).
# The agent_service scrubs CLAUDE_CODE_OAUTH_TOKEN from the spawned
# env when remote-control is enabled, so the subprocess falls through
# to ~/.claude/.credentials.json.  For K8s deployments, we mount that
# file from a Secret.
#
# Operator setup (one time, from a logged-in workstation):
#   kubectl create secret generic claude-remote-credentials \
#     --from-file=credentials.json=$HOME/.claude/.credentials.json \
#     -n aifactory
#
# Then set credentialsSecretName below to "claude-remote-credentials".
# Rotate by re-running ``claude auth login`` + ``kubectl create secret``
# with --dry-run + ``kubectl apply``.
#
# Constraints (from Anthropic's docs):
#   • Subscription: Pro / Max / Team / Enterprise (not API-key users)
#   • Provider: Anthropic API only — Bedrock/Vertex/Foundry not supported
#   • Concurrency: one Remote Control session per claude process
#     (already matches AIFactory's one-claude-per-task model)
remoteControl:
  # Master toggle.  When false (default), no Remote Control wiring is
  # added to the pod at all — behaviour is byte-for-byte unchanged.
  enabled: false
  # Name of a Kubernetes Secret with key ``credentials.json`` containing
  # the contents of ~/.claude/.credentials.json from a machine where
  # the operator has run ``claude auth login``.  Required when
  # ``enabled: true``.
  credentialsSecretName: ""
  # Where Claude Code looks for credentials inside the container.
  # The image runs as the ``nonroot`` user, so the default home is
  # /home/nonroot.  Don't change this unless you've also changed the
  # container's runAsUser / fsGroup.
  mountPath: "/home/nonroot/.claude/.credentials.json"

# ---------------------------------------------------------------------------
# MCP credentials — for the default-MCP-servers catalog (Epic #100).
#
# When enabled, mounts a single Kubernetes Secret with well-known keys at
# the standard paths each cloud CLI expects.  The MCP subprocess catalog
# (apps/backend/agents/tools_pkg/mcp_catalog.py) auto-detects credentials
# via these files / env vars — no extra wiring needed beyond populating
# the Secret.
#
# Toggle individual providers via ``mcpCredentials.providers.<name>: true``
# to mount only the keys you have populated.  Each provider is independent
# — you can mount AWS creds but not Azure, etc.
#
# Operator setup (one-time, from a logged-in workstation):
#
#   kubectl create secret generic aifactory-mcp-credentials \
#     --from-file=aws-credentials=$HOME/.aws/credentials \
#     --from-file=kubeconfig=$HOME/.kube/config \
#     --from-file=gcp-service-account.json=/path/to/sa.json \
#     --from-literal=github-token=ghp_xxxxx \
#     --from-literal=gitlab-token=glpat-xxxxx \
#     --from-literal=gitlab-instance-url=https://gitlab.example.com \
#     --from-literal=azure-devops-token=adopat_xxxxx \
#     --from-literal=azure-devops-org-url=https://dev.azure.com/myorg \
#     --from-literal=azure-tenant-id=xxxx \
#     --from-literal=azure-client-id=xxxx \
#     --from-literal=azure-client-secret=xxxx \
#     -n aifactory
#
# Cloud-native identity is PREFERRED over mounted creds where available:
#   • AWS: IRSA — annotate the ServiceAccount with eks.amazonaws.com/role-arn;
#     leave mcpCredentials.providers.aws=false.
#   • Azure: AKS Pod Identity / Managed Identity — set
#     ``AZURE_USE_MSI=true`` via env (extraEnv) and leave .providers.azure=false.
#   • GCP: Workload Identity Federation — annotate the SA with
#     iam.gke.io/gcp-service-account; leave .providers.gcp=false.
#
# Use the Secret-mount path below for bare-metal / on-prem K8s where
# cloud-native identity isn't available.
mcpCredentials:
  # Master toggle.  When false (default), no MCP credential wiring is
  # added to the pod — behaviour is byte-for-byte unchanged.
  enabled: false
  # Name of a Kubernetes Secret with the well-known keys listed above.
  # Required when ``enabled: true`` AND at least one provider is true.
  secretName: aifactory-mcp-credentials
  # Per-provider toggles.  Each one mounts ONLY the keys / env vars
  # that provider's MCP server needs — set to true only after you've
  # populated the corresponding Secret keys.
  providers:
    aws: false           # mounts ``aws-credentials`` -> ~/.aws/credentials (0400)
    azure: false         # injects AZURE_* env triplet from string keys
    gcp: false           # mounts ``gcp-service-account.json`` -> /etc/aifactory/gcp-sa.json (0400)
    kubernetes: false    # mounts ``kubeconfig`` -> ~/.kube/config (0400)
    github: false        # injects GITHUB_TOKEN env from ``github-token`` string key
    gitlab: false        # injects GITLAB_TOKEN + GITLAB_INSTANCE_URL env
    azureDevOps: false   # injects AZURE_DEVOPS_PERSONAL_ACCESS_TOKEN + AZURE_DEVOPS_ORG_SERVICE_URL env

# Redis pub/sub for cross-replica WebSocket fan-out (Epic #35 #40).
#
# Default OFF — single-replica deployments work unchanged with no
# Redis dependency. Multi-replica deployments MUST enable this so
# events fired on replica A reach WebSocket clients connected to
# replica B; without it, ``broadcast_event`` / ``send_to_user`` /
# ``send_to_org`` only reach clients on the originating replica.
#
# Behaviour when Redis is later unreachable at runtime: app keeps
# accepting requests, in-process delivery still works, ERROR log on
# every reconnect attempt with exponential backoff (1s → 30s). See
# docs/docs/concepts/multi-replica.md for the operator playbook.
#
# Auth: ``REDIS_URL`` may include the password inline
# (``redis://:password@host:6379/0``) or use Redis 6 ACL via the
# username field. For Sentinel / Cluster mode the URL form follows
# redis-py's conventions; see https://redis-py.readthedocs.io/.
#
# Terminal WebSocket streams (/ws/terminal/*) are intentionally NOT
# fan-out'd — they hold an rmux subprocess on one specific replica.
# Operators running ``replicas > 1`` add a sticky-cookie annotation
# at the ingress for /ws/terminal/* so each browser session pins to
# the replica that owns its terminal.
redis:
  # Master toggle. When false (default), no Redis wiring is added —
  # the app starts in in-process-only mode (REDIS_URL env unset).
  enabled: false
  # Inline URL — use ONLY in dev / test. Leaks the password into the
  # rendered manifest and into ``kubectl describe pod``. Production
  # deployments use ``externalSecretName`` instead.
  url: ""
  # Name of an existing Secret with a ``REDIS_URL`` key. The app reads
  # the URL from this Secret via valueFrom.secretKeyRef. Required when
  # ``enabled: true`` AND ``url`` is empty — helm template fails with
  # a clear message otherwise.
  externalSecretName: ""
  # Pub/sub channel name. Override only when running multiple
  # AIFactory deployments against a single shared Redis (then each
  # deployment should pick a unique channel to avoid cross-talk).
  channel: "aifactory:events"

# ---------------------------------------------------------------------------
# OpenTelemetry distributed tracing (Epic #35 #42).
#
# When enabled, the web-server emits OTLP spans for HTTP requests,
# DB calls (SQLAlchemy / asyncpg), outbound httpx, redis ops, and
# the agent-task phase transitions. The agent subprocess inherits
# the parent's trace context via the ``TRACEPARENT`` env var (the
# web-server injects it automatically — see make_subprocess_env).
#
# When ``otel.enabled: false`` (default) the app starts an OTel
# TracerProvider with NO exporter — spans build in memory and drop
# at export. Zero observable cost; safe to keep off in single-replica
# dev. Toggle on once a collector is reachable.
#
# Collector targets we test against:
#   • Grafana Tempo (gRPC on :4317 or HTTP on :4318)
#   • Jaeger (OTLP-native ingest on :4317 / :4318)
#   • Datadog Agent (OTLP receiver, requires DD_API_KEY in headers)
#   • Honeycomb / NewRelic (HTTPS endpoint + headers secret)
#
# Sampling: ``ParentBased`` (children inherit parent's decision) wrapped
# around ``TraceIdRatioBased(samplingRatio)``. Default 1.0 (sample
# everything). Drop to 0.1 when traffic is high; 0.0 is accepted and
# means "drop all spans" (useful for proving the no-export code path).
#
# Headers Secret: production deployments use an external Secret with
# the ``OTEL_EXPORTER_OTLP_HEADERS`` key (e.g.
# ``api-key=xxxx,team=infra``). The pod consumes the value via
# valueFrom.secretKeyRef. The required-validator below blocks helm
# template when ``headersSecretName`` is set but ``enabled`` isn't
# (operator misconfiguration that would silently no-op).
otel:
  # Master toggle. When false (default), no exporter is installed
  # and OTEL_EXPORTER_OTLP_ENDPOINT stays unset — the app respects
  # the absence as "no collector" and skips the OTLP exporter.
  enabled: false
  # OTLP collector endpoint. REQUIRED when ``enabled: true``.
  # Examples:
  #   http://tempo.observability.svc:4317  (in-cluster Tempo, gRPC)
  #   https://api.honeycomb.io:443         (Honeycomb, HTTP)
  endpoint: ""
  # Wire protocol. gRPC is more efficient (binary, multiplexed,
  # streaming) but http/protobuf works behind proxies that only
  # speak HTTP/1.1. Pick to match your collector's ingress.
  protocol: "grpc"  # grpc | http/protobuf
  # Resource attribute attached to every span. Lets a multi-tenant
  # Tempo distinguish AIFactory from neighbour workloads. Change
  # only when running multiple AIFactory deployments against one
  # backend (e.g. ``aifactory-staging`` vs ``aifactory-prod``).
  serviceName: "aifactory-web"
  # Sampling ratio in [0.0, 1.0]. ParentBased(TraceIdRatioBased(x)):
  # children always inherit the parent's decision; root spans get
  # kept with probability x. 1.0 = sample all (good for staging);
  # 0.1 = 10% in production. 0.0 is valid — accepts no spans at the
  # export stage (still constructs them, still flows through
  # propagation), useful for the no-export acceptance test.
  samplingRatio: 1.0
  # Optional Kubernetes Secret with the ``OTEL_EXPORTER_OTLP_HEADERS``
  # key. Used for vendor-auth (Honeycomb / Datadog / NewRelic API
  # keys) or for tenant routing. Setting this without ``enabled: true``
  # is rejected at helm template time — see validator note above.
  headersSecretName: ""

# ---------------------------------------------------------------------------
# Signed audit-chain anchor (Epic #35 #43).
#
# The v1.0 audit chain (Epic #26 P5) hashes every row to its
# predecessor — detects insertion/deletion/mutation by an attacker
# without DB access, but does NOT detect a DB admin who re-computes
# the entire chain from any point forward.
#
# #43 closes that gap by signing the chain head daily with an
# HMAC-SHA256 key wrapped by the existing KMS backend
# (``crypto/kms/``). External verifiers receive both rows AND the
# daily anchors in the audit export, and can prove untamperedness
# by re-computing the chain + verifying the HMAC.
#
# Cadence: 00:00 UTC daily. Kubernetes CronJob below; the in-process
# scheduler (lifespan-managed asyncio) is an alternative the operator
# can run by setting ``audit.anchor.scheduler: in-process`` — useful
# for single-pod deployments where a separate CronJob feels heavy.
#
# Failure-safe: every code path in the cron + signer wraps in
# try/except. A broken KMS or DB never crashes the lifespan; the
# next tick retries.
audit:
  anchor:
    # Master toggle. When false (default), no anchors are emitted —
    # audit chain operates as v1.0. Signing keys also remain
    # un-bootstrapped, so existing deployments are byte-for-byte
    # unchanged until the operator opts in.
    enabled: false
    # How the daily 00:00 UTC tick is invoked:
    #   "cronjob"    — Kubernetes CronJob (recommended for production
    #                  + multi-replica; uses the same image + env as
    #                  the web pod)
    #   "in-process" — asyncio task managed by the web-server's
    #                  lifespan (single-replica only; the task can
    #                  fire on whichever replica wins startup)
    scheduler: "cronjob"  # cronjob | in-process
    # Cron schedule for the Kubernetes CronJob (only honoured when
    # scheduler=cronjob). Default = 00:00 UTC daily. Operators with
    # multiple AIFactory deployments writing to the same audit log
    # MUST stagger schedules to avoid colliding on the UTC-day
    # unique constraint.
    cron:
      schedule: "0 0 * * *"   # daily at 00:00 UTC
      # Active-deadline + back-off — what to do if the cron pod gets
      # stuck or fails repeatedly. Generous defaults so a slow
      # large-tenant signing pass doesn't get killed.
      activeDeadlineSeconds: 300
      backoffLimit: 3
      # Failed jobs to keep around in the Kubernetes API for ops
      # forensics. Successful jobs are pruned to 1 (just the most
      # recent).
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 3

# ---------------------------------------------------------------------------
# LiteLLM gateway (Epic #35 #38 PR-3).
#
# Optional sub-chart from upstream berriai/litellm-helm. When enabled,
# a single in-cluster LiteLLM Service mediates every OpenAI-compatible
# LLM call AIFactory makes (OpenAI, Codex CLI, Gemini, Ollama,
# Bedrock, Vertex). Claude calls stay direct via the Claude Agent SDK
# because the SDK speaks Anthropic-format `/v1/messages` which is
# wire-incompatible with LiteLLM's OpenAI-format `/v1/chat/completions`
# — closing that gap is a v1.2 work item.
#
# What LiteLLM gives operators:
#   • Per-tenant token budget                ($500/month per org)
#   • Per-tenant rate limit                  (60 req/min per org)
#   • Per-tenant model allowlist             (gpt-4o yes, gpt-5 no)
#   • Audit hook (PII-redacted prompt + response in audit_logs)
#   • Prometheus metrics → Grafana dashboards (dashboards/litellm.json)
#
# Default OFF — single-developer pilots and laptop installs run with
# the existing direct-provider path. Pre-#38 deployments are
# byte-for-byte unchanged until the operator flips
# ``litellm.enabled: true``. See the concept doc at
# docs/docs/concepts/litellm-gateway.md for the full operator
# walkthrough — failure modes, master-key rotation, allowlist
# discipline, virtual-key lifecycle, and dashboard import recipe.
#
# Multi-tenant operators MUST also configure the audit + redactor
# block below. The audit.failureMode setting decides what happens
# when the audit-write path fails — closed (reject the call) is the
# compliance-safe default; open (let the call through with a logged
# warning) is the operator escape hatch for during-incident triage.
litellm:
  # Master toggle. False (default) means no sub-chart pulled, no
  # LITELLM_* env vars on the web pod, no Grafana ConfigMap rendered.
  enabled: false

  # Name of a Kubernetes Secret containing the KMS-wrapped master
  # key (design §3). REQUIRED when enabled=true. The Secret must
  # have a key named ``LITELLM_MASTER_KEY`` whose value is the
  # KMS-wrapped key (NOT plaintext — the reconciler unwraps via the
  # configured KMS backend before calling LiteLLM admin APIs).
  #
  # Anti-pattern (forbidden): putting the plaintext master key in
  # the generic ``aifactory-config`` Secret. The startup validator
  # refuses to call admin APIs without a successful KMS unwrap.
  # Rotation runbook: same cadence as the audit-anchor signing key
  # documented in #43 — see concept doc.
  masterKeySecretName: ""

  # When set, this overrides the in-cluster Service URL. Use for
  # operator-managed external LiteLLM deployments (e.g. a shared
  # gateway running in a neighbour namespace, or a multi-deployment
  # gateway-as-a-service). Leave empty to use the in-cluster
  # sub-chart Service.
  gatewayUrl: ""

  # AIFactory-specific audit + PII redaction options. These are
  # AIFactory's, NOT the upstream chart's — wired into the audit
  # hook the web pod runs against every LLM response.
  audit:
    # Master toggle for AIFactory's audit hook. When true, the
    # provider classes wrap each LLM response in an audit_logs
    # writer with classification='confidential' (design §5).
    # When litellm.enabled=true, default this to true for
    # SOC2/ISO compliance. Operators can opt out only for the
    # short, well-bounded reasons documented in the concept doc.
    enabled: true

    # Opt-in encrypted full-text capture of prompt + response.
    # OFF by default: the audit row stores the first 4KB only
    # (design §5). Operators with strict full-prompt retention
    # mandates flip this to true; the bytes go through the
    # EncryptedString column type from Epic #26 P2.
    fullTextCapture: false

    # Operator extensions to the built-in PII redaction patterns
    # (design §4). Built-in patterns cover US SSN, email, US phone
    # in the hyphenated forms; CC pattern is INTENTIONALLY OMITTED
    # in v1.1 due to false-positive rate (Luhn-validated CC pattern
    # ships in v1.2). Operators with PCI data add their own here:
    #
    #   extraRedactionPatterns:
    #     - pattern: 'ACC-\d{8}'
    #       replacement: '[REDACTED_ACCT]'
    #     - pattern: '\b4\d{15}\b'          # Visa, no spaces (Luhn-check yourself)
    #       replacement: '[REDACTED_CC]'
    #
    # Patterns are Python `re` syntax. Compile failures log
    # WARNING + skip the bad pattern (fail-safe; one bad regex
    # doesn't disable all redaction).
    extraRedactionPatterns: []

    # What to do when the audit-write path fails (KMS down,
    # DB unreachable, PII regex compile error, etc):
    #   "closed" — reject the LLM call with a clear operator-
    #              visible error. Compliance-safe default; the
    #              whole point of the gateway is the audit
    #              evidence, so bypassing on failure defeats
    #              the purpose.
    #   "open"   — let the call through with a logged WARNING.
    #              Operator escape hatch for during-incident
    #              triage (e.g. KMS outage where you'd rather
    #              continue serving than block all LLM traffic).
    #              Documented as a compliance regression; the
    #              concept doc walks through the trade-off.
    failureMode: "closed"

  # ---------------------------------------------------------------
  # Upstream berriai/litellm-helm chart values pass through here.
  # See https://github.com/BerriAI/litellm/tree/main/deploy/charts/litellm-helm
  # for the full list. Operators configure backend providers (OpenAI,
  # Bedrock, Vertex, Ollama), per-tenant accounting, and pod resource
  # limits via the standard upstream value paths under this same
  # ``litellm:`` block (Helm sub-chart values are nested under the
  # parent chart's dependency name / alias).
  #
  # Example (operator override in their own values.yaml):
  #
  #   litellm:
  #     enabled: true
  #     masterKeySecretName: "aifactory-litellm-master-key"
  #     proxy_config:
  #       model_list:
  #         - model_name: gpt-4o-mini
  #           litellm_params:
  #             model: openai/gpt-4o-mini
  #             api_key: os.environ/OPENAI_API_KEY
  #         - model_name: bedrock/anthropic.claude-sonnet-4-20250514-v1:0
  #           litellm_params:
  #             model: bedrock/anthropic.claude-sonnet-4-20250514-v1:0
  #             aws_region_name: us-east-1
  #     environmentSecrets:
  #       - aifactory-llm-backend-keys

# ---------------------------------------------------------------------------
# Monitoring add-ons that wrap Grafana dashboards and other observability
# resources. Each toggle is independent — operators can ship the Grafana
# ConfigMaps without the Prometheus ServiceMonitor and vice versa.
monitoring:
  grafanaDashboards:
    # When true, the LiteLLM Grafana dashboard JSON in
    # dashboards/litellm.json is wrapped in a ConfigMap with the
    # ``grafana_dashboard: "1"`` label that the Grafana operator
    # auto-discovers and imports. When false (default), no ConfigMap
    # is rendered — operators using a non-operator Grafana install
    # import the JSON manually via the Grafana UI.
    enabled: false
    # Namespace label that scopes the dashboard discovery. Override
    # only when running multiple Grafana operators on one cluster.
    namespaceLabel: "monitoring"
    # Folder name in Grafana. Operators with multiple AIFactory
    # deployments override per-env (e.g. "AIFactory (staging)").
    folder: "AIFactory"

# ---------------------------------------------------------------------------
# Tenant Isolation Mode (Epic #35 #36).
#
# When enabled, every Organization gets its own Kubernetes namespace,
# ServiceAccount, NetworkPolicy (default-deny + explicit egress allow-
# list), ResourceQuota, LimitRange, S3 prefix + IAM role (AWS) or
# operator-supplied per-tenant credentials (other clouds), and Vault
# path. Agent pods spawn into the tenant's namespace and inherit the
# isolation by construction.
#
# Default: OFF. Pre-#36 deployments are byte-for-byte unchanged until
# the operator flips ``tenant.isolationEnabled=true``. See the concept
# doc at docs/docs/concepts/tenant-isolation.md for the full operator
# walkthrough — threat model, prerequisites, tear-down lifecycle,
# OPA Gatekeeper recommendation, failure modes.
#
# Prerequisites (operator MUST satisfy BEFORE enabling):
#   1. CNI plugin with FQDN-policy support — Calico (FQDN beta) OR
#      Cilium (CiliumNetworkPolicy CRD). The Helm pre-install hook
#      below (pre-install-cni-probe.yaml) probes for these CRDs and
#      fails the install loudly if neither is present.
#   2. Redis enabled (``redis.enabled=true``) — multi-replica
#      deployments need the reconciler's distributed mutex. Single-
#      replica deployments may run without Redis but the reconciler
#      refuses to write if Redis is unavailable mid-tick.
#   3. Vault `aifactory-reconciler` AppRole pre-created with the
#      minimum-needed sys/policies/acl/aifactory-tenant-* +
#      auth/kubernetes/role/aifactory-tenant-* capabilities (see
#      concept doc §5 — never use a root token).
#   4. (AWS only) IRSA enabled on the cluster so per-tenant IAM roles
#      can be assumed by per-tenant ServiceAccounts.
#
# Security caveat (honest acknowledgement, design §1):
#   The web pod's ClusterRole grants cluster-wide create on Namespace
#   + RoleBinding so the reconciler can provision tenant namespaces
#   at run time. This is a privilege concentration: a compromised web
#   pod can create arbitrary namespaces + bindings. Production
#   deployments SHOULD enable both:
#     - sandbox.gvisor.enabled=true   (syscall-level isolation)
#     - tenant.gatekeeperEnabled=true (OPA samples that deny non-
#                                      aifactory-tenant-* namespaces)
#   See the tenant-reconciler-rbac.yaml template comment for the full
#   threat-model link.
tenant:
  # Master toggle. When false (default), the reconciler does NOT run;
  # all orgs map to the deployment-default namespace (legacy v1.0
  # behaviour). Setting true requires the prerequisites above; the
  # pre-install hook hard-fails if the CNI probe doesn't find Calico
  # or Cilium CRDs.
  isolationEnabled: false

  # Days between Organization soft-delete (Stage 1 — PII scrubbed
  # immediately per GDPR Art. 17) and infrastructure tear-down
  # (Stage 2 — namespace + S3 prefix + Vault path deleted). 30 days
  # is the recommended default — long enough for mistaken-delete
  # recovery + legal-hold negotiation, short enough that abandoned
  # tenants don't accumulate quota. Day 0 is allowed but produces a
  # WARNING log on every reconcile pass reminding the operator of
  # the recovery-window loss.
  deletionGraceDays: 30

  # Prefix for the per-tenant K8s namespace name. The reconciler
  # computes ``<namespacePrefix>-<org.slug>`` once on first reconcile
  # under isolation; the result is stored in
  # ``organizations.tenant_namespace`` and locked for the org's
  # lifetime (slug renames do NOT change the namespace name). Override
  # only if your cluster has a naming convention that conflicts with
  # the default — must satisfy ^[a-z][a-z0-9-]{0,40}[a-z0-9]$ so the
  # final namespace stays under the 63-char DNS label limit.
  namespacePrefix: "aifactory-tenant"

  networkPolicy:
    # CNI backend hint for FQDN-policy emission. The reconciler emits
    # either ``CiliumNetworkPolicy`` (Cilium) or a Calico
    # ``GlobalNetworkPolicy`` (Calico) depending on this value:
    #   auto    — detect at reconcile time (probes both CRDs)
    #   calico  — emit Calico CRDs only
    #   cilium  — emit Cilium CRDs only
    # The pre-install hook validates BEFORE chart install that the
    # selected backend's CRDs are present; ``auto`` accepts either.
    cniBackend: "auto"

  limitRange:
    # Per-pod CPU/memory defaults injected into each tenant namespace's
    # LimitRange. Prevents noisy-neighbour between tenants: a tenant
    # spawning an unbounded agent pod can't starve other tenants.
    # Operators with high-performance workloads (large-context coding
    # tasks) may need to raise these; the LimitRange is a DEFAULT, not
    # a hard cap (the ResourceQuota below sets the hard cap).
    defaultCpu: "500m"
    defaultMemory: "512Mi"

  resourceQuota:
    # Hard cap on resource creation per tenant namespace. Prevents
    # one tenant's runaway from exhausting cluster quota. Tune to
    # match your largest expected tenant's footprint — exceeded quota
    # blocks new pod / PVC creation with a clear K8s error that the
    # frontend surfaces.
    maxPods: 50
    maxPvcs: 20

  # Opt-in OPA Gatekeeper constraint samples. When true, ships two
  # ConstraintTemplates + Constraints that defence-in-depth the
  # privilege-concentration acknowledged in the security caveat above:
  #   1. namespace-prefix — denies any Namespace create whose name
  #      doesn't start with ``<namespacePrefix>-``. A compromised web
  #      pod cannot create arbitrary namespaces.
  #   2. rolebinding-tenant-scope — denies any RoleBinding that
  #      references the web pod's ServiceAccount in a non-tenant
  #      namespace.
  # Requires the Gatekeeper CRDs (templates.gatekeeper.sh) to already
  # be installed on the cluster. The chart does NOT install Gatekeeper
  # itself — operators install it once cluster-wide. False (default)
  # ships nothing; the operator who has not adopted Gatekeeper sees
  # no behaviour change.
  gatekeeperEnabled: false

  teardown:
    # Cron schedule for the daily Stage-2 tear-down sweep. The cron
    # pod scans for orgs with deleted_at older than
    # ``tenant.deletionGraceDays`` and tears down their resources via
    # the reconciler's ``tear_down_org()`` path. Default = 03:00 UTC
    # (low traffic window for most operators). Operators with multiple
    # AIFactory deployments writing into a shared cluster MUST stagger
    # schedules to avoid colliding on the same tear-down window.
    cronSchedule: "0 3 * * *"

    # Hours the reconciler logs intended deletions BEFORE actually
    # running them. Per design §4a, a 24-hour dry-run pass gives the
    # operator a window to intervene if a tear-down was triggered in
    # error. Setting 0 disables the dry-run pass (deletions execute
    # immediately at the next cron tick); setting >24 extends it.
    dryRunHours: 24

# Cross-cutting platform-team settings.
global:
  # When set, mounts a corporate root-CA bundle into the pod and
  # points SSL_CERT_FILE at it. Required when egress passes through
  # a TLS-intercepting proxy.
  customCABundle:
    secretName: ""  # e.g. "corp-root-ca"
    key: "ca-bundle.crt"
  # Image pull secrets shared across all pods (avoids per-template
  # repetition).
  imagePullSecrets: []
