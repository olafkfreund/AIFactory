# Base-image updates for the root Dockerfile (Factory#436).
#
# Rewritten lean on 2026-07-31 as a #1104 diagnostic. The previous version was
# functionally identical to PFactory's and TFactory's -- same ecosystem, same
# directory, same target-branch, same schedule -- and those two raise a docker PR
# within a minute of the config landing, while this repo has never raised one at
# all. Dependabot is not dormant here: it raises npm PRs against /docs. Only the
# docker lane is silent, and the per-job log that would explain it is behind the
# Insights UI, not the REST API.
#
# So this rewrite changes the two things left that a config can change: the file
# content (which re-triggers evaluation) and the 30-line comment header the old
# file carried. Neither should matter. Trying it is the point -- and if a docker
# PR appears within the hour, the cause was one of those two and worth knowing.
#
# Nothing else moved. Routine version updates stay off (#34, one weekly
# all-ecosystem run opened 9 PRs at once); docker-only is deliberate, because
# that is the lane that broke and a narrow config is one that does not get
# switched off again for noise. Daily rather than weekly because a digest pin
# rots in one direction only.
#
# target-branch is pinned rather than inherited (Factory#491): without it,
# Dependabot raises against whatever the repo default happens to be, and a
# default-branch flip splits bumps across both branches.
#
# Known gap, unchanged: Dependabot's Dockerfile parser only reads FROM. The
# `COPY --from=ghcr.io/olafkfreund/tfactory-runner-nix:...` pins are invisible to
# it and stay hand-managed. Risk is low -- that registry is ours, so upstream
# garbage collection is not a threat -- but it is uncovered, not covered.
#
# WHILE THE DOCKER LANE IS DEAD, .github/workflows/base-image-pin-liveness.yml
# does this job instead: it checks the pins daily and opens its own PR (#1104).
# If Dependabot ever starts working here, delete that workflow's pins-bump job
# rather than let two bots rewrite the same FROM lines.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    target-branch: dev
    schedule:
      interval: daily
    labels:
      - dependencies
      - docker
      - base-image
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    # A Node MAJOR is an LTS decision, not a dependency bump, and Dependabot
    # cannot tell an LTS line from a Current one. It raised #1166 to move this
    # image from node:24 to node:25 -- an odd-numbered line that never becomes
    # LTS and had ALREADY reached end of life on 2026-06-01, per
    # nodejs/Release/schedule.json:
    #
    #   v24  start 2025-05-06  LTS 2025-10-28  EOL 2028-04-30
    #   v25  start 2025-10-15  (Current only)  EOL 2026-06-01
    #   v26  start 2026-05-05  LTS 2026-10-28  EOL 2029-04-30
    #
    # So the "upgrade" was a move onto an unsupported runtime, and it would have
    # left this the only repo in the fleet on one (PFactory/TFactory/CFactory
    # build on 26, this repo on 24 -- all supported).
    #
    # Digest and minor bumps stay on: those are the ones that rot in only one
    # direction. Majors are chosen deliberately against the release schedule.
    # v24 -> v26 is the next move here, when this repo is ready for it.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # github-actions. Added alongside the SHA pinning in Factory#711.
  #
  # Why it is not optional: the two third-party action refs in .github/workflows/
  # are now pinned to a 40-character commit SHA. That closes the mutable-tag
  # supply-chain path, and it also freezes the action at that commit forever --
  # an upstream SECURITY fix no longer arrives by moving tag. Without this
  # updater the pins silently rot, which is a worse position than the tags were
  # in. Dependabot reads the `# vX.Y.Z` trailing comment on each pin and keeps
  # both the SHA and the comment current, which is why the pins carry that format.
  #
  # Weekly, not daily: an action pin does not rot in one direction the way a base
  # image digest does, and the docker lane above already carries the daily cost.
  #
  # Grouped into ONE pull request, so this lane cannot reintroduce the
  # nine-PRs-in-one-run noise that got routine updates switched off here (#34).
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
