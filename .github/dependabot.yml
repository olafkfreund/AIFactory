# Base-image updates for the root Dockerfile. This file is now the only thing in
# the repo that bumps a base image (Factory#436).
#
# How the gap happened. Routine version updates were switched off deliberately on
# 2026-05-20 in #34 ("Dependabot security-only mode") because one weekly
# all-ecosystem run opened 9 PRs at once. renovate.json arrived six days later on
# 2026-05-26 and read as the replacement -- pinDigests, a dockerfile manager, a
# digest rule labelled base-image. It never ran: the Renovate GitHub App is not
# installed on this account, so across all five Factory repos there are zero
# Renovate PRs and no Dependency Dashboard issue despite ":dependencyDashboard"
# being set. For nine weeks nothing watched the base images at all. The frontend
# stage's digest went stale, upstream garbage-collected it, and "docker (P0
# acceptance)" could no longer start a build (#1091).
#
# Docker-only on purpose. That is the lane that actually broke, and a narrow
# config is one that does not get switched off again for noise the way #34 was.
#
# Daily, not weekly. A digest pin rots in one direction only, and the gate is
# hard-down for the whole window between upstream moving and the bump landing.
#
# Verified 2026-07-30 with dependabot-cli v1.91.0 against this repo: the docker
# updater reads `tag@sha256:` pins and proposed
#   chainguard/python latest-dev  7a568bc -> 534fb1a
# rewriting the FROM line. That is the same shape of pin that failed in #1091,
# on the same tag class, so this config covers the real case and not just the
# tidy one.
#
# Known gap from that same run: Dependabot's Dockerfile parser only reads FROM.
# The `COPY --from=ghcr.io/olafkfreund/tfactory-runner-nix:latest@sha256:...`
# pins near line 310 are invisible to it and remain hand-managed. Risk is low --
# that registry is ours, so upstream garbage collection is not a threat -- but it
# is genuinely uncovered, not covered. Renovate's dockerfile manager does read
# COPY --from; if the App is ever installed, delete this file rather than let two
# bots rewrite the same FROM lines.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    # Factory#491: without this, Dependabot raises against whatever the repo
    # default happens to be, and the default-branch flip to `dev` therefore split
    # bumps across both branches — base-image changes reaching the deployed
    # branch without passing through `dev`, and `main` ending up ahead of `dev`
    # in every service repo. Pin it rather than inherit it.
    target-branch: dev
    schedule:
      interval: daily
    labels:
      - dependencies
      - docker
      - base-image
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
