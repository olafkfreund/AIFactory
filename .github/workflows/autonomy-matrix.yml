name: autonomy matrix

# Factory#1962. The published autonomy matrix is GENERATED from the merge
# policy by scripts/gen_autonomy_matrix.py, never transcribed. This gate fails
# when the committed outputs (docs/docs/compliance/autonomy-matrix.md and
# docs/static/compliance/autonomy-matrix.json) no longer match what the code
# produces, so the page cannot drift from the policy it describes. The
# committed output is either in sync with the inputs or it is not, so this is
# a hard gate from day one.

# NO `paths:` FILTER, DELIBERATELY (Factory#489, Factory#1962)
# ------------------------------------------------------------
# The matrix is derived from merge_policy, review_tier and pr_endgame, and
# from an import closure that reaches several hundred modules. Any hand-kept
# paths allowlist for that closure would rot silently, in exactly the way the
# hub's contracts.yml allowlist did: a file added to the closure is added to
# the list by nothing, and nothing reports the omission. The prober would then
# be "wired but never triggered" for the very change that matters. So the
# check runs on every PR and every push to dev/main.
#
# Cost of running it unconditionally: one short job (the venv install is the
# bulk of it).
on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: autonomy-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_HTTP_TIMEOUT: "120"

jobs:
  autonomy-matrix:
    name: autonomy matrix matches the policy (--check, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"

      - name: Create venv + install deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt

      - name: Generated matrix is up to date
        run: apps/backend/.venv/bin/python scripts/gen_autonomy_matrix.py --check
