name: TechDocs

# Keep Backstage TechDocs self-documenting: regenerate the OpenAPI spec + the
# dependencies page, validate that the TechDocs site builds, and fail if the
# committed artifacts have drifted from the code that generates them.
#
# Backstage itself builds + serves TechDocs on view (builder: local) from
# mkdocs.yml on the default branch — this workflow only keeps the generated
# inputs honest and catches a broken docs build before it reaches Backstage.
#
# Why this checks instead of committing (#906): it used to regenerate and
# `git push origin dev`. `dev` is a protected branch (required check:
# "backend (ruff + pytest)"), so the bot's push was rejected with GH006 every
# time the docs actually drifted — the one case it existed for. Opening a PR
# instead does not help: a PR opened with GITHUB_TOKEN does not trigger
# workflows, so the required check would never report and the PR could never
# merge. There is no bot PAT for this repo. So the generated artifacts are
# committed by the author of the change that drifts them, and this workflow's
# job is to say so — on the pull request, before it merges.

# NOTE: the two `paths:` lists are duplicated on purpose — GitHub Actions does
# not support YAML anchors/aliases in workflow files. Keep them in sync.
on:
  pull_request:
    paths:
      - "apps/backend/requirements.txt"
      - "apps/web-server/requirements.txt"
      - "apps/frontend-web/package.json"
      - "apps/web-server/server/**"
      - "apps/web-server/openapi.yaml"
      - ".github/workflows/techdocs.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "catalog-info.yaml"
      - "scripts/generate-techdocs-deps.py"
      - "scripts/generate-openapi-spec.py"
  push:
    branches: [dev]
    paths:
      - "apps/backend/requirements.txt"
      - "apps/web-server/requirements.txt"
      - "apps/frontend-web/package.json"
      - "apps/web-server/server/**"
      - "apps/web-server/openapi.yaml"
      - ".github/workflows/techdocs.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "catalog-info.yaml"
      - "scripts/generate-techdocs-deps.py"
      - "scripts/generate-openapi-spec.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: techdocs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #1588: the gate below is red BY CONSTRUCTION for a Dependabot PR that bumps
  # a frontend dependency. generate-techdocs-deps.py reads versions out of
  # apps/frontend-web/package.json, so the bump makes the committed
  # docs/dependencies.md stale -- and Dependabot cannot run a generator. Two
  # such PRs (#1536, #1531) went green only because a human pushed a
  # regeneration commit onto each. A gate that is guaranteed red for a whole
  # class of PR teaches everyone to ignore it.
  #
  # So regenerate it here and push it back. Two deliberate limits:
  #   * the generator is taken from the BASE branch, not the PR. This job holds
  #     a writable token, so the code it runs must be trusted -- not "Dependabot
  #     only edits manifests", which is a habit, not a guarantee.
  #   * ONLY docs/dependencies.md is committed. openapi.yaml is the API
  #     contract, a bump cannot make it stale, and regenerating it needs the app
  #     imported; its drift stays a human decision (#1569).
  regenerate-for-bot:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Regenerate the dependencies page with the BASE branch's generator
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "${BASE_REF}"
          # The script that runs with a writable token comes from the base
          # branch, never from the PR (see the job comment).
          git checkout "origin/${BASE_REF}" -- scripts/generate-techdocs-deps.py
          python3 scripts/generate-techdocs-deps.py
          # Restore it before anything is staged, so it can never be committed.
          git checkout -- scripts/generate-techdocs-deps.py

      - name: Commit + push the regenerated page
        env:
          GH_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/dependencies.md; then
            echo "dependencies.md already matches the manifests; nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ONLY this file: the API spec is never written back from a PR branch.
          git add docs/dependencies.md
          git commit -m "docs(techdocs): regenerate dependencies.md (#1588)

          Generated by techdocs.yml for a Dependabot bump; Dependabot cannot run
          the generator, so the drift gate would otherwise be red on arrival."
          # A push that cannot land must be loud: a silent skip here puts the PR
          # back in the state this job exists to prevent.
          if ! git push origin "HEAD:${GH_REF}"; then
            echo "::error::could not push the regenerated dependencies.md to ${GH_REF}."
            exit 1
          fi

  refresh-and-validate:
    # always(): regenerate-for-bot is SKIPPED on every human PR, and a skipped
    # dependency would skip this gate with it -- a gate that vanishes for humans
    # is worse than the bug above (#1588).
    needs: regenerate-for-bot
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # 1. Dependencies page — cheap, no app import.
      - name: Regenerate dependencies page
        run: python3 scripts/generate-techdocs-deps.py

      # 2. OpenAPI spec. This needs BOTH requirement sets, not just the
      #    web-server's (#906): server/routes/execution.py imports apps/backend's
      #    `qa` package, which imports claude_agent_sdk — declared only in
      #    apps/backend/requirements.txt. Installing web-server reqs alone made
      #    `from server.main import app` raise ModuleNotFoundError on every run
      #    since 3.4.2, and `continue-on-error: true` hid it: the job stayed
      #    green while the published spec rotted 20+ releases behind. No
      #    continue-on-error here — a spec we cannot generate is a real failure.
      - name: Regenerate OpenAPI spec
        run: |
          python3 -m venv /tmp/ws
          /tmp/ws/bin/pip install --quiet -r apps/web-server/requirements.txt
          /tmp/ws/bin/pip install --quiet -r apps/backend/requirements.txt
          APP_DISABLE_AUTH=true /tmp/ws/bin/python scripts/generate-openapi-spec.py

      # 3. Validate the TechDocs build (the same thing Backstage runs on view).
      - name: Validate TechDocs build
        run: |
          python3 -m pip install --quiet mkdocs-techdocs-core
          python3 -m mkdocs build -f mkdocs.yml -d /tmp/techdocs-site
          test -f /tmp/techdocs-site/index.html

      # 4. Fail loudly if the committed artifacts drifted from what steps 1-2
      #    just generated. The fix is a one-liner a human runs and commits.
      - name: Check generated docs are committed
        run: |
          if git diff --quiet -- docs/dependencies.md apps/web-server/openapi.yaml; then
            echo "TechDocs inputs are up to date."
            exit 0
          fi
          echo "::error::Generated TechDocs artifacts are stale. Regenerate and commit them."
          echo
          echo "The following generated files differ from what the current code produces:"
          git diff --stat -- docs/dependencies.md apps/web-server/openapi.yaml
          echo
          echo "To fix, run from the repo root and commit the result:"
          echo
          echo "  python3 scripts/generate-techdocs-deps.py"
          echo "  python3 -m venv /tmp/ws"
          echo "  /tmp/ws/bin/pip install -r apps/web-server/requirements.txt"
          echo "  /tmp/ws/bin/pip install -r apps/backend/requirements.txt"
          echo "  APP_DISABLE_AUTH=true /tmp/ws/bin/python scripts/generate-openapi-spec.py"
          echo
          git diff -- docs/dependencies.md apps/web-server/openapi.yaml
          exit 1
