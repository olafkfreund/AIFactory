name: verification-core drift gate

# Blocking drift gate for the vendored verification-core layer (Factory#158,
# epic Factory#154).
#
# AIFactory hand-vendors several modules from the Factory hub's canonical
# verification-core surface (scripts/):
#   apps/backend/core/factory_sandbox.py   (unprivileged-sandbox helper)
#   apps/backend/core/nix_provisioner.py   (RFC-0005 per-task Nix env)
#   apps/backend/core/artifact_store.py    (RFC-0016 packed workspaces)
#   apps/backend/core/cost_router_core.py  (RFC-0014 cost routing)
#   apps/backend/core/job_dispatch.py      (RFC-0016 Job-per-task manifests)
#   scripts/ratchet_helpers.py             (shared lint ratchet)
# The authoritative list is the hub's SERVICE_LAYOUTS; this one is a reader's aid.
#
# These copies MUST stay byte-identical to the hub canonical. This job checks out
# the hub at a PINNED SHA and runs the hub's own drift gate
# (scripts/check_verification_core_drift.py) against this checkout. A byte
# mismatch fails the build.
#
# To intentionally change a vendored module: land the change in the hub canonical
# first (CODEOWNERS-reviewed), re-vendor it here byte-for-byte, and bump
# HUB_PIN_SHA below. Never edit a vendored copy to satisfy a local style bar —
# the copies are governed by this byte-exact gate, not the repo style config
# (they are excluded from ruff format/lint in ruff.toml for the same reason).

on:
  pull_request:
    branches: [dev, main, "feat/**", "release/**"]
    # NO paths: FILTER, deliberately (Factory#525). This used to list the
    # vendored copies, which was correct while the gate only compared bytes --
    # it had nothing to say unless one of those paths changed, and Factory#400
    # is the story of that list being incomplete.
    #
    # The stray-copy guard (Factory#523) inverted the requirement. It exists to
    # catch a vendored module appearing at a path NOBODY HAS LISTED: a fresh
    # copy, or one left behind when a mapping was removed. Such a PR touches
    # none of the listed paths by definition, so the filter switched the gate
    # off in exactly the case the guard was written for, and the unmapped copy
    # landed on the default branch unseen.
    #
    # The list was also a second, hand-maintained copy of the hub's
    # SERVICE_LAYOUTS living in a workflow file -- the fork-with-a-citation
    # shape Factory#483 exists to undo. Its history here is a changelog of
    # being patched one module at a time, always after the fact.
    #
    # The gate is a few seconds of Python against a checkout. Running it on
    # every PR costs almost nothing and removes a whole class of "the check did
    # not run" -- which on a green PR page is indistinguishable from "the check
    # passed" (Factory#471).
  push:
    branches: [dev, main]

concurrency:
  group: vcore-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned Factory hub commit carrying the canonical verification-core modules.
  # Bump deliberately when re-vendoring (see header).
  #
  # Bumped for Factory#477 (job_dispatch.py). The pin MUST move in the same PR as
  # the re-vendor and BEFORE the hub registers the module in its gate — the hub's
  # CHECKER is fetched from main while the CANONICAL stays pinned, so registering
  # first would compare this repo's new copy against an old canonical and turn
  # every AIFactory PR red until this landed.
  #
  # !! RE-POINT BEFORE MERGING (Factory#638) !!
  # Bumped for olafkfreund/Factory#714 (py/tarslip): artifact_store.py now always
  # extracts with the stdlib `data` filter instead of falling back to an
  # unfiltered extractall on pre-3.12 runtimes. This is the SQUASH-MERGE commit
  # on hub `main`, never a PR-branch head -- the hub squash-merges, so a branch
  # head ceases to exist the moment the PR lands and the pin then resolves to
  # nothing (Factory#638).
  HUB_PIN_SHA: "18197495783c2e3eefd32076a63bf89fcfaf208c"

jobs:
  drift:
    name: vendored copies match the hub canonical (byte-exact)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: service

      # HUB_PIN_SHA lives in this workflow file, which on a fork PR comes from
      # the PR's own tree. Forks share one object store with Factory, so a
      # commit that exists only in a fork is still fetchable by SHA from
      # olafkfreund/Factory -- a fork PR could pin a hub tree matching its own
      # drifted copy and this gate would report green (AIFactory#1281).
      - name: The pinned hub SHA must be on hub main
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./service/.github/scripts/assert-hub-pin-on-main.sh "${{ env.HUB_PIN_SHA }}" "HUB_PIN_SHA"

      - name: Check out the Factory hub canonical at the pinned SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: olafkfreund/Factory
          ref: ${{ env.HUB_PIN_SHA }}
          path: factory-hub
          # If the Factory hub is private, provide a read token here.

      - name: Check out the hub drift CHECKER at main
        # Not at HUB_PIN_SHA: a gate fetched from its own pin cannot ship its
        # own fix. The CANONICAL above stays pinned, so comparisons remain
        # reproducible; only the gate's own logic floats (Factory#405).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: olafkfreund/Factory
          ref: main
          path: factory-hub-main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the hub drift gate against this service (blocking)
        run: |
          python factory-hub-main/scripts/check_verification_core_drift.py \
            --canonical factory-hub/scripts \
            --service aifactory \
            --root service
