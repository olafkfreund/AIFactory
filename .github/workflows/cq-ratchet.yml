name: cq-ratchet

# Diff-scoped code-quality ratchet (Factory coding standards, section 4.6).
#
# Holds NEW and TOUCHED Python to the full fleet-wide strict bar
# (standards/ruff.toml + standards/mypy.ini, vendored from the Factory hub)
# WITHOUT turning the legacy tree red:
#   * ruff runs against the strict baseline per changed file and fails only if a
#     changed file's strict-violation COUNT increased vs the base branch
#     (scripts/cq_ratchet.py). A touched file's existing legacy violations are
#     tolerated; adding one is not. Count (not line) scoping is used so a pure
#     `ruff format` reflow of legacy lines cannot trip the gate.
#   * mypy --strict runs per changed file and fails only if a changed file's
#     error COUNT increased vs the base branch (#647). Touched legacy files keep
#     their existing type debt; net-new type errors fail. Same count-scoped
#     no-regression contract as the ruff ratchet above.
#   * ruff format --check runs over EVERY Python directory in the repo --
#     apps/backend, apps/web-server, scripts/ and tests/ (#1179, #1205). It ran
#     over apps/backend and scripts/ only until then, so tests/ was linted by
#     ci.yml and never format-checked, and 26 files had drifted. A whole-tree
#     format gate cannot grandfather anything, so the drift was swept in the
#     same change. tests/test_ruff_scope_covers_the_tree.py compares this scope
#     against `git ls-files '*.py'` so a new top-level Python directory cannot
#     land outside it in silence -- which is exactly how apps/web-server sat
#     outside ci.yml's `ruff check` from #903 to #1205.
# Adopting issues: #647, #652.
#
# Intended to be BLOCKING under branch protection. The pre-existing lenient
# repo-wide `ruff check` in ci.yml stays as-is for the legacy backlog.
#
# SCOPE: apps/backend, apps/web-server and scripts/.
#
# scripts/ was added in Factory#597 for one reason: scripts/cq_ratchet.py IS
# this gate, and it sat outside every ruff and mypy scope this repo has — the
# file that counts findings on each changed backend file was the one file no run
# looked at. Measured on dev before the change: 18 ungated ruff findings in it
# (7 S603, 4 PLW1510, 3 T201, 2 S607, 1 I001, 1 PLR0912) plus `ruff format`
# drift. All 18 are FIXED in that PR, not grandfathered — PLW1510 by passing
# check=False for real, PLR0912 by lifting the reporting tail out of main(), the
# rest per-line with the argv provenance stated. The format gate is WHOLE-TREE
# and cannot grandfather anything, so the drift was swept in the same PR.
#
# The format-check job was also called "repo-wide" while running only over
# apps/backend. It now says what it does -- and since #1179 what it does IS
# every Python directory, so the name is a claim a test can check rather than
# one that quietly narrows again.
#
# scripts/ratchet_helpers.py stays out, and needed no new config to do so: it is
# already in ruff.toml's extend-exclude as the byte-exact hub canonical, and this
# ratchet honours those excludes itself (_ruff_excludes, #1028). Reformatting a
# vendored copy to satisfy a LOCAL rule is what breaks the next re-vendor.
#
# .husky/pre-commit is deliberately NOT widened to match. It resolves ruff from
# the local venv and rewrites staged files with it, so extending its glob to
# scripts/ would let a version skew land the drift this change removes
# (PFactory#452, same hook lineage). The hook keeps its apps/backend glob;
# scripts/ is gated here, where the pin holds.

on:
  pull_request:
    branches: [dev, main, "feat/**", "release/**"]

concurrency:
  group: cq-ratchet-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin the toolchain (standards 4.5). Matches the ruff-pre-commit hook so local
  # and CI agree byte-for-byte on lint + format.
  RUFF_VERSION: "0.14.10"

jobs:
  ratchet:
    name: ratchet (ruff + mypy on changed Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # need the merge base to diff against

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Install deps (for mypy import resolution) + pinned ruff
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt
          uv pip install "ruff==${RUFF_VERSION}"

      - name: Fetch PR base
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Ruff (strict baseline, per-file no-regression ratchet)
        run: |
          apps/backend/.venv/bin/python scripts/cq_ratchet.py \
            --base "origin/${{ github.base_ref }}" \
            --ruff apps/backend/.venv/bin/ruff \
            --config standards/ruff.toml \
            --paths 'apps/backend/*.py' 'apps/web-server/*.py' 'scripts/*.py'

      - name: Mypy --strict (shared baseline, per-file no-regression ratchet)
        run: |
          # mypy cannot be line-scoped and the legacy tree is only partially
          # annotated, so gating every TOUCHED file under --strict at error
          # severity would turn a formatting-only PR instantly red (the exact
          # whole-repo-strict trap the standard's ratchet exists to avoid).
          # Instead we count mypy --strict errors per changed file base-vs-head
          # and fail only if a touched file's error COUNT increased — the same
          # no-regression contract the ruff ratchet uses (#647). A new untyped
          # module (before=0) cannot land any errors; a touched legacy file
          # keeps its existing debt but may not add to it. Cleaning type errors
          # only ever lowers the count, which is always allowed.
          apps/backend/.venv/bin/python scripts/cq_ratchet.py \
            --tool mypy \
            --base "origin/${{ github.base_ref }}" \
            --mypy apps/backend/.venv/bin/mypy \
            --config standards/mypy.ini \
            --paths 'apps/backend/*.py' 'apps/web-server/*.py' 'scripts/*.py'

  format-check:
    name: ruff format --check (every Python directory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned ruff
        run: pip install "ruff==${RUFF_VERSION}"

      # apps/web-server and tests/ joined this list in #1179/#1205. `ruff check`
      # covered tests/ and this did not, so a file could be linted and never
      # format-checked and the tree drifted: 26 files would have been
      # reformatted on dev (16 under apps/web-server, 10 under tests/), all
      # reformatted in that PR. A whole-tree format gate cannot grandfather
      # anything, which is why the drift had to be swept in the same change.
      #
      # These four ARE every Python directory in the repo, so the job name is
      # now a claim that can be checked rather than a scope that quietly
      # narrowed. Adding a fifth top-level Python directory means adding it
      # here; tests/test_ruff_scope_covers_the_tree.py fails if one appears.
      - name: Ruff format check (apps/backend, apps/web-server, scripts, tests)
        run: ruff format --check apps/backend apps/web-server scripts tests

  config-drift:
    name: shared-baseline drift gate (blocking)
    runs-on: ubuntu-latest
    # Confirms the vendored standards/ copies still match the Factory hub
    # baseline at the pinned SHA (standards/.hub-sha). Per the standard the
    # vendored copies must stay byte-identical to the hub (Factory#154); local
    # tighten-only overrides live in the root ruff.toml, never in standards/.
    #
    # The compared set is ruff.toml, mypy.ini, .editorconfig and
    # coding-standards.md (hub standards rule 5.3). The standard was previously
    # not vendored anywhere in this repo, so a hub rule could say one thing
    # while the service did another and no gate noticed - Factory#434.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aifactory

      - name: Read pinned hub SHA
        id: pin
        # Validated before use, because this file comes from the PR's own tree:
        # on a fork PR its contents are attacker-controlled, and the value is
        # handed straight to actions/checkout as a `ref`. Reject anything that is
        # not a bare 40-character commit id.
        run: |
          set -euo pipefail
          sha="$(tr -d '[:space:]' < aifactory/standards/.hub-sha)"
          if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "standards/.hub-sha is not a 40-character commit SHA: '${sha}'" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # No continue-on-error: an unreachable hub is a gate that cannot run, and
      # per standards rule 4.7 that must fail rather than pass. This step used
      # to be `continue-on-error: true` with the diff below guarded on
      # `steps.hub.outcome == 'success'`, so a private repo, an expired token or
      # a renamed hub would skip the diff and report SUCCESS from a job named
      # blocking. If Factory becomes private, add a read token here - do not
      # restore the soft-skip.
      - name: Check out hub standards at the pinned SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: olafkfreund/Factory
          ref: ${{ steps.pin.outputs.sha }}
          path: factory-hub
          # This tree is only ever diffed, never executed, and nothing here runs
          # git against it afterwards. Do not leave the job token behind in
          # factory-hub/.git/config, where a checked-out ref chosen by the PR
          # would sit next to it.
          persist-credentials: false

      - name: Diff vendored files against the pinned hub baseline
        run: |
          set -euo pipefail
          # Configs carry a provenance header above the body, so compare the
          # body only by stripping leading comment/blank lines from both sides.
          strip() { grep -vE '^[[:space:]]*([#;]|$)' "$1"; }
          for f in ruff.toml mypy.ini .editorconfig; do
            if ! diff <(strip "aifactory/standards/$f") <(strip "factory-hub/standards/$f"); then
              echo "DRIFT: aifactory/standards/$f diverged from the pinned hub baseline (standards/$f)."
              echo "Re-vendor from the hub and bump standards/.hub-sha, or justify a tighten-only override in the root ruff.toml."
              exit 1
            fi
          done
          # coding-standards.md is compared BYTE-EXACT and carries no header:
          # strip() drops lines starting with '#', which in Markdown is every
          # heading (58 of its 198 lines), so a stripped compare would be blind
          # to every section title. Hub standards rule 5.1.
          if ! diff "aifactory/standards/coding-standards.md" "factory-hub/standards/coding-standards.md"; then
            echo "DRIFT: aifactory/standards/coding-standards.md diverged from the pinned hub baseline."
            echo "The standard is vendored, not editable here. Change it in the hub, then re-vendor and bump standards/.hub-sha."
            exit 1
          fi
          echo "No drift: vendored files match the pinned hub baseline."

      # Factory#730: the step above compares FILE BYTES. standards/ruff.toml
      # can be byte-identical to the hub while the EFFECTIVE config a plain
      # `ruff check` resolves is not -- a per-file-ignores table that a local
      # override replaces rather than merges, or a target-version that never
      # reaches the root config, reopen exactly what the vendored file closes,
      # and no byte diff sees either. This asserts on resolved behaviour.
      #
      # The probe lives under tests/ so it must earn the shared S101/PLR2004
      # test carve-out (standards/ruff.toml's per-file-ignores), and it sorts
      # stdlib `tomllib` ahead of a third-party import -- clean only under
      # target-version >= py311 (tomllib is stdlib since 3.11; an older or
      # unset target classifies it third-party and demands the opposite
      # order). The hub baseline is clean on this probe by construction, so
      # this repo's ORDINARY `ruff check` (no --config override) must be too.
      - name: Install ruff (pinned)
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Effective config matches the hub baseline (not just file bytes)
        working-directory: aifactory
        run: |
          set -euo pipefail
          probe_dir="tests/__ruff_drift_probe__"
          probe="${probe_dir}/test_probe.py"
          mkdir -p "${probe_dir}"
          cat > "${probe}" <<'PY'
          import tomllib

          import requests

          assert requests and tomllib
          PY
          trap 'rm -rf "${probe_dir}"' EXIT

          repo_verdict="$(ruff check --select S,I,UP --output-format concise "${probe}" 2>&1 || true)"
          hub_verdict="$(ruff check --select S,I,UP --output-format concise --config ../factory-hub/standards/ruff.toml "${probe}" 2>&1 || true)"

          if [ "${repo_verdict}" != "${hub_verdict}" ]; then
            echo "::error::Effective ruff config has drifted from the hub baseline (Factory#730)."
            echo "--- this repo, ordinary \`ruff check\` (no --config override) ---"
            echo "${repo_verdict}"
            echo "--- hub baseline (standards/ruff.toml) ---"
            echo "${hub_verdict}"
            echo "File bytes can match while the EFFECTIVE config (per-file-ignores reach, target-version)"
            echo "does not. Fix the root ruff.toml (extend / target-version / per-file-ignores); this is"
            echo "not a standards/ruff.toml byte diff."
            exit 1
          fi
          echo "Effective config matches the hub baseline for the S101/target-version probe."
