name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint-test:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Create venv + install deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt
          uv pip install ruff

      - name: Ruff lint
        run: apps/backend/.venv/bin/ruff check apps/backend tests

      - name: Pytest (skip slow)
        env:
          GRAPHITI_ENABLED: "false"
          APP_DISABLE_AUTH: "true"  # endpoint tests use anonymous TestClient
        run: apps/backend/.venv/bin/pytest tests/ -m "not slow" -q

  frontend-typecheck:
    name: frontend (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace deps
        run: npm ci

      - name: Type-check frontend
        run: npm -w apps/frontend-web run typecheck

  docker-acceptance:
    name: docker (P0 acceptance)
    runs-on: ubuntu-latest
    # Docker is preinstalled on ubuntu-latest runners. Tests opt-in via
    # `-m docker`; all are skipped until P0.1+ implementations land,
    # so this job is green from day 1 and turns red the moment an
    # implementation chunk lands but its acceptance test doesn't pass.
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch buildx tests)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Trivy (for P0.8 CVE scan)
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest

      - name: Install Syft (for P0.9 SBOM generation)
        uses: anchore/sbom-action/download-syft@v0.17.8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install test deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Docker version
        run: docker version

      - name: Pytest docker acceptance
        env:
          CI: "true"
        run: apps/backend/.venv/bin/pytest tests/docker/ -m docker -v

      # NOTE: `npm -w apps/frontend-web run lint` invokes eslint which is
      # not declared as a devDependency. To enable the lint step, add
      # eslint + plugins to apps/frontend-web/package.json devDependencies
      # and uncomment:
      # - name: Lint frontend
      #   run: npm -w apps/frontend-web run lint
