  deps-lock-drift:
    name: deps (requirements.lock in sync)
    runs-on: ubuntu-latest
    # The Dockerfile installs the runtime venv from requirements.lock with
    # --require-hashes (#1284). That makes the lock load-bearing, and a
    # load-bearing file that nothing checks is a file that rots: add a package
    # to apps/*/requirements.txt without recompiling and the image quietly
    # ships without it, surfacing as an ImportError in a pod rather than as a
    # red check on the PR that caused it.
    #
    # Recompiling is a safe equality test, not a resolution race: uv reads the
    # existing lock as *preferences*, so an unchanged input recompiles
    # byte-identically even after upstream publishes a newer release. The job
    # therefore fails only on real drift, never on the passage of time.
    #
    # That holds ONLY because the compile step seeds its -o path with the
    # committed lock first. uv reads preferences from the output file, so
    # compiling straight into a fresh /tmp path supplies none and resolves to
    # newest-available every run. Compiling twice against the committed lock
    # does not detect that -- both runs are equally preference-free and equally
    # newest -- which is why it went unnoticed until an upstream release landed
    # mid-morning and turned every open PR red.
    #
    # Comparison strips leading-# lines because the committed lock carries a
    # hand-written prose header that --no-header does not reproduce. The `#
    # via` provenance comments are indented and so survive the filter and are
    # still compared.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      # Flags MUST match the lockfile header's regeneration command; the lock
      # is only valid for the interpreter and platform it was compiled for,
      # which are the runtime image's (chainguard python:latest-dev = CPython
      # 3.14, and every image build is platforms: linux/amd64).
      - name: Recompile the lock from the requirements files
        run: |
          # uv takes preferences from the file named by -o, so the committed
          # lock has to BE that file before the compile or there are no
          # preferences at all and every run resolves to newest-available.
          # Without this seed the gate fails on the passage of time: it passed
          # on dev at 2026-08-18T23:29Z and failed at 11:24Z next morning on
          # the same tree, because lxml 6.1.2 published at 04:58Z and uvicorn
          # 0.52.4 alongside it. Nothing in the repo had changed.
          cp requirements.lock /tmp/requirements.recompiled.lock
          uv pip compile --python-version 3.14 \
            --python-platform x86_64-unknown-linux-gnu --generate-hashes \
            --no-header \
            apps/web-server/requirements.txt apps/backend/requirements.txt \
            -o /tmp/requirements.recompiled.lock

      - name: Fail if the committed lock differs
        run: |
          grep -v '^#' requirements.lock > /tmp/committed.body
          grep -v '^#' /tmp/requirements.recompiled.lock > /tmp/recompiled.body
          if ! diff -u /tmp/committed.body /tmp/recompiled.body; then
            echo "::error::requirements.lock is out of sync with the requirements.txt files."
            echo "Regenerate it with the command in the requirements.lock header and commit the result."
            exit 1
          fi
          echo "requirements.lock is in sync."

  frontend-typecheck:
    name: frontend (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace deps
        run: npm ci

      - name: Type-check frontend
        run: npm -w apps/frontend-web run typecheck

  frontend-test:
    name: frontend (vitest)
    runs-on: ubuntu-latest
    # Runs the apps/frontend-web vitest component suite (16 .test.tsx
    # files) so the tests can no longer silently rot. Now BLOCKING: the
    # OnboardingWizard.test.tsx assertions were repaired to the current
    # provider-choice flow (#772), so the suite is green and gates merges.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace deps
        run: npm ci

      - name: Run frontend tests
        run: npm -w apps/frontend-web run test

  frontend-quality:
    name: frontend lint + format (blocking, #647)
    runs-on: ubuntu-latest
    # Blocking frontend gate (#647): ESLint 9 flat config
    # (typescript-eslint strictTypeChecked + react-hooks + jsx-a11y) and a
    # scoped prettier --check. Tuned green at adoption via a warning baseline
    # (eslint . --max-warnings <baseline> in package.json) and PR-owned-file
    # prettier scope — net-new ERRORS and net-new WARNINGS over the baseline
    # both fail the build (see apps/frontend-web/eslint.config.js TODOs).
    # The vitest suite stays in the separate frontend-test job; typecheck in
    # frontend-typecheck.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace deps (incl. dev)
        # --include=dev is explicit so the gate never silently skips the lint
        # toolchain if the runner inherits NODE_ENV=production.
        run: npm ci --include=dev

      - name: ESLint (strictTypeChecked + react-hooks + jsx-a11y; warning baseline)
        run: npm -w apps/frontend-web run lint

      - name: Prettier --check (PR-owned files)
        run: npm -w apps/frontend-web run format:check

  # The `python (mypy)` job lived here (#832). Removed: it reported 974 errors
  # across 185 files and was never green in its entire life (0/30 runs sampled),
  # so its annotations were unread noise and its permanent red X taught everyone
  # that a failing check is normal — the exact habit that lets a real regression
  # through. It was already `continue-on-error: true`, so it gated nothing.
  #
  # Changed-file mypy coverage is NOT lost; it moved somewhere stricter. This job
  # ran plain `--ignore-missing-imports --follow-imports=silent` (no --strict);
  # cq-ratchet.yml runs mypy `--strict` (standards/mypy.ini) per changed file and
  # fails when a touched file's error COUNT increases. Strictly a higher bar on
  # the code a PR actually touches, and it passes — so it carries signal.
  #
  # What IS lost: the whole-repo view (a change in A breaking types in B). It was
  # only ever theoretical here — unreadable at 974 and non-blocking by design. If
  # we want it back, the honest form is baselining the whole-repo count and failing
  # on increase, not restoring a check that cries wolf every run.

  docker-acceptance:
    name: docker (P0 acceptance)
    runs-on: ubuntu-latest
    # Docker is preinstalled on ubuntu-latest runners. Tests opt-in via
    # `-m docker`; all are skipped until P0.1+ implementations land,
    # so this job is green from day 1 and turns red the moment an
    # implementation chunk lands but its acceptance test doesn't pass.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        # buildx is needed for `docker buildx imagetools inspect`, used by
        # tests/docker/test_p0_multi_arch.py to verify our base images
        # support both amd64 + arm64 manifests. QEMU is NOT needed here —
        # the test inspects manifests, it doesn't cross-build. Cross-arch
        # building happens in release.yml at tag push time only.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Trivy is PINNED, not `latest` (Factory#664). `latest` means the scanner
      # changes without a commit, so a scan verdict is not attributable to
      # anything in git, and a Trivy release can turn the whole fleet red at
      # once with no change from us. Bump this deliberately, the way image
      # digests and CLI pins are bumped.
      #
      # Installed via the SHA-pinned first-party action, replacing a
      # `curl | sh` of contrib/install.sh fetched by a workflow-file `env:`
      # SHA (Factory#808): on `pull_request` that env is the PR's own copy, and
      # forks share one object store, so a fork PR could point the URL at its
      # own script and the runner would execute it.
      #
      # Do NOT add `continue-on-error`. A scan step that passes without scanning
      # is a control that would look identical having done nothing - see
      # standards/coding-standards.md rule 4.10.
      - name: Install Trivy (for P0.8 CVE scan)
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0
          # No cache: a cached binary is one more thing that can go stale or be
          # poisoned across runs, for a download that takes seconds.
          cache: false

      # Asserts the binary is runnable, not assumed - the action puts its own
      # bin dir on $GITHUB_PATH, so no manual PATH append is needed.
      - name: Assert Trivy is runnable
        run: trivy --version

      - name: Install Syft (for P0.9 SBOM generation)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Install test deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Docker version
        run: docker version

      - name: Pytest docker acceptance
        env:
          CI: "true"
        run: apps/backend/.venv/bin/pytest tests/docker/ -m docker -v
      # Frontend lint is now a dedicated blocking job (frontend-quality, #647).
