name: CI

on:
  pull_request:
    branches: [dev, main, "feat/**", "release/**"]
  push:
    branches: [dev, main, "feat/**", "release/**"]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint-test:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    # Redis service container for the cross-replica WS fan-out
    # integration tests (Epic #35 #40 half-A). MinIO for the
    # S3-workspaces tests (Epic #35 #40 half-B) starts via a
    # ``docker run`` step below — service containers can't pass the
    # ``server /data`` command the upstream MinIO image needs.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Create venv + install deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt
          uv pip install ruff

      - name: Ruff lint
        run: apps/backend/.venv/bin/ruff check apps/backend tests

      # MinIO for the S3-workspaces integration tests (Epic #35 #40
      # half-B). Started as a regular ``docker run`` rather than a
      # service container because (a) bitnami/minio:latest was retired
      # mid-2026, and (b) GHA service containers can't pass the
      # ``server /data`` command upstream minio/minio needs.
      - name: Start MinIO
        run: |
          docker run -d --name aif-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio12345 \
            quay.io/minio/minio:latest server /data
          # Wait for healthcheck to pass before pytest fires the
          # integration tests. Times out after ~30s if MinIO never
          # comes up — the tests would just skip in that case.
          for i in $(seq 1 30); do
            if curl -fsSL "http://localhost:9000/minio/health/live" >/dev/null 2>&1; then
              echo "MinIO ready after ${i}s"
              break
            fi
            sleep 1
          done

      # bubblewrap powers the agent OS sandbox (#363). Installed here so the
      # sandbox-escape corpus exercises a real bwrap boundary instead of
      # skipping. Ubuntu 24.04 restricts unprivileged user namespaces via
      # AppArmor (bwrap can't create namespaces under that), so relax it — the
      # `|| true` keeps older kernels without the knob green.
      - name: Install bubblewrap (agent OS sandbox, #363)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Pytest (skip slow)
        env:
          GRAPHITI_ENABLED: "false"
          APP_DISABLE_AUTH: "true"  # endpoint tests use anonymous TestClient
          # Cross-replica WS fan-out integration test points at the
          # services.redis container above. Test still skips on local
          # dev runs that don't have a Redis available.
          TEST_REDIS_URL: "redis://localhost:6379/15"
          # Workspace-storage integration test points at the
          # services.minio container. MINIO_DEFAULT_BUCKETS on the
          # service auto-creates the bucket; the test fixture
          # idempotently re-creates it if needed.
          TEST_S3_URI_BASE: "s3://aifactory-test/workspaces"
          TEST_S3_ENDPOINT_URL: "http://localhost:9000"
          AWS_ACCESS_KEY_ID: "minio"
          AWS_SECRET_ACCESS_KEY: "minio12345"
        run: apps/backend/.venv/bin/pytest tests/ -m "not slow" -q

      # #854: the co-located tests under apps/backend (next to the code they
      # exercise) were never collected — the root `pytest tests/` above only
      # runs tests/. This gates them too. `asyncio_mode=auto` because these
      # files have no root pytest.ini (tests/pytest.ini is scoped to tests/);
      # the two manual graphiti integration scripts are excluded via a local
      # conftest collect_ignore.
      - name: Pytest co-located (apps/backend)
        env:
          GRAPHITI_ENABLED: "false"
          APP_DISABLE_AUTH: "true"
          # test_gh_client shells out to the real `gh` CLI, which refuses to run
          # in Actions without a token; provide the job token so its timeout /
          # invalid-command paths reach the real error instead of an auth error.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: apps/backend/.venv/bin/pytest apps/backend -q -o asyncio_mode=auto

      # #903: the other half of the #854 gap. apps/web-server/tests was never
      # collected either — `pytest tests/` and `pytest apps/backend` above miss
      # it — so it had never gated a PR, including the RFC-0016 admission-control
      # and concurrency-queue tests. Same flags as the apps/backend step: no root
      # pytest.ini (tests/pytest.ini is scoped to tests/), so asyncio_mode is set
      # here. Imports resolve via apps/web-server/tests/conftest.py.
      - name: Pytest co-located (apps/web-server)
        env:
          GRAPHITI_ENABLED: "false"
          APP_DISABLE_AUTH: "true"
        run: apps/backend/.venv/bin/pytest apps/web-server/tests -q -o asyncio_mode=auto

  postgres-acceptance:
    name: postgres (P1 acceptance, PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: aifactory_test
          POSTGRES_PASSWORD: aifactory_test
          POSTGRES_DB: aifactory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: "postgresql+asyncpg://aifactory_test:aifactory_test@localhost:5432/aifactory_test"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Install deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Pytest postgres acceptance (PG ${{ matrix.pg }})
        env:
          CI: "true"
        run: apps/backend/.venv/bin/pytest tests/postgres/ -m postgres -v

  secrets-acceptance:
    name: secrets (P2 acceptance)
    runs-on: ubuntu-latest
    # P2 EncryptedString / KMS acceptance. Three services run as
    # sidecars so the integration tests gate every PR:
    #   - postgres   → P2.3 column migration + backfill tests
    #   - localstack → P2.4 AWS KMS round-trip test
    #   - vault      → P2.4 Vault Transit round-trip test
    # Azure and GCP backends stay skipped in CI — no faithful emulator
    # exists; they're verified at deploy time against real cloud creds.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aifactory_test
          POSTGRES_PASSWORD: aifactory_test
          POSTGRES_DB: aifactory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: kms
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health | grep -q '\"kms\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      vault:
        image: hashicorp/vault:1.18
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root-test-token
        ports:
          - 8200:8200
        # The Vault image is Alpine-based and ships the `vault` binary
        # but NOT `wget` or `curl`. Using `vault status` for the
        # healthcheck guarantees the probe binary exists. Dev mode auto-
        # unseals on boot, so `vault status` exits 0 once the server is
        # serving requests — exactly the "healthy" semantics we want.
        # IPC_LOCK is dropped because GitHub Actions sandboxes the cap
        # anyway, and dev mode doesn't need mlock.
        options: >-
          --health-cmd "VAULT_ADDR=http://127.0.0.1:8200 vault status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: "postgresql+asyncpg://aifactory_test:aifactory_test@localhost:5432/aifactory_test"
      AWS_ENDPOINT_URL: "http://localhost:4566"
      VAULT_ADDR: "http://localhost:8200"
      VAULT_TOKEN: "root-test-token"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Install deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Pytest secrets acceptance
        env:
          CI: "true"
        run: apps/backend/.venv/bin/pytest tests/secrets/ -m secrets -v

  oidc-acceptance:
    name: oidc (P3 acceptance)
    runs-on: ubuntu-latest
    # P3 OIDC SSO tests. Boots a Keycloak dev-mode container with the
    # `aifactory` realm imported from tests/oidc/fixtures/keycloak-realm.json.
    # Tests that need the IdP read OIDC_ISSUER_URL/CLIENT_ID/SECRET from
    # the job env. Until P3.1 lands real test bodies, the suite collects
    # cleanly with all 6 acceptance tests in skip-pending state.
    steps:
      - uses: actions/checkout@v4

      - name: Start Keycloak (with realm import)
        # Keycloak's official image's `start-dev` mode auto-unseals
        # itself and can import a realm at boot from a mounted file.
        # Run it as a normal `docker run` (not a service container) so
        # we can mount the realm JSON from the checked-out tree without
        # the service-container's no-mount restriction.
        run: |
          docker run -d --name keycloak \
            -p 8080:8080 \
            -v "$PWD/tests/oidc/fixtures/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro" \
            -e KEYCLOAK_ADMIN=admin \
            -e KEYCLOAK_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:25.0 \
            start-dev --import-realm
          # Wait until the realm endpoint responds with 200.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/realms/aifactory/.well-known/openid-configuration >/dev/null; then
              echo "keycloak ready"; break
            fi
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Install deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Pytest oidc acceptance
        env:
          CI: "true"
          OIDC_ISSUER_URL: "http://localhost:8080/realms/aifactory"
          OIDC_CLIENT_ID: "aifactory-web"
          OIDC_CLIENT_SECRET: "aifactory-test-secret"
          # #366: OidcRefreshSession.idp_refresh_token is encrypted at rest
          # (EncryptedString). Provide a throwaway Fernet key so the encrypt
          # path works in this job (test-only value).
          KMS_FERNET_KEY: "w5zEtCchBJDrettOdB7PZQohOBQ_gwT3rA_rYO4hy84="
        run: apps/backend/.venv/bin/pytest tests/oidc/ -m oidc -v

  saml-scim-acceptance:
    name: saml-scim (P8 acceptance)
    runs-on: ubuntu-latest
    # P8 SAML + SCIM tests. Unlike P3 (OIDC) we don't boot a real IdP:
    # the SAML test fixtures generate signed `<Response>` documents
    # in-process using committed test certs (see tests/fixtures/saml/),
    # and the SCIM tests hit the FastAPI app directly via TestClient.
    # The helm-toggle test in this suite needs `helm` on PATH; we
    # install it the same way the helm-acceptance job does.
    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "3.16.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Install deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Pytest saml + scim + helm-toggle
        env:
          CI: "true"
        run: |
          apps/backend/.venv/bin/pytest \
            tests/saml/ \
            tests/scim/ \
            tests/helm/test_saml_scim_toggle.py \
            -v

  helm-acceptance:
    name: helm (P4 acceptance)
    runs-on: ubuntu-latest
    # P4 Helm chart tests. The harness lands first (P4.0a) with all
    # seven acceptance tests skip-pending; chart templates + lint +
    # kubeconform + kind install arrive in P4.1+. Job is green from
    # day one — same pattern as P2.0a and P3.0a.
    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "3.16.0"

      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kc.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tgz -C /tmp/
          sudo install /tmp/kubeconform /usr/local/bin/

      - name: Install kind + kubectl
        uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
        with:
          install_only: true
          version: "v0.24.0"
          kubectl_version: "v1.30.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Install test deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r ../../tests/requirements-test.txt

      # Pull sub-chart dependencies (LiteLLM 1.86.x for Epic #35 #38)
      # BEFORE the pytest helm-acceptance suite renders the chart.
      # Without this step, helm template fails with "chart directory
      # is missing these dependencies" the moment any test sets
      # litellm.enabled=true. Idempotent — re-runs are cheap.
      - name: Helm dep update
        run: helm dep update charts/aifactory/

      - name: Pytest helm acceptance
        env:
          CI: "true"
        run: apps/backend/.venv/bin/pytest tests/helm/ -m helm -v

  audit-acceptance:
    name: audit (P5 acceptance)
    runs-on: ubuntu-latest
    # P5 audit-hardening tests run entirely in-process against
    # in-memory SQLite — hash chain, retention job, GDPR erasure,
    # and export streaming are all pure-Python. No service container
    # needed. Same TDD-first scaffold as P2.0a/P3.0a/P4.0a.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Install deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Pytest audit acceptance
        env:
          CI: "true"
        run: apps/backend/.venv/bin/pytest tests/audit/ -m audit -v

  obs-acceptance:
    name: obs (P6 acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Install deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Pytest obs acceptance
        env:
          CI: "true"
        run: apps/backend/.venv/bin/pytest tests/obs/ -m obs -v

  tenant-isolation-acceptance:
    name: tenant-isolation (P9 acceptance)
    runs-on: ubuntu-latest
    # Epic #35 #36 — Tenant Isolation Mode. Covers:
    #   - reconciler decision logic (tests/test_tenant_reconciler.py)
    #   - schema migration / TenantState ORM (tests/postgres/test_tenant_states_schema.py)
    #   - Helm chart rendering: env vars, RBAC, CronJob, Gatekeeper
    #     samples, CNI pre-install probe, schema validators
    #     (tests/helm/test_tenant_toggle.py — requires helm binary)
    # No service containers — reconciler tests use in-memory SQLite;
    # Helm tests use `helm template` against the local chart.
    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Install deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Helm dependency build
        run: helm dependency build charts/aifactory/

      - name: Pytest tenant-isolation acceptance
        env:
          CI: "true"
        run: |
          apps/backend/.venv/bin/pytest \
            tests/test_tenant_reconciler.py \
            tests/helm/test_tenant_toggle.py \
            -v

  rmux-acceptance:
    name: rmux (R0b acceptance)
    runs-on: ubuntu-latest
    # Epic #44 / issue #45. R0b ships apps/web-server/server/rmux/wrapper.py
    # — the async subprocess wrapper that every later rmux phase depends
    # on. Tests run against a real rmux daemon installed on the runner.
    # The binary is pinned by SHA-256; see design doc §3.4.
    steps:
      - uses: actions/checkout@v4

      - name: Install rmux v0.3.1 (linux-x86_64 gnu, SHA-256 pinned)
        run: |
          set -euo pipefail
          # Pinned release tarball. Update VERSION + EXPECTED_SHA together
          # whenever bumping. Helvesec/rmux's v0.3.x assets are versioned
          # in the filename (rmux-v${VERSION}-…) and ship the gnu (not
          # musl) linux target.
          VERSION="0.3.1"
          ARCH_TARGET="x86_64-unknown-linux-gnu"
          ASSET="rmux-v${VERSION}-${ARCH_TARGET}.tar.gz"
          URL="https://github.com/Helvesec/rmux/releases/download/v${VERSION}/${ASSET}"
          EXPECTED_SHA="511d3caceea4fcbc1458877a192efffcde5ceb1455f040f1a79c63ab00804cf8"
          curl -fsSL -o /tmp/rmux.tar.gz "${URL}"
          echo "${EXPECTED_SHA}  /tmp/rmux.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rmux.tar.gz -C /tmp/
          # The v0.3.x tarballs unpack into a versioned subdir; locate
          # the binary rather than assuming /tmp/rmux.
          BIN_PATH="/tmp/rmux-v${VERSION}-${ARCH_TARGET}/rmux"
          test -x "${BIN_PATH}"
          sudo install -m 0755 "${BIN_PATH}" /usr/local/bin/rmux
          rmux -V

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Install deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Pytest rmux acceptance (unit + integration round-trip)
        env:
          CI: "true"
        run: apps/backend/.venv/bin/pytest tests/rmux/ -v

  evidence-acceptance:
    name: evidence (P7 acceptance)
    runs-on: ubuntu-latest
    # P7 closes the v1.0 Epic. Tests verify the compliance docs + the
    # three ship-readiness drill scripts exist and have the structural
    # contract auditors expect. No service containers — purely
    # filesystem / subprocess validation.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Install test deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r ../../tests/requirements-test.txt

      - name: Pytest evidence acceptance
        env:
          CI: "true"
        run: apps/backend/.venv/bin/pytest tests/evidence/ -m evidence -v

  frontend-typecheck:
    name: frontend (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace deps
        run: npm ci

      - name: Type-check frontend
        run: npm -w apps/frontend-web run typecheck

  frontend-test:
    name: frontend (vitest)
    runs-on: ubuntu-latest
    # Runs the apps/frontend-web vitest component suite (16 .test.tsx
    # files) so the tests can no longer silently rot. Now BLOCKING: the
    # OnboardingWizard.test.tsx assertions were repaired to the current
    # provider-choice flow (#772), so the suite is green and gates merges.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace deps
        run: npm ci

      - name: Run frontend tests
        run: npm -w apps/frontend-web run test

  frontend-quality:
    name: frontend lint + format (blocking, #647)
    runs-on: ubuntu-latest
    # Blocking frontend gate (#647): ESLint 9 flat config
    # (typescript-eslint strictTypeChecked + react-hooks + jsx-a11y) and a
    # scoped prettier --check. Tuned green at adoption via a warning baseline
    # (eslint . --max-warnings <baseline> in package.json) and PR-owned-file
    # prettier scope — net-new ERRORS and net-new WARNINGS over the baseline
    # both fail the build (see apps/frontend-web/eslint.config.js TODOs).
    # The vitest suite stays in the separate frontend-test job; typecheck in
    # frontend-typecheck.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace deps (incl. dev)
        # --include=dev is explicit so the gate never silently skips the lint
        # toolchain if the runner inherits NODE_ENV=production.
        run: npm ci --include=dev

      - name: ESLint (strictTypeChecked + react-hooks + jsx-a11y; warning baseline)
        run: npm -w apps/frontend-web run lint

      - name: Prettier --check (PR-owned files)
        run: npm -w apps/frontend-web run format:check

  # The `python (mypy)` job lived here (#832). Removed: it reported 974 errors
  # across 185 files and was never green in its entire life (0/30 runs sampled),
  # so its annotations were unread noise and its permanent red X taught everyone
  # that a failing check is normal — the exact habit that lets a real regression
  # through. It was already `continue-on-error: true`, so it gated nothing.
  #
  # Changed-file mypy coverage is NOT lost; it moved somewhere stricter. This job
  # ran plain `--ignore-missing-imports --follow-imports=silent` (no --strict);
  # cq-ratchet.yml runs mypy `--strict` (standards/mypy.ini) per changed file and
  # fails when a touched file's error COUNT increases. Strictly a higher bar on
  # the code a PR actually touches, and it passes — so it carries signal.
  #
  # What IS lost: the whole-repo view (a change in A breaking types in B). It was
  # only ever theoretical here — unreadable at 974 and non-blocking by design. If
  # we want it back, the honest form is baselining the whole-repo count and failing
  # on increase, not restoring a check that cries wolf every run.

  docker-acceptance:
    name: docker (P0 acceptance)
    runs-on: ubuntu-latest
    # Docker is preinstalled on ubuntu-latest runners. Tests opt-in via
    # `-m docker`; all are skipped until P0.1+ implementations land,
    # so this job is green from day 1 and turns red the moment an
    # implementation chunk lands but its acceptance test doesn't pass.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # buildx is needed for `docker buildx imagetools inspect`, used by
        # tests/docker/test_p0_multi_arch.py to verify our base images
        # support both amd64 + arm64 manifests. QEMU is NOT needed here —
        # the test inspects manifests, it doesn't cross-build. Cross-arch
        # building happens in release.yml at tag push time only.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install Trivy (for P0.8 CVE scan)
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: latest

      - name: Install Syft (for P0.9 SBOM generation)
        uses: anchore/sbom-action/download-syft@v0.17.8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Install test deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Docker version
        run: docker version

      - name: Pytest docker acceptance
        env:
          CI: "true"
        run: apps/backend/.venv/bin/pytest tests/docker/ -m docker -v
      # Frontend lint is now a dedicated blocking job (frontend-quality, #647).
