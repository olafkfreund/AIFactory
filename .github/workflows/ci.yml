name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint-test:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Create venv + install deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt
          uv pip install ruff

      - name: Ruff lint
        run: apps/backend/.venv/bin/ruff check apps/backend tests

      - name: Pytest (skip slow)
        env:
          GRAPHITI_ENABLED: "false"
          APP_DISABLE_AUTH: "true"  # endpoint tests use anonymous TestClient
        run: apps/backend/.venv/bin/pytest tests/ -m "not slow" -q

  postgres-acceptance:
    name: postgres (P1 acceptance, PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: aifactory_test
          POSTGRES_PASSWORD: aifactory_test
          POSTGRES_DB: aifactory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: "postgresql+asyncpg://aifactory_test:aifactory_test@localhost:5432/aifactory_test"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Pytest postgres acceptance (PG ${{ matrix.pg }})
        env:
          CI: "true"
        run: apps/backend/.venv/bin/pytest tests/postgres/ -m postgres -v

  secrets-acceptance:
    name: secrets (P2 acceptance)
    runs-on: ubuntu-latest
    # P2 EncryptedString / KMS acceptance. Three services run as
    # sidecars so the integration tests gate every PR:
    #   - postgres   → P2.3 column migration + backfill tests
    #   - localstack → P2.4 AWS KMS round-trip test
    #   - vault      → P2.4 Vault Transit round-trip test
    # Azure and GCP backends stay skipped in CI — no faithful emulator
    # exists; they're verified at deploy time against real cloud creds.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aifactory_test
          POSTGRES_PASSWORD: aifactory_test
          POSTGRES_DB: aifactory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: kms
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health | grep -q '\"kms\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      vault:
        image: hashicorp/vault:1.18
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root-test-token
        ports:
          - 8200:8200
        # The Vault image is Alpine-based and ships the `vault` binary
        # but NOT `wget` or `curl`. Using `vault status` for the
        # healthcheck guarantees the probe binary exists. Dev mode auto-
        # unseals on boot, so `vault status` exits 0 once the server is
        # serving requests — exactly the "healthy" semantics we want.
        # IPC_LOCK is dropped because GitHub Actions sandboxes the cap
        # anyway, and dev mode doesn't need mlock.
        options: >-
          --health-cmd "VAULT_ADDR=http://127.0.0.1:8200 vault status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: "postgresql+asyncpg://aifactory_test:aifactory_test@localhost:5432/aifactory_test"
      AWS_ENDPOINT_URL: "http://localhost:4566"
      VAULT_ADDR: "http://localhost:8200"
      VAULT_TOKEN: "root-test-token"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Pytest secrets acceptance
        env:
          CI: "true"
        run: apps/backend/.venv/bin/pytest tests/secrets/ -m secrets -v

  oidc-acceptance:
    name: oidc (P3 acceptance)
    runs-on: ubuntu-latest
    # P3 OIDC SSO tests. The harness lands first (P3.0a) with all six
    # acceptance tests skip-pending; the Keycloak service container and
    # real test bodies arrive in P3.1+. The job is green from day one
    # so it gates the workflow contract before any code lands — same
    # pattern as P2.0a.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Pytest oidc acceptance
        env:
          CI: "true"
        run: apps/backend/.venv/bin/pytest tests/oidc/ -m oidc -v

  frontend-typecheck:
    name: frontend (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace deps
        run: npm ci

      - name: Type-check frontend
        run: npm -w apps/frontend-web run typecheck

  docker-acceptance:
    name: docker (P0 acceptance)
    runs-on: ubuntu-latest
    # Docker is preinstalled on ubuntu-latest runners. Tests opt-in via
    # `-m docker`; all are skipped until P0.1+ implementations land,
    # so this job is green from day 1 and turns red the moment an
    # implementation chunk lands but its acceptance test doesn't pass.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # buildx is needed for `docker buildx imagetools inspect`, used by
        # tests/docker/test_p0_multi_arch.py to verify our base images
        # support both amd64 + arm64 manifests. QEMU is NOT needed here —
        # the test inspects manifests, it doesn't cross-build. Cross-arch
        # building happens in release.yml at tag push time only.
        uses: docker/setup-buildx-action@v3

      - name: Install Trivy (for P0.8 CVE scan)
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest

      - name: Install Syft (for P0.9 SBOM generation)
        uses: anchore/sbom-action/download-syft@v0.17.8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install test deps
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install -r ../web-server/requirements.txt
          uv pip install -r ../../tests/requirements-test.txt

      - name: Docker version
        run: docker version

      - name: Pytest docker acceptance
        env:
          CI: "true"
        run: apps/backend/.venv/bin/pytest tests/docker/ -m docker -v

      # NOTE: `npm -w apps/frontend-web run lint` invokes eslint which is
      # not declared as a devDependency. To enable the lint step, add
      # eslint + plugins to apps/frontend-web/package.json devDependencies
      # and uncomment:
      # - name: Lint frontend
      #   run: npm -w apps/frontend-web run lint
