name: AIFactory Task Creation

on:
  issues:
    types: [labeled]

jobs:
  create-task:
    # Who-can-trigger guard: only run for the `aifactory:run` label AND
    # when the issue author is a trusted member (OWNER/MEMBER/COLLABORATOR).
    # Prevents drive-by contributors from dispatching factory tasks that
    # hold GH_TOKEN + AIFACTORY_TOKEN.
    if: >-
      github.event.label.name == 'aifactory:run' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      models: read

    steps:
      - name: Create AIFactory task
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIFACTORY_URL: ${{ secrets.AIFACTORY_URL }}
          AIFACTORY_TOKEN: ${{ secrets.AIFACTORY_TOKEN }}
          # Attacker-controlled event fields are passed through env, never
          # inlined as ${{ }} in the shell, to prevent script injection.
          # A crafted issue title/body cannot break out of the quoted var.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
          # The AIFactory project id this repo maps to (set as a repo secret).
          AIFACTORY_PROJECT_ID: ${{ secrets.AIFACTORY_PROJECT_ID }}
        run: |
          if [ -n "$AIFACTORY_URL" ]; then
            # RFC-0011 governed tier-driven ingest (#635). The poller is the
            # primary intake; this is the GH-Actions-on-label fast path.
            curl -sf -X POST "$AIFACTORY_URL/api/tasks/from-issue" \
              -H "Authorization: Bearer $AIFACTORY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"project_id\": \"$AIFACTORY_PROJECT_ID\", \"provider\": \"github\", \"repo\": \"$REPO\", \"issue_number\": $ISSUE_NUMBER}"
          else
            gh issue comment "$ISSUE_NUMBER" \
              --body "🏭 **AIFactory**: Issue queued for import. Set the \`AIFACTORY_URL\` repository secret to automate task creation."
          fi
