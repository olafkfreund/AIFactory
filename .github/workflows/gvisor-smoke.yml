name: gVisor live-cluster smoke test

# Brings up a real Kind cluster with gVisor's runsc runtime installed,
# deploys AIFactory with sandbox.gvisor.enabled=true, and validates the
# compatibility table in docs/docs/concepts/gvisor-sandbox.md against a
# workload that genuinely executes under the gVisor kernel.
#
# --- Why this job used to fail (AIFactory#1381) ---
#
# Every run of this workflow's draft failed with:
#
#   FailedCreatePodSandBox: failed to get sandbox runtime:
#   no runtime for "runsc" is configured
#
# The original diagnosis recorded here was that Kind node containers
# impose capability restrictions preventing runsc from launching. That
# diagnosis was wrong. The real cause: the workflow wrote the runsc
# runtime stanza to /etc/containerd/config.d/gvisor.toml, but the Kind
# node image's /etc/containerd/config.toml contains NO `imports`
# directive and the config.d directory does not exist. containerd never
# read the drop-in, so the runsc handler was never registered.
#
# Verified against kindest/node:v1.30.0:
#   * before: crictl runtimes = ['runc', 'test-handler']
#   * after appending the stanza to config.toml directly:
#            crictl runtimes = ['runc', 'runsc', 'test-handler']
#   * a pod with runtimeClassName=gvisor reaches Running and its dmesg
#     reports "Starting gVisor..." — i.e. it really is sandboxed.
#
# gVisor therefore DOES work on GitHub-hosted runners under Kind. The
# job now runs on a real trigger instead of being dispatch-only.
#
# Two guards keep this job from going hollow (passing while measuring
# nothing):
#   1. an explicit assertion that containerd registered the runsc handler
#   2. an explicit wait for the compat-tester pod to reach Running
# Both fail the job rather than letting the pytest fixtures skip.

on:
  # Gate the things whose breakage this job would catch.
  pull_request:
    paths:
      - 'charts/aifactory/**'
      - 'tests/helm/test_live_gvisor.py'
      - 'tests/helm/conftest.py'
      - 'docs/docs/concepts/gvisor-sandbox.md'
      - '.github/workflows/gvisor-smoke.yml'
  # Liveness: catch upstream drift (gVisor releases, Kind node images)
  # even in weeks where nobody touches the paths above.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      gvisor_namespace:
        description: 'Namespace where AIFactory is deployed'
        default: 'aifactory'
        required: false
      compat_pod_name:
        description: 'Name of the compatibility test pod to exec into'
        default: 'gvisor-compat-tester'
        required: false

concurrency:
  group: gvisor-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gvisor-smoke:
    name: gVisor live-cluster smoke (Kind + runsc)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout
      # ------------------------------------------------------------------ #
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ------------------------------------------------------------------ #
      # 2. Install tooling: Helm, kubectl, Kind
      # ------------------------------------------------------------------ #
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "3.16.0"

      - name: Install Kind and kubectl
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
          version: "v0.24.0"
          kubectl_version: "v1.30.0"

      # ------------------------------------------------------------------ #
      # 3. Install gVisor runsc + containerd shim on host runner
      #
      # The gVisor apt package installs both:
      #   runsc                    — the main runtime binary
      #   containerd-shim-runsc-v1 — the containerd shim
      # ------------------------------------------------------------------ #
      - name: Install gVisor runsc + shim on host
        run: |
          set -euo pipefail

          curl -fsSL https://gvisor.dev/archive.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg

          echo "deb [arch=$(dpkg --print-architecture) \
            signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] \
            https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list

          sudo apt-get update -qq
          sudo apt-get install -y runsc

          echo "runsc location: $(which runsc)"
          runsc --version
          echo "shim location: $(which containerd-shim-runsc-v1 2>/dev/null || echo 'not found')"
          dpkg -L runsc 2>/dev/null | head -20

      # ------------------------------------------------------------------ #
      # 4. Create the Kind cluster
      # ------------------------------------------------------------------ #
      - name: Create Kind cluster
        run: |
          cat <<'EOF' | kind create cluster --name gvisor-smoke --config=-
          apiVersion: kind.x-k8s.io/v1alpha4
          kind: Cluster
          nodes:
            - role: control-plane
          EOF

      # ------------------------------------------------------------------ #
      # 5. Configure gVisor inside the Kind node
      # ------------------------------------------------------------------ #
      - name: Install runsc shim in Kind node and configure containerd
        run: |
          set -euo pipefail

          NODE="gvisor-smoke-control-plane"

          docker cp "$(which runsc)" "${NODE}:/usr/local/bin/runsc"
          docker exec "${NODE}" chmod +x /usr/local/bin/runsc

          SHIM="$(which containerd-shim-runsc-v1 2>/dev/null)"
          if [ -n "${SHIM}" ]; then
            docker cp "${SHIM}" "${NODE}:/usr/local/bin/containerd-shim-runsc-v1"
            docker exec "${NODE}" chmod +x /usr/local/bin/containerd-shim-runsc-v1
            echo "Copied containerd-shim-runsc-v1 from ${SHIM}."
          else
            SHIM_DPK="$(dpkg -L runsc 2>/dev/null | grep shim | head -1)"
            if [ -n "${SHIM_DPK}" ]; then
              docker cp "${SHIM_DPK}" "${NODE}:/usr/local/bin/containerd-shim-runsc-v1"
              docker exec "${NODE}" chmod +x /usr/local/bin/containerd-shim-runsc-v1
              echo "Copied containerd-shim-runsc-v1 from dpkg (${SHIM_DPK})."
            else
              echo "ERROR: cannot find containerd-shim-runsc-v1"
              exit 1
            fi
          fi

          docker exec "${NODE}" /usr/local/bin/runsc --version
          docker exec "${NODE}" test -x /usr/local/bin/containerd-shim-runsc-v1 \
            && echo "containerd-shim-runsc-v1 is executable in node."

          # Append DIRECTLY to config.toml. The Kind node image ships no
          # `imports` directive, so a /etc/containerd/config.d drop-in is
          # silently ignored — that was the AIFactory#1381 root cause.
          docker exec "${NODE}" bash -c 'printf "\n%s\n%s\n" \
            "[plugins.\"io.containerd.grpc.v1.cri\".containerd.runtimes.runsc]" \
            "  runtime_type = \"io.containerd.runsc.v1\"" \
            >> /etc/containerd/config.toml'

          docker exec "${NODE}" tail -5 /etc/containerd/config.toml

          docker exec "${NODE}" systemctl restart containerd

          for i in $(seq 1 30); do
            if docker exec "${NODE}" ctr version >/dev/null 2>&1; then
              echo "containerd ready after ${i}s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "ERROR: containerd did not come back within 30s"
              docker exec "${NODE}" journalctl -u containerd --no-pager -n 30 || true
              exit 1
            fi
            sleep 1
          done

      # ------------------------------------------------------------------ #
      # 5b. GUARD: assert containerd registered the runsc handler.
      #
      # Without this, a silently-ignored config (AIFactory#1381) leaves the
      # job green while every meaningful test skips. Fail loudly instead.
      # ------------------------------------------------------------------ #
      - name: Assert containerd registered the runsc runtime
        run: |
          set -euo pipefail
          NODE="gvisor-smoke-control-plane"

          echo "=== CRI-registered runtimes ==="
          docker exec "${NODE}" crictl info \
            | python3 -c 'import sys,json; print("\n".join(json.load(sys.stdin)["config"]["containerd"]["runtimes"]))' \
            | tee /tmp/runtimes.txt

          if ! grep -qx "runsc" /tmp/runtimes.txt; then
            echo "ERROR: containerd did not register the 'runsc' handler."
            echo "The gVisor stanza was not picked up from config.toml."
            docker exec "${NODE}" tail -20 /etc/containerd/config.toml || true
            exit 1
          fi
          echo "OK: containerd registered the runsc handler."

      # ------------------------------------------------------------------ #
      # 6. Create the gVisor RuntimeClass in Kubernetes
      # ------------------------------------------------------------------ #
      - name: Create gVisor RuntimeClass
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: node.k8s.io/v1
          kind: RuntimeClass
          metadata:
            name: gvisor
          handler: runsc
          EOF
          kubectl get runtimeclass gvisor

      # ------------------------------------------------------------------ #
      # 7. Python + test dependencies
      # ------------------------------------------------------------------ #
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Install test dependencies
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r ../../tests/requirements-test.txt
          uv pip install kubernetes==30.1.0

      # ------------------------------------------------------------------ #
      # 8. Pre-load images
      # ------------------------------------------------------------------ #
      - name: Pre-load images into Kind node
        run: |
          docker pull busybox:stable
          kind load docker-image busybox:stable --name gvisor-smoke

          # ubuntu 22.04 with git + curl already installed, so the compat
          # pod needs no apt at runtime and "Running" means "ready".
          docker pull buildpack-deps:jammy-scm
          kind load docker-image buildpack-deps:jammy-scm --name gvisor-smoke

      # ------------------------------------------------------------------ #
      # 9. Helm dep update
      # ------------------------------------------------------------------ #
      - name: Helm dep update
        run: helm dep update charts/aifactory/

      # ------------------------------------------------------------------ #
      # 10. Deploy AIFactory with gVisor enabled (RuntimeClass wiring test)
      # ------------------------------------------------------------------ #
      - name: Helm install AIFactory with gVisor enabled
        run: |
          helm install aifactory charts/aifactory/ \
            --namespace aifactory \
            --create-namespace \
            --set sandbox.gvisor.enabled=true \
            --set postgres.bundled=true \
            --set postgres.externalSecretName=aifactory-db \
            --set externalSecrets.enabled=false \
            --set oidc.enabled=false \
            --set workspaces.enabled=true \
            --set image.repository=busybox \
            --set image.tag=stable \
            --set image.pullPolicy=IfNotPresent \
            --timeout=5m \
            --wait=false

      # ------------------------------------------------------------------ #
      # 10b. GUARD: launch the compat-tester pod and wait for it to run.
      #
      # tests/helm/test_live_gvisor.py's `compat_pod` fixture skips every
      # exec-based compatibility test when this pod is not Running. The
      # merged workflow never created it, so all five compat tests skipped
      # unconditionally — a pass-shaped empty measurement. Create it here
      # and FAIL if it does not start, so a broken sandbox cannot read as
      # a green run.
      # ------------------------------------------------------------------ #
      - name: Launch gVisor compatibility test pod
        env:
          NS: ${{ github.event.inputs.gvisor_namespace || 'aifactory' }}
          POD: ${{ github.event.inputs.compat_pod_name || 'gvisor-compat-tester' }}
        run: |
          set -euo pipefail

          kubectl apply -n "${NS}" -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${POD}
          spec:
            runtimeClassName: gvisor
            restartPolicy: Never
            containers:
              - name: compat
                image: buildpack-deps:jammy-scm
                imagePullPolicy: IfNotPresent
                command: ["sleep", "1800"]
          EOF

          if ! kubectl wait -n "${NS}" --for=condition=Ready \
               "pod/${POD}" --timeout=180s; then
            echo "ERROR: compat pod did not reach Ready under gVisor."
            kubectl describe pod -n "${NS}" "${POD}" || true
            exit 1
          fi

          # Prove the workload really executed under the gVisor kernel and
          # not silently under runc.
          echo "=== dmesg inside the sandbox ==="
          kubectl exec -n "${NS}" "${POD}" -- dmesg > /tmp/dmesg.txt 2>&1 || true
          head -5 /tmp/dmesg.txt
          if ! grep -qi "gvisor" /tmp/dmesg.txt; then
            echo "ERROR: pod is NOT running under gVisor (dmesg lacks the"
            echo "gVisor banner) — it silently fell back to runc."
            exit 1
          fi
          echo "OK: workload is running under the gVisor kernel."

      # ------------------------------------------------------------------ #
      # 11. Run the live-cluster gVisor tests
      #
      # RuntimeClass wiring tests (test_runtime_class_exists_in_cluster,
      # test_pods_have_gvisor_runtimeclass) run against the Kubernetes
      # API — they pass without needing a running gVisor container.
      #
      # Exec-based compatibility tests (git, curl, compat matrix) use the
      # GVISOR_COMPAT_POD fixture. When the pod is not Running (expected
      # in the Kind-with-Docker setup), the fixture calls pytest.skip()
      # automatically with a clear diagnostic message.
      # ------------------------------------------------------------------ #
      - name: Pytest gVisor live-cluster suite
        env:
          KUBECONFIG: /home/runner/.kube/config
          GVISOR_NAMESPACE: ${{ github.event.inputs.gvisor_namespace || 'aifactory' }}
          GVISOR_COMPAT_POD: ${{ github.event.inputs.compat_pod_name || 'gvisor-compat-tester' }}
          CI: "true"
        run: |
          apps/backend/.venv/bin/pytest \
            tests/helm/test_live_gvisor.py \
            -m gvisor_live \
            -v \
            --timeout=120

      # ------------------------------------------------------------------ #
      # 12. Diagnostics on failure
      # ------------------------------------------------------------------ #
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== Pod list ==="
          kubectl get pods -n aifactory -o wide || true

          echo "=== RuntimeClass ==="
          kubectl get runtimeclass gvisor -o yaml || true

          echo "=== gVisor config in Kind node ==="
          docker exec gvisor-smoke-control-plane \
            cat /etc/containerd/config.d/gvisor.toml 2>/dev/null || true

          echo "=== containerd log ==="
          docker exec gvisor-smoke-control-plane \
            bash -c 'journalctl -u containerd --no-pager -n 50 2>/dev/null \
              || cat /var/log/containerd.log 2>/dev/null || true'

      # ------------------------------------------------------------------ #
      # 13. Cleanup
      # ------------------------------------------------------------------ #
      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name gvisor-smoke
