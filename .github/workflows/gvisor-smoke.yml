name: gVisor live-cluster smoke test

# This job brings up a real Kind cluster with gVisor's runsc runtime
# installed, deploys AIFactory with sandbox.gvisor.enabled=true, and
# validates the compatibility table in docs/docs/concepts/gvisor-sandbox.md
# against reality. It is the CI materialisation of issue #170.
#
# Option chosen: gVisor-with-kind on github-hosted runners (Option 2).
# GitHub-hosted ubuntu-22.04 runners are full VMs (not containers), so we
# have unrestricted kernel access — we can install runsc on the host, then
# configure containerd inside the Kind node container via docker exec.
#
# Architecture:
#   1. Helm install tests  — deploy AIFactory chart with gvisor.enabled=true,
#      verify the pod spec carries runtimeClassName=gvisor.
#   2. Compatibility tests — run a dedicated ubuntu:22.04 test pod under
#      gVisor (kubectl run + runtimeClassName: gvisor) and exec commands
#      into it to validate the compat table claims.
#
# gVisor-in-Kind notes:
#   Kind nodes run as Docker containers. gVisor requires the containerd shim
#   binary (containerd-shim-runsc-v1) and the runtime binary (runsc) to be
#   present INSIDE the Kind node container. The containerd config must also
#   register the runtime. A 5-second sleep after containerd restart is not
#   sufficient — we poll until containerd can list plugins.

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
  # Allow operators to trigger manually, e.g. before a production rollout.
  workflow_dispatch:

# Cancel in-flight runs on the same ref to avoid wasting runner minutes
# when rapid pushes arrive (e.g. fixup commits during review).
concurrency:
  group: gvisor-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gvisor-smoke:
    name: gVisor live-cluster smoke (Kind + runsc)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout
      # ------------------------------------------------------------------ #
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. Install tooling: Helm, kubectl, Kind
      # ------------------------------------------------------------------ #
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.16.0"

      - name: Install Kind and kubectl
        uses: helm/kind-action@v1.10.0
        with:
          install_only: true
          version: "v0.24.0"
          kubectl_version: "v1.30.0"

      # ------------------------------------------------------------------ #
      # 3. Install gVisor runsc + containerd shim on host runner
      #
      # The gVisor apt package installs both:
      #   runsc                    — the main runtime binary
      #   containerd-shim-runsc-v1 — the containerd shim
      # Both need to be copied into the Kind node container in step 5.
      # ------------------------------------------------------------------ #
      - name: Install gVisor runsc + shim on host
        run: |
          set -euo pipefail

          curl -fsSL https://gvisor.dev/archive.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg

          echo "deb [arch=$(dpkg --print-architecture) \
            signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] \
            https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list

          sudo apt-get update -qq
          sudo apt-get install -y runsc

          # Confirm both binaries are installed.
          echo "runsc location: $(which runsc)"
          runsc --version
          echo "shim location: $(which containerd-shim-runsc-v1 2>/dev/null || echo 'not found')"
          # Show all files installed by the runsc package for diagnostics.
          dpkg -L runsc 2>/dev/null | head -20

      # ------------------------------------------------------------------ #
      # 4. Create the Kind cluster
      # ------------------------------------------------------------------ #
      - name: Create Kind cluster
        run: |
          cat <<'EOF' | kind create cluster --name gvisor-smoke --config=-
          apiVersion: kind.x-k8s.io/v1alpha4
          kind: Cluster
          nodes:
            - role: control-plane
          EOF

      # ------------------------------------------------------------------ #
      # 5. Configure gVisor inside the Kind node
      #
      # The Kind node is a Docker container. We need to:
      #   a. Copy the runsc binary and containerd shim into the container.
      #   b. Write a TOML snippet registering the runsc runtime handler.
      #   c. Restart containerd and wait for it to accept the new config.
      #
      # TOML requirement: section headers [plugins."..."] must start at
      # column 0. We use printf rather than a here-doc inside bash -c to
      # avoid leading-whitespace contamination from shell indentation.
      # ------------------------------------------------------------------ #
      - name: Install runsc shim in Kind node and configure containerd
        run: |
          set -euo pipefail

          NODE="gvisor-smoke-control-plane"

          # Copy runtime binaries from host into the Kind node container.
          docker cp "$(which runsc)" "${NODE}:/usr/local/bin/runsc"
          docker exec "${NODE}" chmod +x /usr/local/bin/runsc

          # Copy the containerd shim binary. This is required for containerd
          # to spawn runsc-sandboxed containers without a ContainerCreating
          # timeout. Without it, containerd cannot find the shim and hangs.
          SHIM="$(which containerd-shim-runsc-v1 2>/dev/null)"
          if [ -n "${SHIM}" ]; then
            docker cp "${SHIM}" "${NODE}:/usr/local/bin/containerd-shim-runsc-v1"
            docker exec "${NODE}" chmod +x /usr/local/bin/containerd-shim-runsc-v1
            echo "Copied containerd-shim-runsc-v1 from ${SHIM}."
          else
            # Fallback: find it via dpkg manifest.
            SHIM_DPK="$(dpkg -L runsc 2>/dev/null | grep shim | head -1)"
            if [ -n "${SHIM_DPK}" ]; then
              docker cp "${SHIM_DPK}" "${NODE}:/usr/local/bin/containerd-shim-runsc-v1"
              docker exec "${NODE}" chmod +x /usr/local/bin/containerd-shim-runsc-v1
              echo "Copied containerd-shim-runsc-v1 from dpkg (${SHIM_DPK})."
            else
              echo "ERROR: cannot find containerd-shim-runsc-v1"
              exit 1
            fi
          fi

          # Confirm runsc is executable inside the node container.
          docker exec "${NODE}" /usr/local/bin/runsc --version

          # Verify the shim binary exists and is executable (size > 0).
          # We do NOT invoke it directly — the shim binary is called by
          # containerd only and returns non-zero when called standalone.
          docker exec "${NODE}" test -x /usr/local/bin/containerd-shim-runsc-v1 \
            && echo "containerd-shim-runsc-v1 is executable in node." \
            || echo "WARNING: containerd-shim-runsc-v1 check failed"

          # Write the gVisor runtime block to a containerd drop-in config.
          # /etc/containerd/config.d/ drop-ins are supported in containerd
          # 1.6+ and all Kind node images for kind v0.21+. We use printf to
          # guarantee no leading whitespace on the TOML section headers.
          docker exec "${NODE}" mkdir -p /etc/containerd/config.d
          docker exec "${NODE}" bash -c 'printf "%s\n" \
            "[plugins.\"io.containerd.grpc.v1.cri\".containerd.runtimes.runsc]" \
            "  runtime_type = \"io.containerd.runsc.v1\"" \
            "[plugins.\"io.containerd.grpc.v1.cri\".containerd.runtimes.runsc.options]" \
            "  TypeUrl = \"io.containerd.runsc.v1.options\"" \
            > /etc/containerd/config.d/gvisor.toml'

          # Show the written config for diagnostics.
          docker exec "${NODE}" cat /etc/containerd/config.d/gvisor.toml

          # Restart containerd so the new runtime registration is active.
          docker exec "${NODE}" systemctl restart containerd

          # Poll until containerd comes back up (usually 3-8 seconds).
          for i in $(seq 1 30); do
            if docker exec "${NODE}" ctr version >/dev/null 2>&1; then
              echo "containerd ready after ${i}s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "ERROR: containerd did not come back within 30s"
              docker exec "${NODE}" journalctl -u containerd --no-pager -n 30 || true
              exit 1
            fi
            sleep 1
          done

      # ------------------------------------------------------------------ #
      # 6. Create the gVisor RuntimeClass in Kubernetes
      # ------------------------------------------------------------------ #
      - name: Create gVisor RuntimeClass
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: node.k8s.io/v1
          kind: RuntimeClass
          metadata:
            name: gvisor
          handler: runsc
          EOF
          kubectl get runtimeclass gvisor

      # ------------------------------------------------------------------ #
      # 7. Python + test dependencies
      # ------------------------------------------------------------------ #
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install test dependencies
        working-directory: apps/backend
        run: |
          uv venv
          uv pip install -r ../../tests/requirements-test.txt
          uv pip install kubernetes==30.1.0

      # ------------------------------------------------------------------ #
      # 8. Pre-load images into Kind node
      # ------------------------------------------------------------------ #
      - name: Pre-load images into Kind node
        run: |
          docker pull busybox:stable
          docker pull ubuntu:22.04
          kind load docker-image busybox:stable --name gvisor-smoke
          kind load docker-image ubuntu:22.04 --name gvisor-smoke

      # ------------------------------------------------------------------ #
      # 9. Helm dep update
      # ------------------------------------------------------------------ #
      - name: Helm dep update
        run: helm dep update charts/aifactory/

      # ------------------------------------------------------------------ #
      # 10. Deploy AIFactory with gVisor enabled
      #
      # Goal: validate that sandbox.gvisor.enabled=true wires
      # runtimeClassName: gvisor onto the live pod spec. We use a
      # minimal busybox stub that does not need any real credentials.
      #
      # postgres.externalSecretName must not be empty — the bundled
      # postgres template creates a K8s Secret with that name.
      # ------------------------------------------------------------------ #
      - name: Helm install AIFactory with gVisor enabled
        run: |
          helm install aifactory charts/aifactory/ \
            --namespace aifactory \
            --create-namespace \
            --set sandbox.gvisor.enabled=true \
            --set postgres.bundled=true \
            --set postgres.externalSecretName=aifactory-db \
            --set externalSecrets.enabled=false \
            --set oidc.enabled=false \
            --set workspaces.enabled=true \
            --set image.repository=busybox \
            --set image.tag=stable \
            --set image.pullPolicy=IfNotPresent \
            --timeout=5m \
            --wait=false

      # ------------------------------------------------------------------ #
      # 11. Wait for AIFactory pod to be scheduled
      # ------------------------------------------------------------------ #
      - name: Wait for AIFactory pod Running or ContainerCreating
        run: |
          echo "Waiting for aifactory pod phase..."
          for i in $(seq 1 60); do
            STATUS=$(kubectl get pods -n aifactory \
              -l app.kubernetes.io/name=aifactory \
              -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "")
            REASON=$(kubectl get pods -n aifactory \
              -l app.kubernetes.io/name=aifactory \
              -o jsonpath='{.items[0].status.containerStatuses[0].state.waiting.reason}' \
              2>/dev/null || echo "")
            echo "  attempt ${i}/60: phase=${STATUS:-<none>} reason=${REASON:-<none>}"
            if [ "${STATUS}" = "Running" ] || [ "${REASON}" = "ContainerCreating" ]; then
              echo "Pod is scheduled (phase=${STATUS}, reason=${REASON})."
              kubectl get pods -n aifactory -o wide
              break
            fi
            if [ $i -eq 60 ]; then
              echo "WARNING: pod did not become Running/ContainerCreating in 300s"
              kubectl get pods -n aifactory -o wide || true
              kubectl describe pod -n aifactory \
                -l app.kubernetes.io/name=aifactory | tail -30 || true
            fi
            sleep 5
          done

      # ------------------------------------------------------------------ #
      # 12. Launch gVisor compatibility test pod
      #
      # This ubuntu:22.04 pod runs under gVisor (runtimeClassName: gvisor).
      # We install git and curl inside it to validate the compat table.
      # A separate pod is used so the compatibility tests don't depend on
      # the AIFactory container image having those tools.
      # ------------------------------------------------------------------ #
      - name: Launch gVisor compatibility test pod
        run: |
          kubectl run gvisor-compat-tester \
            --image=ubuntu:22.04 \
            --namespace=aifactory \
            --restart=Never \
            --overrides='{"spec":{"runtimeClassName":"gvisor"}}' \
            -- sleep 3600

          echo "Waiting for compat-tester pod (ContainerCreating / Running)..."
          for i in $(seq 1 72); do
            PHASE=$(kubectl get pod gvisor-compat-tester -n aifactory \
              -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            REASON=$(kubectl get pod gvisor-compat-tester -n aifactory \
              -o jsonpath='{.status.containerStatuses[0].state.waiting.reason}' \
              2>/dev/null || echo "")
            echo "  attempt ${i}/72: phase=${PHASE:-<none>} reason=${REASON:-<none>}"
            if [ "${PHASE}" = "Running" ]; then
              echo "Compat tester pod is Running."
              break
            fi
            if [ $i -eq 72 ]; then
              echo "ERROR: compat-tester pod did not reach Running within 360s"
              echo "=== pod describe ==="
              kubectl describe pod gvisor-compat-tester -n aifactory | tail -40 || true
              echo "=== containerd log ==="
              docker exec gvisor-smoke-control-plane \
                journalctl -u containerd --no-pager -n 50 2>/dev/null || true
              echo "=== runsc config ==="
              docker exec gvisor-smoke-control-plane \
                cat /etc/containerd/config.d/gvisor.toml 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

          # Install git and curl inside the pod (needed for compat tests).
          kubectl exec -n aifactory gvisor-compat-tester -- \
            apt-get update -qq 2>&1 | tail -3
          kubectl exec -n aifactory gvisor-compat-tester -- \
            apt-get install -y -qq git curl 2>&1 | tail -3

      # ------------------------------------------------------------------ #
      # 13. Run the live-cluster gVisor smoke tests
      # ------------------------------------------------------------------ #
      - name: Pytest gVisor live-cluster suite
        env:
          KUBECONFIG: /home/runner/.kube/config
          GVISOR_NAMESPACE: aifactory
          GVISOR_COMPAT_POD: gvisor-compat-tester
          CI: "true"
        run: |
          apps/backend/.venv/bin/pytest \
            tests/helm/test_live_gvisor.py \
            -m gvisor_live \
            -v \
            --timeout=120

      # ------------------------------------------------------------------ #
      # 14. Collect diagnostics on failure
      # ------------------------------------------------------------------ #
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== Pod list ==="
          kubectl get pods -n aifactory -o wide || true

          echo "=== Pod descriptions ==="
          kubectl describe pods -n aifactory || true

          echo "=== gVisor compat pod logs ==="
          kubectl logs -n aifactory gvisor-compat-tester --tail=50 || true

          echo "=== RuntimeClass ==="
          kubectl get runtimeclass gvisor -o yaml || true

          echo "=== Kind node containerd status ==="
          docker exec gvisor-smoke-control-plane \
            systemctl status containerd --no-pager || true

          echo "=== Kind node containerd gvisor config ==="
          docker exec gvisor-smoke-control-plane \
            cat /etc/containerd/config.d/gvisor.toml 2>/dev/null || true

          echo "=== Kind node containerd recent log ==="
          docker exec gvisor-smoke-control-plane \
            journalctl -u containerd --no-pager -n 80 2>/dev/null || true

          echo "=== runsc version in node ==="
          docker exec gvisor-smoke-control-plane \
            /usr/local/bin/runsc --version 2>/dev/null || true

          echo "=== shim version in node ==="
          docker exec gvisor-smoke-control-plane \
            /usr/local/bin/containerd-shim-runsc-v1 --version 2>/dev/null || true

      # ------------------------------------------------------------------ #
      # 15. Cleanup
      # ------------------------------------------------------------------ #
      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name gvisor-smoke
