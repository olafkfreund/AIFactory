name: Review Copilot Agent PRs

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  aifactory-review:
    # Only run when the Copilot cloud agent opens or updates a PR
    if: github.actor == 'copilot-swe-agent[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      models: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notify AIFactory of Copilot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIFACTORY_URL: ${{ secrets.AIFACTORY_URL }}
          AIFACTORY_TOKEN: ${{ secrets.AIFACTORY_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          if [ -n "$AIFACTORY_URL" ]; then
            # Trigger AIFactory's review engine on this PR
            curl -sf -X POST "$AIFACTORY_URL/api/github/prs/$PR_NUMBER/review" \
              -H "Authorization: Bearer $AIFACTORY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"repo\": \"${{ github.repository }}\", \"pr_number\": $PR_NUMBER}"
          else
            # Fallback: inline Copilot CLI review when AIFactory is not reachable
            npm install -g @github/copilot 2>/dev/null || true
            copilot -p "Review this PR for correctness, security, and code quality. Post a summary review comment." \
              --allow-all-tools --no-color \
              --add-dir "${{ github.workspace }}" || true
          fi
