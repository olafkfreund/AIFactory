name: Review Copilot Agent PRs

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  aifactory-review:
    # Identity/membership gate instead of trusting the `[bot]` actor
    # suffix (CVE-2025-66032: a malicious PR can spoof or ride a
    # `[bot]`-suffixed actor). Only review PRs whose author is a trusted
    # member of the repo — OWNER/MEMBER/COLLABORATOR — so an all-tools
    # agent never runs over an untrusted fork's diff.
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      models: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notify AIFactory of Copilot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIFACTORY_URL: ${{ secrets.AIFACTORY_URL }}
          AIFACTORY_TOKEN: ${{ secrets.AIFACTORY_TOKEN }}
          # Event fields passed via env, never inlined as ${{ }} in shell.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$AIFACTORY_URL" ]; then
            # Trigger AIFactory's review engine on this PR
            curl -sf -X POST "$AIFACTORY_URL/api/github/prs/$PR_NUMBER/review" \
              -H "Authorization: Bearer $AIFACTORY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"repo\": \"$REPO\", \"pr_number\": $PR_NUMBER}"
          else
            # Fallback: inline Copilot CLI review when AIFactory is not
            # reachable. Tools are scoped to the minimum the reviewer needs
            # (read-only shell + GitHub review API) — `--allow-all-tools` is
            # NOT passed, so the agent cannot run arbitrary write tools over
            # the checked-out PR content.
            npm install -g @github/copilot 2>/dev/null || true
            copilot -p "Review this PR for correctness, security, and code quality. Post a summary review comment." \
              --allow-tool 'shell(git diff)' \
              --allow-tool 'shell(git log)' \
              --no-color \
              --add-dir "${{ github.workspace }}" || true
          fi
