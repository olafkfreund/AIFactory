name: Deploy (CD → ArgoCD)

# Continuous deployment: every push to main builds an immutable image,
# pushes it to GHCR, then bumps the image tag in the factory-gitops repo.
# ArgoCD (auto-sync) redeploys aifactory on the p510 k3d cluster.
#
# FOUR JOBS, ONE GITOPS COMMIT (#1465). The `-nix` build image used to be built
# and pinned by build-nix.yml, which triggers on the same push. Two workflows
# therefore wrote two pins for this app minutes apart (the `-nix` build is ~9-11
# min vs ~4-5 here), ArgoCD synced each, and the SECOND rollout restarted pods
# while the first deploy's build was still running -- killing it mid-flight.
# So: `changes` decides whether the `-nix` image needs rebuilding, `build-push`
# and `build-nix` run in parallel, and `pin` writes BOTH values in ONE commit.
# build-nix.yml keeps only its workflow_dispatch path for a manual rebuild.
#
# One-time setup: add a repo secret GITOPS_PAT — a token (fine-grained PAT
# is best) with `contents: write` on olafkfreund/factory-gitops:
#   gh secret set GITOPS_PAT --repo olafkfreund/AIFactory
#
# This is separate from release.yml (which cuts semver releases + SBOM on a
# version bump). deploy.yml ships main continuously under sha-<short> tags.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      # Root-level markdown only (README, CHANGELOG). NOT '**/*.md': agent
      # prompts (apps/backend/prompts/*.md), the BMad persona templates and
      # the skills catalogue (skills/**/*.md) are baked into the runtime
      # image, so a change to one of them must ship. '*' does not cross '/'
      # here, so nested markdown still triggers a deploy. See Factory#454.
      - '*.md'
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write        # cosign keyless via GitHub OIDC (Factory#430)

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aifactory
  GITOPS_REPO: olafkfreund/factory-gitops
  GITOPS_PATH: apps/aifactory/manifests


jobs:
  # Does the `-nix` build image need rebuilding? Same paths build-nix.yml used to
  # filter on. Fail SAFE: anything we cannot diff (dispatch, a first push, a
  # force-push, any git error) rebuilds, because a stale AIFACTORY_BUILD_IMAGE is
  # the drift #856 automated away.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nix: ${{ steps.decide.outputs.nix }}
    steps:
      - name: Checkout AIFactory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether to rebuild the -nix image
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "push" ] \
             || [ -z "${BEFORE:-}" ] \
             || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "cannot diff (event=${{ github.event_name }}, before=${BEFORE:-unset}) — rebuilding"
            echo "nix=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "${BEFORE}" "${{ github.sha }}" -- Dockerfile 'apps/backend/**' || echo FAILED)
          if [ "$CHANGED" = "FAILED" ]; then
            echo "git diff failed — rebuilding"
            echo "nix=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$CHANGED" ]; then
            echo "-nix inputs changed:"; echo "$CHANGED"
            echo "nix=true" >> "$GITHUB_OUTPUT"
          else
            echo "no Dockerfile/apps/backend change — skipping the -nix build"
            echo "nix=false" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tags.outputs.sha }}
    steps:
      - name: Checkout AIFactory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute tags
        id: tags
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Prefer GHCR_PAT (write:packages PAT) so pushes survive even if the
          # aifactory package's repo linkage ever changes; fall back to the
          # default token. Mirrors PFactory/TFactory (#511).
          password: "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}"

      # amd64 only — the k3d cluster on p510 is amd64, and the frontend
      # `vite build` fails under QEMU-emulated arm64 (see release.yml).
      # Rebuild the base-security layer at most once a day. Without a
      # daily-changing build arg the `apt-get upgrade` layer is served from
      # the build cache indefinitely, so Debian security fixes never reach the
      # image (CFactory#440).
      - name: Compute security-refresh token
        run: echo "SECURITY_REFRESH=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build + push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          # Pin the runtime stage: the Dockerfile now has a later
          # ``build-runtime`` stage (the -nix variant, RFC-0017 #190). The
          # deployed app must stay the lean runtime image, not the nix-baked one.
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            SECURITY_REFRESH=${{ env.SECURITY_REFRESH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------------------
      # Sign the image THIS workflow ships (Factory#430).
      #
      # release.yml already signed :vX.Y.Z, but nothing in the cluster runs a
      # semver tag — ArgoCD is pinned to the :sha-<short> tag produced right
      # above. So the Kyverno verify-factory-image-signatures policy reported
      # `fail: unverified image` for 100% of running Pods while looking, on
      # every artefact except the outcome, like a working control.
      #
      # Sign by DIGEST, not tag: cosign signatures are digest-keyed, so this one
      # signature covers both :sha-<short> and :latest.
      # ----------------------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image (cosign keyless via Sigstore + GitHub OIDC)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      # Not decoration: without it a broken signing step fails open and we are
      # back to an unverifiable image that looks shipped. This is the same
      # assertion Kyverno makes at admission, run at build time.
      - name: Verify signature (self-test)
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository_owner }}/AIFactory/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      # The self-test above proves cosign can read what cosign wrote. This
      # proves the CLUSTER can. See the script header and Factory#804.
      - name: Assert the signature is where Kyverno looks (Factory#804)
        run: ./.github/scripts/assert-signature-location.sh "${IMAGE}" "${{ steps.build.outputs.digest }}"


  # The `-nix` build image (build Jobs run this one). Body moved verbatim from
  # build-nix.yml, minus its pin steps -- `pin` below writes that value.
  build-nix:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tags.outputs.sha }}-nix
    timeout-minutes: 120
    steps:
      - name: Checkout AIFactory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute tags
        id: tags
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}"

      # amd64 only — the substrate (factory-runner-nix) is amd64-only and the
      # p510 k3d cluster is amd64. The gha cache (scope=aifactory-nix) lets a
      # re-run reuse the heavy /nix/store COPY layer instead of re-pulling it.
      # Rebuild the base-security layer at most once a day. Without a
      # daily-changing build arg the `apt-get upgrade` layer is served from
      # the build cache indefinitely, so Debian security fixes never reach the
      # image (CFactory#440).
      - name: Compute security-refresh token
        run: echo "SECURITY_REFRESH=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build + push -nix build image (target build-runtime)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: build-runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}-nix
            ${{ env.IMAGE }}:latest-nix
          build-args: |
            SECURITY_REFRESH=${{ env.SECURITY_REFRESH }}
          cache-from: type=gha,scope=aifactory-nix
          cache-to: type=gha,mode=max,scope=aifactory-nix

      # Factory#430 — the Kyverno policy matches `ghcr.io/olafkfreund/aifactory:*`,
      # which includes the `-nix` tags published here. Build Jobs run this image,
      # so it is code execution and must be signed like any other.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign -nix image (cosign keyless via Sigstore + GitHub OIDC)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Verify signature (self-test)
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository_owner }}/AIFactory/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      # Proves the CLUSTER can read it, not just cosign. See Factory#804.
      - name: Assert the signature is where Kyverno looks (Factory#804)
        run: ./.github/scripts/assert-signature-location.sh "${IMAGE}" "${{ steps.build.outputs.digest }}"


  # ONE commit for both pins (#1465). Runs when the app image built and the
  # `-nix` job did not FAIL: skipped is normal (its inputs did not change) and
  # pins the app image alone, exactly as before. A failed `-nix` build writes
  # nothing -- half a pin is worse than a red deploy.
  #
  # Only main pins. A workflow_dispatch from a branch still builds and signs, so
  # the workflow can be exercised end to end without repinning production.
  pin:
    needs: [changes, build-push, build-nix]
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && needs.build-push.result == 'success'
      && needs.build-nix.result != 'failure'
      && needs.build-nix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout factory-gitops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Install kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0

      - name: Bump image tag in gitops
        working-directory: gitops/${{ env.GITOPS_PATH }}
        run: kustomize edit set image ${{ env.IMAGE }}=${{ env.IMAGE }}:${{ needs.build-push.outputs.sha }}

      # Only when the -nix image was actually rebuilt. Replaces the tag portion
      # of the pinned build-image env value; the value is a fixed inline-map line.
      - name: Pin AIFACTORY_BUILD_IMAGE to the new -nix tag
        if: needs.build-nix.result == 'success'
        working-directory: gitops/${{ env.GITOPS_PATH }}
        env:
          TAG: ${{ needs.build-nix.outputs.tag }}
        run: |
          sed -i -E \
            's|(AIFACTORY_BUILD_IMAGE, value: "ghcr\.io/olafkfreund/aifactory:)sha-[0-9a-f]+-nix(")|\1'"${TAG}"'\2|' \
            manifests.yaml
          echo "Pinned AIFACTORY_BUILD_IMAGE -> :${TAG}"
          grep -n 'AIFACTORY_BUILD_IMAGE' manifests.yaml

      - name: Commit + push both pins
        working-directory: gitops
        env:
          SHA: ${{ needs.build-push.outputs.sha }}
          NIX_TAG: ${{ needs.build-nix.outputs.tag }}
          NIX_RESULT: ${{ needs.build-nix.result }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            # "No change" had two causes and treated both as success: already
            # pinned to this sha (fine), or the edit matched nothing (a broken
            # bump reporting green). Tell them apart.
            if grep -rq "${{ env.IMAGE }}:${SHA}" "${{ env.GITOPS_PATH }}/"; then
              echo "gitops already pinned to ${SHA}; nothing to do."
              exit 0
            fi
            echo "::error::the image edit changed nothing AND the pin is not ${SHA}."
            echo "::error::The kustomize pattern no longer matches this manifest."
            exit 1
          fi

          BODY="From olafkfreund/AIFactory@${{ github.sha }}"
          if [ "${NIX_RESULT}" = "success" ]; then
            BODY="${BODY}"$'\n'"Also pins AIFACTORY_BUILD_IMAGE -> ${NIX_TAG} (#856)"
          fi

          git add "${{ env.GITOPS_PATH }}/"
          git commit -m "cd(aifactory): ${SHA} [skip ci]

          ${BODY}"

          # Factory#527: other services (and factory-runners' CD) bump this same
          # repo, so two writers in flight race and the loser gets `! [rejected]`.
          # A full checkout means a rebase is clean: our single commit replays on
          # top of whoever landed first, preserving their bump.
          pushed=""
          for attempt in 1 2 3 4 5; do
            if git push --quiet; then
              pushed="yes"
              break
            fi
            echo "push rejected (attempt ${attempt}/5) - another service bumped first; rebasing"
            git pull --rebase --quiet origin HEAD
            sleep $(( attempt * 3 ))
          done

          if [ -z "$pushed" ]; then
            echo "::error::could not push the pins after 5 attempts (Factory#527)."
            exit 1
          fi

          # A deploy that cannot prove the pin moved must not report success
          # (Factory#433). Re-read from the remote rather than trusting the push.
          git fetch --quiet origin
          if git show "origin/main:${{ env.GITOPS_PATH }}/kustomization.yaml" | grep -q "${SHA}"; then
            echo "verified: factory-gitops pins ${SHA}"
          else
            echo "::error::pushed, but factory-gitops does not pin ${SHA}."
            exit 1
          fi

          if [ "${NIX_RESULT}" = "success" ]; then
            if git show "origin/main:${{ env.GITOPS_PATH }}/manifests.yaml" | grep -q "${NIX_TAG}"; then
              echo "verified: factory-gitops pins AIFACTORY_BUILD_IMAGE ${NIX_TAG}"
            else
              echo "::error::pushed, but AIFACTORY_BUILD_IMAGE is not ${NIX_TAG}."
              exit 1
            fi
          fi

      - name: Summary
        env:
          SHA: ${{ needs.build-push.outputs.sha }}
          NIX_TAG: ${{ needs.build-nix.outputs.tag }}
          NIX_RESULT: ${{ needs.build-nix.result }}
        run: |
          {
            echo "### Deployed aifactory \`${SHA}\`"
            echo "Image: \`${{ env.IMAGE }}:${SHA}\`"
            if [ "${NIX_RESULT}" = "success" ]; then
              echo "Build image: \`${{ env.IMAGE }}:${NIX_TAG}\`"
            else
              echo "Build image: unchanged (the -nix build was skipped)"
            fi
            echo "One factory-gitops commit → ONE ArgoCD sync (#1465)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Post-deploy PARR seam smoke check (Factory#44). Steps-based on purpose: a
  # cross-repo reusable-workflow `uses:` call fails the deploy at startup, so we
  # check out the Factory harness and run it directly.
  #
  # SOFT ABOUT SEAMS, HARD ABOUT ITSELF (Factory#471). `continue-on-error` used
  # to sit on the job, which meant it swallowed everything - including the guard
  # step that exits when FACTORY_TOKEN is missing. So a rotated or deleted secret
  # produced a green post-deploy check that had probed nothing at all, which is
  # indistinguishable from a healthy fleet.
  #
  # It now sits on the probe step alone. A regressed seam still shows up as a
  # failed-but-ignored step and cannot break or roll back a deploy that has
  # already happened - that intent is unchanged. A missing token is a different
  # animal: it is never transient, no re-run fixes it, and it means the check did
  # not run. That fails the job (standards/coding-standards.md rule 4.7).
  seam-check:
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Factory seam harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: olafkfreund/Factory
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require the fleet token (fail closed, rule 4.7)
        # Deliberately NOT continue-on-error, and deliberately its own step. This
        # is the "should have run and could not" case: deploy.yml only ever runs
        # on push to main in this repo, where secrets are always available, so an
        # empty token is misconfiguration - never the by-design fork-PR case
        # where GitHub withholds secrets and no amount of fixing would help.
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: |
          if [ -z "${FACTORY_TOKEN}" ]; then
            echo "::error::FACTORY_TOKEN is not set; the post-deploy seam check did not run."
            echo "Set it with: gh secret set FACTORY_TOKEN --repo ${{ github.repository }}"
            echo "Failing rather than skipping (Factory#471): a green check that"
            echo "probed nothing looks exactly like a healthy fleet."
            exit 1
          fi

      - name: PARR seam smoke regression
        # Soft: a regressed seam shows as failed-but-ignored and does not break a
        # deploy that already shipped. The exit code stays real so the failure is
        # visible - Factory#416 was a probe that crashed before its first request
        # on every deploy and still reported green.
        continue-on-error: true
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          PFACTORY_API: ${{ vars.PFACTORY_API }}
          AIFACTORY_API: ${{ vars.AIFACTORY_API }}
          TFACTORY_API: ${{ vars.TFACTORY_API }}
          CFACTORY_API: ${{ vars.CFACTORY_API }}
          # CFactory is behind oauth2-proxy, which rejects an opaque token
          # with a 302 to Keycloak. These let the probe mint a short-lived
          # service-account JWT instead (Factory#420/#423). Absent them the
          # cockpit seam reports SKIP, not a false pass.
          PARR_OIDC_TOKEN_URL: ${{ vars.PARR_OIDC_TOKEN_URL }}
          CFACTORY_OIDC_CLIENT_ID: ${{ vars.CFACTORY_OIDC_CLIENT_ID }}
          CFACTORY_OIDC_CLIENT_SECRET: ${{ secrets.CFACTORY_OIDC_CLIENT_SECRET }}
        run: python3 scripts/parr_regression.py --smoke
