name: Release

# Auto-tag + GitHub release when package.json version changes on main.
#
# Workflow:
#   1. Bump version on a feature/release branch: `node scripts/bump-version.js <version>`
#   2. Add a matching `## <version>` section to CHANGELOG.md
#   3. PR to main, merge
#   4. This workflow:
#      - Detects the version change vs the previous main commit
#      - Validates CHANGELOG.md has a `## <version>` entry
#      - Creates an annotated git tag `v<version>`
#      - Creates a GitHub release with notes extracted from CHANGELOG.md
#
# If the merge doesn't bump the version, the job exits early (no-op).

on:
  push:
    branches: [main]
  # #1583: attest an EXISTING release. cosign keyless needs this workflow's OIDC
  # identity, so an attestation can only be produced from inside a run here --
  # a laptop cannot do it. Backfills v3.6.82/v3.6.83, whose attest step failed
  # against rekor, and is the recovery path for the next outage.
  workflow_dispatch:
    inputs:
      version:
        description: "Attest an already-released version instead of releasing, e.g. 3.6.83 (resolves v<version>, -rmux and -nix tags)"
        type: string
        required: true
      images:
        description: "Which images to attest: all (default), or a comma list of app,rmux,nix. Attesting one that already has an attestation ADDS a second one -- the transparency log is append-only -- so backfill only what is missing (#1583)."
        type: string
        required: false
        default: all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write        # push image to GHCR
  id-token: write        # cosign keyless via GitHub OIDC
  attestations: write    # cosign attest (SBOM)

jobs:
  release:
    name: Tag + GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      version: ${{ steps.detect.outputs.new }}
      app: ${{ steps.build.outputs.digest }}
      rmux: ${{ steps.build_rmux.outputs.digest }}
      nix: ${{ steps.build_nix.outputs.digest }}
    steps:
      - name: Checkout with parent commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: detect
        run: |
          NEW=$(jq -r '.version' package.json)
          OLD=$(git show HEAD~1:package.json 2>/dev/null | jq -r '.version' 2>/dev/null || echo "")

          if [ -z "$NEW" ] || [ "$NEW" = "null" ]; then
            echo "::error::package.json has no version field"
            exit 1
          fi

          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"

          if [ "$NEW" = "$OLD" ]; then
            echo "Version unchanged ($NEW) — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version bumped: ${OLD:-<none>} -> $NEW"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate CHANGELOG entry
        if: steps.detect.outputs.should_release == 'true'
        run: |
          V="${{ steps.detect.outputs.new }}"
          ESCAPED="${V//./\\.}"
          if ! grep -qE "^## ${ESCAPED}([[:space:]]|-|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing an entry for version $V."
            echo "::error::Add a heading matching: '## $V' or '## $V - <date>'"
            exit 1
          fi
          echo "CHANGELOG entry for $V found."

      - name: Check tag doesn't already exist
        if: steps.detect.outputs.should_release == 'true'
        run: |
          V="${{ steps.detect.outputs.new }}"
          if git ls-remote --exit-code --tags origin "v$V" >/dev/null 2>&1; then
            echo "::error::Tag v$V already exists on origin."
            echo "::error::Bump the version again or delete the tag with: git push origin :refs/tags/v$V"
            exit 1
          fi
          echo "Tag v$V is available."

      - name: Extract changelog section
        if: steps.detect.outputs.should_release == 'true'
        run: |
          V="${{ steps.detect.outputs.new }}"
          awk -v v="$V" '
            $0 ~ "^## " v "([[:space:]]|-|$)" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          # Trim leading/trailing blank lines
          sed -i -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}' release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::Extracted release notes are empty. Check the section between '## $V' and the next '## ' heading."
            exit 1
          fi

          echo "---- release-notes.md ----"
          cat release-notes.md
          echo "--------------------------"

      - name: Create + push tag
        if: steps.detect.outputs.should_release == 'true'
        run: |
          V="${{ steps.detect.outputs.new }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Release v$V"
          git push origin "v$V"

      - name: Create GitHub release
        if: steps.detect.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.detect.outputs.new }}"
          gh release create "v$V" \
            --title "v$V" \
            --notes-file release-notes.md \
            --verify-tag

      # ----------------------------------------------------------------------
      # P0 supply-chain pipeline: multi-arch build → push → cosign sign +
      # SBOM attest → self-verify. Runs only on a real release (version bump).
      # ----------------------------------------------------------------------

      - name: Set up QEMU
        if: steps.detect.outputs.should_release == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        if: steps.detect.outputs.should_release == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.detect.outputs.should_release == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Prefer GHCR_PAT (can read the private factory-runner-nix base
          # image the build COPYs from); GITHUB_TOKEN can't pull that unlinked
          # private package -> 403. Mirrors deploy.yml / PFactory/TFactory (#511).
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build + push bank-pilot image (WITH_RMUX=false, amd64-only)
        if: steps.detect.outputs.should_release == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          # Pin the runtime stage explicitly: the Dockerfile now has a later
          # ``build-runtime`` stage (the -nix variant), so the default last
          # stage is no longer ``runtime``.
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aifactory:v${{ steps.detect.outputs.new }}
            ghcr.io/${{ github.repository_owner }}/aifactory:latest
          # Default WITH_RMUX=false in the Dockerfile — bank-pilot image
          # contains no rmux binary and no rmux deps.  Trivy + SBOM
          # verify this in the post-build steps below.
          provenance: mode=max
          sbom: true

      # Epic #44 R3 — second image variant bundling rmux v0.3.1.
      # Tagged ``:vX-rmux``; intended for dev/demo deployments where
      # operators opt in via Helm ``rmux.enabled=true``.  Arch-pinned
      # to amd64 because rmux upstream has no aarch64 Linux build yet
      # (tracked at https://github.com/Helvesec/rmux/issues).
      - name: Build + push dev/demo image (WITH_RMUX=true, amd64-only)
        if: steps.detect.outputs.should_release == 'true'
        id: build_rmux
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          build-args: |
            WITH_RMUX=true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aifactory:v${{ steps.detect.outputs.new }}-rmux
            ghcr.io/${{ github.repository_owner }}/aifactory:latest-rmux
          provenance: mode=max
          sbom: true

      # RFC-0017 #190 — third variant: the runtime image with the Nix store
      # baked in (Dockerfile ``build-runtime`` stage). Tagged ``:vX-nix``; used
      # only as AIFACTORY_BUILD_IMAGE for packed (multi-node) build Jobs so they
      # source nix from the image instead of the node-pinned warm-store PVC.
      # Rebuild the base-security layer at most once a day. Without a
      # daily-changing build arg the `apt-get upgrade` layer is served from
      # the build cache indefinitely, so Debian security fixes never reach the
      # image (CFactory#440).
      - name: Compute security-refresh token
        run: echo "SECURITY_REFRESH=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build + push -nix build image (baked Nix store, amd64-only)
        if: steps.detect.outputs.should_release == 'true'
        id: build_nix
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: build-runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aifactory:v${{ steps.detect.outputs.new }}-nix
            ghcr.io/${{ github.repository_owner }}/aifactory:latest-nix
          # The Nix-store COPY is the heavy layer; gha cache lets re-releases
          # reuse it instead of re-pulling/re-COPYing the substrate each time.
          build-args: |
            SECURITY_REFRESH=${{ env.SECURITY_REFRESH }}
          cache-from: type=gha,scope=aifactory-nix
          cache-to: type=gha,mode=max,scope=aifactory-nix
          provenance: mode=max
          sbom: true

      - name: Install cosign
        if: steps.detect.outputs.should_release == 'true'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign both images (cosign keyless via Sigstore + GitHub OIDC)
        if: steps.detect.outputs.should_release == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/aifactory@${{ steps.build.outputs.digest }}"
          IMAGE_RMUX="ghcr.io/${{ github.repository_owner }}/aifactory@${{ steps.build_rmux.outputs.digest }}"
          IMAGE_NIX="ghcr.io/${{ github.repository_owner }}/aifactory@${{ steps.build_nix.outputs.digest }}"
          cosign sign --yes "$IMAGE"
          cosign sign --yes "$IMAGE_RMUX"
          cosign sign --yes "$IMAGE_NIX"

          # Proves the CLUSTER can read these, not just cosign. Factory#804.
          repo="ghcr.io/${{ github.repository_owner }}/aifactory"
          ./.github/scripts/assert-signature-location.sh "$repo" "${{ steps.build.outputs.digest }}"
          ./.github/scripts/assert-signature-location.sh "$repo" "${{ steps.build_rmux.outputs.digest }}"
          ./.github/scripts/assert-signature-location.sh "$repo" "${{ steps.build_nix.outputs.digest }}"

      - name: Verify signature (release self-test)
        if: steps.detect.outputs.should_release == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/aifactory@${{ steps.build.outputs.digest }}"
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository_owner }}/AIFactory/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE"

  # #1583: SBOMs + attestation, split out of `release` on purpose.
  #
  # Both 2026-09-18 releases went RED here while the tag, the GitHub release and
  # all three images had already been created -- so "released, evidence missing"
  # was indistinguishable from "release failed", at ~33 min per run to find out.
  # Six `cosign attest` calls ran with no retry against rekor.sigstore.dev, a
  # public service: one bad response failed the release.
  #
  # Split, this job is the only red thing when evidence is missing, and it can be
  # re-run alone (~16 min, mostly syft scanning the 2.25 GB -nix image). Each
  # attest now retries; an exhausted retry still FAILS -- attestation is a gate,
  # and `continue-on-error` is what hid a broken OpenAPI generation for 20+
  # releases (see the comment in techdocs/#906).
  #
  # Re-attesting adds a SECOND attestation rather than replacing the first, so a
  # dispatch backfill is a once-per-release action, run knowingly.
  sbom-attest:
    name: SBOMs + attestation
    needs: release
    if: >-
      always()
      && (github.event_name == 'workflow_dispatch'
          || (needs.release.result == 'success' && needs.release.outputs.should_release == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # gh release upload of the SBOM files
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}"

      # On a push the digests come from the release job. On a dispatch they are
      # RESOLVED from the release's own tags, so a version that was never
      # released fails here rather than attesting the wrong thing.
      - name: Resolve the three image digests
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ inputs.version }}
          IMAGES: ${{ inputs.images }}
          OWNER: ${{ github.repository_owner }}
          APP: ${{ needs.release.outputs.app }}
          RMUX: ${{ needs.release.outputs.rmux }}
          NIX: ${{ needs.release.outputs.nix }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${OWNER}/aifactory"
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            want="${IMAGES:-all}"
            for pair in "app:v${VERSION}" "rmux:v${VERSION}-rmux" "nix:v${VERSION}-nix"; do
              name="${pair%%:*}"; tag="${pair#*:}"
              # Skip anything not selected: re-attesting adds a duplicate.
              if [ "${want}" != "all" ] && ! printf '%s' ",${want}," | grep -q ",${name},"; then
                echo "skipping ${name} (not in images=${want})"
                continue
              fi
              digest=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "${repo}:${tag}" | tr -d '"')
              if [ -z "${digest}" ]; then
                echo "::error::no image at ${repo}:${tag} — was ${VERSION} released?"
                exit 1
              fi
              echo "${name}=${repo}@${digest}" >> "$GITHUB_OUTPUT"
              echo "resolved ${tag} -> ${digest}"
            done
          else
            {
              echo "app=${repo}@${APP}"
              echo "rmux=${repo}@${RMUX}"
              echo "nix=${repo}@${NIX}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SBOMs + attest all three images
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE: ${{ steps.refs.outputs.app }}
          IMAGE_RMUX: ${{ steps.refs.outputs.rmux }}
          IMAGE_NIX: ${{ steps.refs.outputs.nix }}
        run: |
          set -euo pipefail

          # rekor.sigstore.dev is a public service and this step makes six calls
          # to it; one bad response used to fail the whole release (#1583). Retry
          # each, then fail loudly -- never silently continue.
          attest() {  # $1=type  $2=predicate  $3=image
            for delay in 5 20 60 stop; do
              if cosign attest --yes --type "$1" --predicate "$2" "$3"; then
                return 0
              fi
              if [ "${delay}" = stop ]; then
                break
              fi
              echo "::warning::attest $1 for $3 failed; retrying in ${delay}s (rekor is a public service)"
              sleep "${delay}"
            done
            echo "::error::could not attest $1 for $3 after 4 attempts (5s/20s/60s backoff)"
            return 1
          }

          # Bank-pilot image
          if [ -z "${IMAGE:-}" ]; then
            echo "app image not selected; skipping"
          else
          syft scan "$IMAGE" -o spdx-json=sbom.spdx.json
          syft scan "$IMAGE" -o cyclonedx-json=sbom.cyclonedx.json
          attest spdxjson  sbom.spdx.json      "$IMAGE"
          attest cyclonedx sbom.cyclonedx.json "$IMAGE"

          fi

          # Dev/demo image (rmux variant)
          if [ -z "${IMAGE_RMUX:-}" ]; then
            echo "rmux image not selected; skipping"
          else
          syft scan "$IMAGE_RMUX" -o spdx-json=sbom-rmux.spdx.json
          syft scan "$IMAGE_RMUX" -o cyclonedx-json=sbom-rmux.cyclonedx.json
          attest spdxjson  sbom-rmux.spdx.json      "$IMAGE_RMUX"
          attest cyclonedx sbom-rmux.cyclonedx.json "$IMAGE_RMUX"

          fi

          # -nix build image (baked Nix store; RFC-0017 #190)
          if [ -z "${IMAGE_NIX:-}" ]; then
            echo "nix image not selected; skipping"
          else
          syft scan "$IMAGE_NIX" -o spdx-json=sbom-nix.spdx.json
          syft scan "$IMAGE_NIX" -o cyclonedx-json=sbom-nix.cyclonedx.json
          attest spdxjson  sbom-nix.spdx.json      "$IMAGE_NIX"
          attest cyclonedx sbom-nix.cyclonedx.json "$IMAGE_NIX"
          fi

      # The SBOM files exist only in THIS job since #1583 moved syft here; the
      # upload used to stay behind in `release`, which then failed on every
      # release looking for files it no longer generated.
      - name: Upload SBOM artifacts to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.release.outputs.version }}
        run: gh release upload "v${V}" sbom.spdx.json sbom.cyclonedx.json --clobber

      - name: Summary
        env:
          IMAGE: ${{ steps.refs.outputs.app }}
          IMAGE_RMUX: ${{ steps.refs.outputs.rmux }}
          IMAGE_NIX: ${{ steps.refs.outputs.nix }}
        run: |
          {
            echo "### SBOM attestations"
            for i in "$IMAGE" "$IMAGE_RMUX" "$IMAGE_NIX"; do
              [ -n "${i}" ] && echo "- \`${i}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
