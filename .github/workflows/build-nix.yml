name: Publish -nix build image

# RFC-0017 #190 — publish the ``-nix`` build-image variant (Dockerfile
# ``build-runtime`` stage: the runtime image + a baked ``/nix/store``). This
# image is consumed ONLY as ``AIFACTORY_BUILD_IMAGE`` for packed (multi-node)
# run.py build Jobs, so they source nix from the image instead of co-mounting
# the node-pinned ``aifactory-nix-store`` warm-store PVC (which re-pins the Job).
#
# Kept separate from deploy.yml (which ships the lean ``runtime`` image on every
# main push): baking the multi-GB nix store onto every deploy would tax CD for an
# image most pushes don't change. But the ``-nix`` image bakes the WHOLE repo
# (Dockerfile ``runtime`` stage: ``COPY . …``), so it carries the code the build
# Job executes — ``apps/backend/**`` (run.py, cli, core). #856: firing only on
# ``Dockerfile`` meant a pure-Python fix to the Job path never produced a new
# image, so build Jobs ran 18-day-old code while the fix looked shipped. So this
# now ALSO fires on ``apps/backend/**`` (the Job's own code, self-contained there
# — control-plane-only ``apps/web-server/**`` changes deliberately do NOT rebuild
# this heavy image, as the Job never runs them). The gha cache
# (scope=aifactory-nix) keeps the incremental rebuild to the code layers.
#
# After publishing, this AUTO-PINS ``AIFACTORY_BUILD_IMAGE`` in factory-gitops to
# the new ``:sha-<short>-nix`` tag (#856 half 2) — the pin was manual and drifted
# 18 days. deploy.yml pushes to the same gitops repo on the same main commit, so
# the pin push retries on conflict. Pair stays ``AIFACTORY_PACKED_NIX_IN_IMAGE=true``.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'apps/backend/**'
      - '.github/workflows/build-nix.yml'

concurrency:
  group: build-nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write        # cosign keyless via GitHub OIDC (Factory#430)

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aifactory
  GITOPS_REPO: olafkfreund/factory-gitops
  GITOPS_PATH: apps/aifactory/manifests

jobs:
  build-nix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AIFactory
        uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}"

      # amd64 only — the substrate (tfactory-runner-nix) is amd64-only and the
      # p510 k3d cluster is amd64. The gha cache (scope=aifactory-nix) lets a
      # re-run reuse the heavy /nix/store COPY layer instead of re-pulling it.
      - name: Build + push -nix build image (target build-runtime)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: build-runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}-nix
            ${{ env.IMAGE }}:latest-nix
          cache-from: type=gha,scope=aifactory-nix
          cache-to: type=gha,mode=max,scope=aifactory-nix

      # Factory#430 — the Kyverno policy matches `ghcr.io/olafkfreund/aifactory:*`,
      # which includes the `-nix` tags published here. Build Jobs run this image,
      # so it is code execution and must be signed like any other.
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign -nix image (cosign keyless via Sigstore + GitHub OIDC)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Verify signature (self-test)
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository_owner }}/AIFactory/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      # #856 half 2 — auto-pin AIFACTORY_BUILD_IMAGE so the freshly built image is
      # actually what build Jobs run. Without this the pin was manual and drifted
      # 18 days: images were published but never consumed.
      - name: Checkout factory-gitops
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Pin AIFACTORY_BUILD_IMAGE to the new -nix tag
        working-directory: gitops/${{ env.GITOPS_PATH }}
        env:
          TAG: ${{ steps.tags.outputs.sha }}-nix
        run: |
          # Replace only the tag portion of the pinned build-image env value; the
          # value format is a fixed inline-map line in manifests.yaml.
          sed -i -E \
            's|(AIFACTORY_BUILD_IMAGE, value: "ghcr\.io/olafkfreund/aifactory:)sha-[0-9a-f]+-nix(")|\1'"${TAG}"'\2|' \
            manifests.yaml
          echo "Pinned AIFACTORY_BUILD_IMAGE -> :${TAG}"
          grep -n 'AIFACTORY_BUILD_IMAGE' manifests.yaml

      - name: Commit + push the pin (retry on conflict with deploy.yml)
        working-directory: gitops
        env:
          TAG: ${{ steps.tags.outputs.sha }}-nix
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "AIFACTORY_BUILD_IMAGE already at ${TAG}; nothing to commit."
            exit 0
          fi
          git add ${{ env.GITOPS_PATH }}/manifests.yaml
          git commit -m "cd(aifactory): pin AIFACTORY_BUILD_IMAGE ${TAG} [skip ci]

          From olafkfreund/AIFactory@${{ github.sha }} (build-nix, #856)"
          # deploy.yml pushes to this repo on the same main commit — rebase+retry
          # so whichever lands second doesn't fail on non-fast-forward.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt ${attempt}"; exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing…"
            git pull --rebase --autostash origin main || true
            sleep $(( (RANDOM % 5) + attempt ))
          done
          echo "::error::could not push the build-image pin after 5 attempts"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Published + pinned \`${{ steps.tags.outputs.sha }}-nix\`"
            echo "Image: \`${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}-nix\`"
            echo ""
            echo "\`AIFACTORY_BUILD_IMAGE\` auto-pinned in factory-gitops → ArgoCD will"
            echo "roll it to build Jobs (paired with \`AIFACTORY_PACKED_NIX_IN_IMAGE=true\`)."
          } >> "$GITHUB_STEP_SUMMARY"
