name: factory_common drift

# Keeps the vendored apps/backend/factory_common/ copy byte-identical to the
# canonical shared/factory-common/factory_common/ layer in the Factory hub
# (epic Factory#154, issue Factory#161). The hub is the single source of truth;
# this gate fails the build if the local copy drifts from the hub at the SHA
# pinned in apps/backend/factory_common/.hub-sha.
#
# This mirrors the config-drift job in cq-ratchet.yml (which does the same for
# the vendored standards/ baseline): check out the hub at the pinned SHA and
# diff the tracked files byte-for-byte.

on:
  pull_request:
    branches: [dev, main, "feat/**", "release/**"]
    paths:
      - "apps/backend/factory_common/**"
      - ".github/workflows/cq-factory-common-drift.yml"
  push:
    branches: [dev, main]
    paths:
      - "apps/backend/factory_common/**"

permissions:
  contents: read

concurrency:
  group: factory-common-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: vendored factory_common matches the hub canonical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aifactory

      - name: Read pinned hub SHA
        id: pin
        # Validated before use, because this file comes from the PR's own tree:
        # on a fork PR its contents are attacker-controlled, and the value is
        # handed straight to actions/checkout as a `ref`. Reject anything that is
        # not a bare 40-character commit id.
        run: |
          set -euo pipefail
          sha="$(tr -d '[:space:]' < aifactory/apps/backend/factory_common/.hub-sha)"
          if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "factory_common/.hub-sha is not a 40-character commit SHA: '${sha}'" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # No continue-on-error: an unreachable hub is a gate that cannot run, and
      # per standards rule 4.7 that must fail rather than pass. This step used
      # to be `continue-on-error: true` with the diff below guarded on
      # `steps.hub.outcome == 'success'`, so a private repo, an expired token,
      # a renamed hub or a garbage-collected pin would skip the diff and report
      # SUCCESS from a blocking gate. If Factory becomes private, add a read
      # token here - do not restore the soft-skip. AIFactory#1095, and the same
      # removal #1092 made in cq-ratchet.yml.
      - name: Check out hub factory-common at the pinned SHA
        uses: actions/checkout@v4
        with:
          repository: olafkfreund/Factory
          ref: ${{ steps.pin.outputs.sha }}
          path: factory-hub
          # This tree is only ever diffed, never executed, and nothing here runs
          # git against it afterwards. Do not leave the job token behind in
          # factory-hub/.git/config, where a checked-out ref chosen by the PR
          # would sit next to it.
          persist-credentials: false

      - name: Diff vendored factory_common against the pinned hub canonical
        run: |
          set -euo pipefail
          canonical="factory-hub/shared/factory-common/factory_common"
          vendored="aifactory/apps/backend/factory_common"
          for f in __init__.py http.py secrets.py; do
            if ! diff "$vendored/$f" "$canonical/$f"; then
              echo "DRIFT: $vendored/$f diverged from the hub canonical ($canonical/$f)."
              echo "Re-vendor from the hub and bump apps/backend/factory_common/.hub-sha,"
              echo "or land the change in shared/factory-common/ in the hub first."
              exit 1
            fi
          done
          echo "No drift: vendored factory_common matches the pinned hub canonical."
