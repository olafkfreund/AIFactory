name: CodeQL

# Static security analysis for the languages this repo actually ships.
#
# Added because four of the five fleet repos reported zero code-scanning
# alerts purely because nothing was looking. The Trivy P0 gate covers
# dependency CVEs; this covers defects in our own code (injection, path
# traversal, stack-trace exposure) that no dependency scanner sees.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    # Weekly, so a newly published query still finds old code.
    - cron: "17 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # `actions` analysis reads workflow definitions; CodeQL wants this scope to
      # resolve reusable-workflow and action references it does not have on disk.
      actions: read
    strategy:
      fail-fast: false
      # `actions` added. TFactory already scanned it; the other three did not.
      # This repo's workflows ARE attack surface, and have carried real defects:
      # a required status context no job produced (Factory#529), a gitops push
      # with no retry that shipped nothing while reporting success (Factory#527),
      # and a bot guard that read a closed PR as open (#1148). CodeQL's actions
      # pack catches the security-shaped subset of that class -- untrusted
      # `github.event.*` interpolated into `run:`, over-broad permissions,
      # unpinned third-party actions.
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          language: ${{ matrix.language }}
          # security-and-quality moves INTO the config file rather than being
          # dropped: a config-file replaces this input, so listing the suite
          # there keeps the same breadth while adding the sanitizer-aware
          # path-injection query (#1044).
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
