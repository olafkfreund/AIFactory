name: secret-scan

on:
  pull_request:
  schedule:
    - cron: '13 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-diff-scan:
    if: github.event_name == 'pull_request'
    name: gitleaks (PR diff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WITHOUT THIS the action uses its own bundled config and never reads
          # this repo's .gitleaks.toml, so every reviewed allowlist entry is
          # silently ignored. The full-history CLI step runs
          # `gitleaks detect --source .`, which picks the file up from the repo
          # root automatically -- so the two paths disagreed about the same
          # repo, and PRs failed on the secret scanner's OWN test fixtures
          # while the scheduled scan passed. Found on AIFactory#1335.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  full-history-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WITHOUT THIS the action uses its own bundled config and never reads
          # this repo's .gitleaks.toml, so every reviewed allowlist entry is
          # silently ignored. The full-history CLI step runs
          # `gitleaks detect --source .`, which picks the file up from the repo
          # root automatically -- so the two paths disagreed about the same
          # repo, and PRs failed on the secret scanner's OWN test fixtures
          # while the scheduled scan passed. Found on AIFactory#1335.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      # gitleaks-action's documented usage does not spell out its scan-range
      # behavior per event type, so this repeats the check with an explicit
      # full git-history scan via the CLI to guarantee schedule/dispatch runs
      # never silently narrow to a diff.
      - name: Install gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Download under the asset's own name: sha256sum -c reads the filename
          # from checksums.txt and opens THAT path, so saving to any other name
          # makes the verification fail to open the file it just downloaded.
          # -f so an HTTP error fails here instead of writing an error page
          # into the tarball and failing later as a corrupt archive.
          curl -fsSL -o "${tarball}" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Full-history gitleaks scan
        run: ./gitleaks detect --source . --redact -v
