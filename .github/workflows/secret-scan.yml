name: secret-scan

on:
  pull_request:
  schedule:
    - cron: '13 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-diff-scan:
    if: github.event_name == 'pull_request'
    name: gitleaks (PR diff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  full-history-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # gitleaks-action's documented usage does not spell out its scan-range
      # behavior per event type, so this repeats the check with an explicit
      # full git-history scan via the CLI to guarantee schedule/dispatch runs
      # never silently narrow to a diff.
      - name: Install gitleaks CLI
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSL -o checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt"
          grep "gitleaks_8.30.1_linux_x64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Full-history gitleaks scan
        run: ./gitleaks detect --source . --redact -v
