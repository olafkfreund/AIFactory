# CodeQL advanced-setup config. Runs the default query suite for every rule,
# but swaps the stock py/path-injection for our barrier-aware variant
# (py/path-injection-sanitized), which recognises this repo's sanitizers so
# verified-safe code clears organically instead of being suppressed by hand.
#
# Stock py/path-injection reported 404 open alerts here - the largest single
# category, more than empty-except (245) or log-injection (224). At that volume
# nobody triages the list, which means a real path-injection finding is
# invisible. The point of this config is not a smaller number; it is a list
# short enough that the remaining entries get read.
name: "AIFactory CodeQL config"
queries:
  # security-and-quality is listed EXPLICITLY. The workflow previously passed
  # it via `queries: security-and-quality`, and a config-file REPLACES that
  # input -- so omitting it here would quietly drop the repo from the broad
  # suite to CodeQL's narrower default while this change advertised itself as
  # an improvement. That would have cost the quality rules that make up most
  # of the current alert volume (py/unused-import, py/empty-except, ...).
  - uses: security-and-quality
  - uses: ./.github/codeql/custom-queries
query-filters:
  - exclude:
      id: py/path-injection
  # Same swap for command injection (#1267). Of the seven Python alerts, one
  # was a real argument injection (`git log --output=<file>` reachable from a
  # changelog request body) and is fixed in code; the rest reach a list-form
  # argv whose values are now asserted by named helpers in
  # services/argv_safety.py. Those helpers are imported, so stock CodeQL does
  # not follow them -- py/command-line-injection-sanitized is the identical
  # query with them registered as barriers, and it reports zero only because
  # the assertions exist.
  - exclude:
      id: py/command-line-injection
  # Same trade, second rule family. py/full-ssrf and py/partial-ssrf have no
  # notion of a validator: the guard in services/url_safety.py resolves the
  # host, refuses the metadata range and non-http(s) schemes, and blocks
  # redirects, yet the alert stayed open after it landed because stock CodeQL
  # cannot see it. These two are excluded ONLY because
  # custom-queries/{Full,Partial}SsrfSanitized.ql re-ask the identical question
  # with that guard registered as a barrier -- same sources, same sinks, same
  # severity. Delete the replacements and you must delete these lines too.
  - exclude:
      id: py/full-ssrf
  - exclude:
      id: py/partial-ssrf
  # Fifth and last swap (#1276, #1293). `routes/settings.py`'s
  # `_write_json_store` writes `json.dumps(seal_profiles(data))`, and what
  # reaches that write is AES-256-GCM ciphertext from `crypto/secret_field.py`
  # on the repo's existing `crypto.kms` backend -- but the seal helpers are
  # imported, so stock py/clear-text-storage-sensitive-data cannot see the
  # encryption and the alert stayed open however completely the payload was
  # sealed. custom-queries/ClearTextStorageSanitized.ql is the identical query
  # with `seal`/`seal_profiles`/`seal_fields` registered as barriers, and
  # `unseal*` deliberately NOT -- their output reaching a file write is exactly
  # what this rule exists to report.
  #
  # THIS ONE IS CONDITIONAL IN A WAY THE OTHER FOUR ARE NOT. `seal()` degrades
  # to writing plaintext, with a one-time warning, when NO KMS backend was
  # selected, so the barrier asserts a key reaches the pod. Two things hold that
  # up and this exclusion must be deleted if either goes:
  # tests/helm/test_kms_key_always_wired.py (the chart always wires a key, and
  # a keyless cloud backend refuses to render at all -- #1290), and
  # crypto.kms.encryption_is_required(), which makes the fallback RAISE whenever
  # a backend WAS selected.
  #
  # Measured at CodeQL 2.26.3, the bundle this repo's code scanning runs:
  # cleared 1, NEW 0, with a vacuous-barrier control reproducing stock exactly.
  # See .github/codeql/VALIDATION.md. Note that the second open alert of this
  # rule (services/completion.py:877, CloudEvents metadata) is triaged as a
  # sensitivity false positive and is NOT suppressed -- the fork still reports
  # it.
  - exclude:
      id: py/clear-text-storage-sensitive-data
