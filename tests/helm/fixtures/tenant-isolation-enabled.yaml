# Fixture values for tenant-isolation Helm rendering tests
# (Epic #35 #36 PR-3).
#
# Minimal opt-in: turns on isolation + Gatekeeper samples but leaves
# everything else at chart defaults. Used by
# ``tests/helm/test_tenant_toggle.py`` to assert the full set of
# tenant-mode resources renders.
postgres:
  externalSecretName: test-pg

tenant:
  isolationEnabled: true
  gatekeeperEnabled: true
  networkPolicy:
    cniBackend: cilium
