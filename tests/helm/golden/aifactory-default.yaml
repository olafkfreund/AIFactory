# Source: aifactory/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aifactory
  labels:
    helm.sh/chart: aifactory-1.0.0
    app.kubernetes.io/name: aifactory
    app.kubernetes.io/instance: aifactory
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: aifactory
spec:
  # Epic #44 R3 — multi-replica rmux is out of scope for v1 (cross-pod
  # session visibility needs Redis pub/sub, planned for v1.1).  Pin
  # to 1 when ``rmux.enabled=true`` regardless of what replicaCount or
  # HPA say.  When rmux is off, honour the operator-set replicaCount.
  replicas: 1
  strategy:
    # Rolling update with maxSurge=0 — v1.0 has one replica, so we
    # tear down before bringing up to avoid double-DB-writes during
    # the version switch. v1.1 (multi-replica + Redis pub/sub) will
    # bump this to maxSurge=1.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aifactory
      app.kubernetes.io/instance: aifactory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aifactory
        app.kubernetes.io/instance: aifactory
        # What the Service now selects on. These are the pods that actually serve
        # port 3101; nothing else in the chart may carry it.
        app.kubernetes.io/component: server
      annotations:
        # Roll pods on ConfigMap change.
        checksum/config: fd50e7dd0251f8efb10b05e87debd83dbdfdd3ac8eef7d24b3b77fe10006a7c8
    spec:
      serviceAccountName: aifactory
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aifactory
          image: ghcr.io/dataseeek/aifactory:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 3101
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aifactory-config
          env:
            # FACTORY_SERVICE_NAME: this service's identity for the shared
            # factory-github VCS-client layer (canonical in the Factory hub,
            # Factory#157). The GitLab Duo-Workflow "goal" string reads this so
            # the canonical file stays byte-identical across the fleet while each
            # service still names itself. AIFactory is the canonical source, so
            # this restores its original wording ("AIFactory") at runtime.
            - name: FACTORY_SERVICE_NAME
              value: "AIFactory"
            # AIFACTORY_IMAGE: this Deployment's own resolved image ref. The pod
            # cannot read its own container image from the downward API, so the
            # chart injects it here. The RFC-0016 #671 build Job (run.py as a
            # k8s Job, AIFACTORY_BUILD_BACKEND=kubejob) defaults its Job image to
            # this value so the build runs on a python-capable image — NOT the
            # thin nix gate substrate (AIFACTORY_SANDBOX_IMAGE), which has no
            # bash/python outside `nix develop` and StartErrors the build pod.
            # Override per-deployment with AIFACTORY_BUILD_IMAGE if the build
            # should use a different image than the control plane.
            - name: AIFACTORY_IMAGE
              value: "ghcr.io/dataseeek/aifactory:1.0.0"
            # DATABASE_URL: produced by ExternalSecret OR by an
            # out-of-band Secret named values.postgres.externalSecretName.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aifactory-db
                  key: database-url
            - name: KMS_FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: aifactory-kms
                  key: fernet-key
            # Agent OS sandbox (#363 AC1): bubblewrap around each agent bash
            # command — RW only the worktree, everything else RO. Runs
            # unprivileged in-pod; PID isolation is opt-in (needs privilege).
            - name: AIFACTORY_AGENT_SANDBOX
              value: "fs"
            # #2059: the replica count this chart can reach; the server warns above 1
            # (revert idempotency is per process). An HPA renders even with rmux.
            - name: AIFACTORY_REPLICAS
              value: "1"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            # readOnlyRootFilesystem=true demands every writable path
            # be a tmpfs/emptyDir mount.
            - name: tmp
              mountPath: /tmp
            - name: aifactory-data
              mountPath: /home/nonroot/.aifactory
      volumes:
        - name: tmp
          emptyDir: {}
        - name: aifactory-data
          emptyDir: {}
---
# Source: aifactory/templates/job-migrations.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: aifactory-migrations
  labels:
    helm.sh/chart: aifactory-1.0.0
    app.kubernetes.io/name: aifactory
    app.kubernetes.io/instance: aifactory
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: aifactory
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aifactory-migrations
        app.kubernetes.io/instance: aifactory
        app.kubernetes.io/component: migrations
        app.kubernetes.io/part-of: aifactory
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: migrations
          image: ghcr.io/dataseeek/aifactory:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          command: ["/home/projects/MagesticAI/.venv/bin/python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aifactory-db
                  key: database-url
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

