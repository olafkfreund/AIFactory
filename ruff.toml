# Ruff configuration for AIFactory.
#
# The fleet-wide strict baseline (full select set, mypy, complexity caps) lives,
# pinned and vendored, in `standards/` — see standards/README.md. That baseline
# is consumed by the DIFF-SCOPED ratchet job (.github/workflows/cq-ratchet.yml),
# which holds new/touched code to the full bar (Factory standards 4.6).
#
# This file is the REPO-WIDE config used by the (blocking) `ruff check` in
# ci.yml. The whole tree cannot pass the strict baseline yet (thousands of legacy
# violations), so this config keeps documented legacy carve-outs. Per the
# standard those carve-outs are a ratchet backlog (#652), never a permanent
# loosening, and may only shrink over time (tighten-only).

# Vendored verification-core copies (Factory#158): byte-exact mirrors of the
# Factory hub canonical (scripts/), governed by the byte-exact drift gate
# (verification-core-drift workflow), NOT this repo's style bar. The repo-wide
# formatter here defaults to line-length 88; the hub canonical is formatted at
# line-length 100, so reformatting these under this config would diverge from
# the canonical and break the drift gate. Excluded for the same reason the hub
# excludes its shared/factory-github vendored mirror. (The diff-scoped strict
# ratchet still lints them via standards/ruff.toml at the fleet line-length.)
extend-exclude = [
    # Byte-exact mirror of the Factory hub canonical scripts/ratchet_helpers.py,
    # kept identical by the verification-core drift gate. The hub formats at 100;
    # letting the local formatter touch it would silently break byte-exactness
    # and the next re-vendor (Factory#403).
    "scripts/ratchet_helpers.py",
    "apps/backend/core/factory_sandbox.py",
    "apps/backend/core/nix_provisioner.py",
    # RFC-0014 (#664): byte-exact mirror of the hub canonical
    # scripts/cost_router_core.py, formatted at the fleet line-length (100). The
    # AIFactory-native budget logic that consumes it lives in
    # budget_enforcement.py, which IS linted here.
    "apps/backend/core/cost_router_core.py",
    # RFC-0016 (#190): same deal — byte-exact mirror of the hub canonical
    # scripts/artifact_store.py at the fleet line-length (100). It was vendored
    # but never excluded, so the local formatter could silently break a
    # byte-exact re-vendor (Factory#400).
    "apps/backend/core/artifact_store.py",
    # Factory#477: byte-exact mirror of the hub canonical scripts/job_dispatch.py
    # at the fleet line-length (100). It was vendored, gated by nothing and
    # excluded from nothing, so the two copies drifted in both directions and the
    # #1107 pod-label defect had to be fixed twice. Now gated; letting the local
    # 88-column formatter touch it would break the next re-vendor.
    "apps/backend/core/job_dispatch.py",
    # Factory#638: the far half of job_dispatch.trace_env — the bootstrap the
    # dispatched Job calls to join the run's trace and emit. This WAS this repo's
    # own core/tracing_bootstrap.py until TFactory's verify Job needed the same
    # emitter; it is now the hub canonical, vendored here and in TFactory, so the
    # local 88-column formatter must leave it alone like the others.
    "apps/backend/core/job_tracing.py",
    # Vendored byte-exact mirror of the Factory hub canonical, kept identical by
    # the factory_common drift gate (cq-factory-common-drift.yml). Formatting it
    # here would drift it from the hub, so ruff must leave it alone.
    "apps/backend/factory_common/",
    # Same reason, same deal: the vendored factory-github provider layer is a
    # byte-exact mirror of the hub canonical (formatted at the fleet
    # line-length 100) and is kept identical by factory-github-drift.yml.
    # Reformatting it under this config's default 88 would break that gate on
    # the next re-vendor, which is exactly what the gate exists to prevent.
    "apps/backend/runners/github/",
]

[lint]
# Enable common rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "TID251", # flake8-tidy-imports: banned-api (architecture import boundary, #261)
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "B904",   # raise from err (too many to fix now)
    "B905",   # zip without strict parameter
    "C401",   # unnecessary generator
    "C416",   # unnecessary list comprehension
    "E402",   # module level import not at top of file
    # F841 (unused local variable) is NO LONGER blanket-ignored (Factory coding
    # standards section 1.10). It is enforced repo-wide; the handful of legacy
    # hotspots that still trip it are carved out per-file in the "legacy F841
    # ratchet backlog" block below and must be cleaned when next touched.
    "W293",   # blank line contains whitespace
    "B007",   # loop control variable not used
    "F821",   # undefined name (forward refs in type hints used as strings)
    "UP035",  # deprecated typing imports (legacy modules use typing.List/Dict)
]

# ---------------------------------------------------------------------------
# Feature Architecture Standard — enforced import boundary (issue #261)
# ---------------------------------------------------------------------------
# Domain/application logic must stay free of heavy transport/runtime deps so it
# can be loaded by other processes (e.g. the FastAPI web-server) WITHOUT pulling
# in the Claude Agent SDK. See guides/architecture/feature-architecture-standard.md.
#
# Mechanism: the agent SDK (`claude_agent_sdk`) is a banned import (TID251).
# The ban is then exempted everywhere EXCEPT the pure-logic leaf modules in
# `apps/backend/qa/`, which are the codified boundary (see #260: the web-server
# loads qa/review_cycle.py + qa/review_redrive.py by file path precisely because
# importing the qa package would drag in the SDK). Adding a new SDK import to a
# qa leaf module will fail CI until it is either moved to an adapter module or
# added to the documented exception list below.
[lint.flake8-tidy-imports.banned-api]
"claude_agent_sdk".msg = "Pure-logic modules (apps/backend/qa leaf modules) must not import the Claude Agent SDK; keep SDK usage in adapter modules (reviewer/fixer/loop). See guides/architecture/feature-architecture-standard.md."

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

# --- legacy F841 ratchet backlog -------------------------------------------
# The blanket F841 ignore was dropped (Factory standards 1.10). The safe,
# auto-fixable cases were cleaned in the cq-phase0 pass; the assignments listed
# here have a side-effect-bearing RHS (function call / constructor) so ruff
# cannot remove them mechanically and removing them by hand risks dropping the
# call. They are tracked as a ratchet backlog (#652) and must be resolved when
# the file is next touched. The diff-scoped ratchet job (cq-ratchet.yml) and the
# shared baseline both enforce F841 with NO carve-out, so no NEW F841 can land.
"apps/backend/agents/parallel_integration.py" = ["F841"]
"apps/backend/analysis/ci_discovery.py" = ["F841"]
"apps/backend/cli/mcp_commands.py" = ["F841"]
"apps/backend/context/builder.py" = ["F841"]
"apps/backend/core/workspace/display.py" = ["F841"]
"apps/backend/core/workspace/finalization.py" = ["F841"]
"apps/backend/integrations/bmad/subagents/requirements_analyst.py" = ["F841"]
"apps/backend/integrations/graphiti/providers_pkg/validators.py" = ["F841"]
"apps/backend/memory/graphiti_helpers.py" = ["F841"]
"apps/backend/merge/file_merger.py" = ["F841"]
"apps/backend/merge/merge_pipeline.py" = ["F841"]
"apps/backend/merge/semantic_analysis/js_analyzer.py" = ["F841"]
"apps/backend/planner_lib/generators.py" = ["F841"]
"apps/backend/prompts_pkg/prompt_generator.py" = ["F841"]
"apps/backend/runners/github/services/parallel_followup_reviewer.py" = ["F841"]
"apps/backend/runners/github/services/parallel_orchestrator_reviewer.py" = ["F841"]
"apps/backend/runners/github/test_context_gatherer.py" = ["F841"]
"apps/backend/runners/github/test_rate_limiter.py" = ["F841"]
"apps/backend/services/orchestrator.py" = ["F841"]
"apps/backend/spec/pipeline/orchestrator.py" = ["F841"]
"apps/backend/ui/statusline.py" = ["F841"]

# --- SDK-ban exemptions (TID251) -------------------------------------------
# Adapter / transport / agent-bearing trees that LEGITIMATELY use the SDK.
# The ban is only meant to protect the qa pure-logic leaf modules, so the rest
# of the codebase is exempt. Keep these globs broad: the boundary under test is
# apps/backend/qa, not these areas.
"apps/backend/agents/*" = ["TID251"]
"apps/backend/core/*" = ["TID251"]
"apps/backend/providers/*" = ["TID251"]
"apps/backend/runners/*" = ["TID251"]
"apps/backend/mcp_server/*" = ["TID251"]
"apps/backend/analysis/*" = ["TID251"]
"apps/backend/spec_agents/*" = ["TID251"]
"apps/backend/spec/*" = ["TID251"]
"apps/backend/ideation/*" = ["TID251"]
"apps/backend/prediction/*" = ["TID251"]
"apps/backend/review/*" = ["TID251"]
"apps/backend/services/*" = ["TID251"]
"apps/backend/integrations/*" = ["TID251"]
"apps/web-server/*" = ["TID251"]
# Documented exceptions WITHIN the qa boundary: these are the agent-bearing
# adapter modules of the qa package (they run live agent sessions and so must
# import the SDK). The pure-logic leaf modules — review_cycle.py and
# review_redrive.py — are intentionally NOT listed and stay SDK-free.
"apps/backend/qa/fixer.py" = ["TID251"]
"apps/backend/qa/reviewer.py" = ["TID251"]
"apps/backend/qa/loop.py" = ["TID251"]
"apps/backend/qa/qa_loop.py" = ["TID251"]

"tests/*" = [
    "B011",   # assert false in tests
    "B017",   # assert raises bare Exception (acceptable in tests)
    "E712",   # == True/False (occasionally clearer in test assertions)
    "E722",   # bare except (acceptable in test cleanup)
    "F401",   # unused imports (availability checks)
    "F811",   # redefined-while-unused (pytest fixture argument shadowing)
    "F841",   # unused locals (tests often bind for clarity / future assertions)
    "TID251", # tests may import the agent SDK directly
]
"test_*.py" = ["F401", "F811"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
